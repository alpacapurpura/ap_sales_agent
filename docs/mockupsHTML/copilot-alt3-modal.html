<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alternativa 3: Global Sidebar + Modal Forms</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        .ai-hover-wrapper { position: relative; }
        .ai-hover-btn {
            position: absolute; top: -14px; right: 12px; opacity: 0;
            transform: translateY(4px); transition: all 0.2s ease; z-index: 60;
        }
        .ai-hover-wrapper:hover .ai-hover-btn { opacity: 1; transform: translateY(0); }
        
        .ai-highlight { animation: pulse-bg 2s ease; }
        @keyframes pulse-bg { 0%, 100% { background-color: transparent; } 50% { background-color: #f5f3ff; border-color: #8b5cf6; } }

        /* Modal backdrop blur transition */
        #modal-backdrop { transition: opacity 0.3s ease; }
        #modal-content { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        
        .modal-hidden { opacity: 0; pointer-events: none; }
        .modal-content-hidden { opacity: 0; transform: scale(0.95) translateY(10px); pointer-events: none; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex overflow-hidden text-slate-900">

    <!-- MAIN APP WRAPPER (Left Nav + Content) -->
    <div class="flex-1 flex overflow-hidden">
        <aside class="w-16 md:w-64 bg-slate-900 text-white flex flex-col justify-between hidden sm:flex shrink-0">
            <div class="h-16 flex items-center px-6 border-b border-slate-800">
                <i data-lucide="triangle" class="w-6 h-6 text-blue-500"></i>
                <span class="ml-2 font-bold text-lg hidden md:block">Visionarias</span>
            </div>
        </aside>

        <main class="flex-1 flex flex-col relative min-w-0 bg-white">
            <header class="h-16 border-b border-gray-200 flex items-center justify-between px-6 bg-white shrink-0">
                <h1 class="text-lg font-semibold">Brand Studio</h1>
                <button class="md:hidden p-2 text-purple-600 bg-purple-50 rounded-md" onclick="toggleCopilot()">
                    <i data-lucide="sparkles" class="w-5 h-5"></i>
                </button>
            </header>

            <div class="flex-1 overflow-y-auto p-8 bg-gray-50">
                <div class="max-w-3xl mx-auto space-y-12">
                    <div>
                        <div class="border-b pb-2 mb-6 flex justify-between items-end">
                            <div>
                                <span class="text-blue-600 font-bold text-sm tracking-wider uppercase">CAPÍTULO 1</span>
                                <h2 class="text-2xl font-bold mt-1">Origen y Estrategia</h2>
                            </div>
                            <!-- AHORA ABRE UN MODAL EN VEZ DE UN SIDEBAR -->
                            <button class="flex items-center gap-2 text-sm text-blue-600 font-medium hover:bg-blue-50 px-3 py-1.5 rounded-md" onclick="openModal()">
                                <i data-lucide="pencil" class="w-4 h-4"></i> Editar Sección
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- RIGHT SIDEBAR: COPILOT GLOBAL (Siempre visible en desktop) -->
    <aside id="copilot-sidebar" class="w-[380px] bg-white border-l border-gray-200 flex flex-col shadow-xl z-20 shrink-0">
        <div class="h-16 flex items-center px-4 border-b border-gray-200 bg-white shrink-0">
            <div class="flex items-center gap-2 text-purple-700">
                <div class="w-8 h-8 rounded-md bg-purple-100 flex items-center justify-center">
                    <i data-lucide="sparkles" class="w-4 h-4"></i>
                </div>
                <h3 class="font-semibold">Visionarias Copilot</h3>
            </div>
        </div>

        <div id="chat-history" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50/50 text-sm">
            <div class="flex gap-3">
                <div class="w-7 h-7 rounded-full bg-purple-600 text-white flex items-center justify-center shrink-0"><i data-lucide="sparkles" class="w-3.5 h-3.5"></i></div>
                <div class="bg-white border border-gray-200 p-3 rounded-2xl rounded-tl-none shadow-sm text-gray-700">
                    Hola. Soy tu asistente global. Si abres cualquier formulario y haces clic en "Chat" sobre un campo, sabré exactamente qué quieres editar.
                </div>
            </div>
        </div>

        <div class="p-4 bg-white border-t border-gray-200 shrink-0">
            <div id="active-context" class="hidden mb-2 items-center gap-1.5 bg-purple-50 border border-purple-100 px-2 py-1 rounded-md text-xs font-medium text-purple-800 w-fit">
                <i data-lucide="database" class="w-3 h-3"></i> <span id="context-label"></span>
                <button onclick="clearContext()" class="ml-1 hover:text-purple-900"><i data-lucide="x" class="w-3 h-3"></i></button>
            </div>
            <div class="relative flex items-end gap-2">
                <textarea id="chat-input" rows="1" class="w-full bg-gray-100 border-transparent rounded-xl pl-3 pr-10 py-3 text-sm focus:bg-white focus:ring-2 focus:ring-purple-500 outline-none resize-none" placeholder="Pregunta o pide cambios..."></textarea>
                <button class="absolute right-2 bottom-2 w-8 h-8 flex items-center justify-center bg-purple-600 text-white rounded-lg hover:bg-purple-700" onclick="simulateAI()">
                    <i data-lucide="arrow-up" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </aside>

    <!-- OVERLAY MODAL PARA FORMULARIOS (En vez de Sheet) -->
    <div id="modal-backdrop" class="modal-hidden fixed inset-0 bg-slate-900/40 z-40 backdrop-blur-sm flex items-center justify-center p-4">
        <!-- Notar que no ocupa el 100% del ancho para no tapar el Copilot en Desktop -->
        <div id="modal-content" class="modal-content-hidden bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden relative">
            
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-white">
                <div>
                    <h2 class="text-lg font-bold">Editar Origen y Estrategia</h2>
                    <p class="text-sm text-gray-500">Capítulo 1 del Brand Book</p>
                </div>
                <button class="p-2 text-gray-400 hover:bg-gray-100 rounded-full" onclick="closeModal()"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <div class="flex-1 overflow-y-auto p-6 space-y-6 bg-gray-50/50">
                <div class="bg-white p-5 rounded-xl border border-gray-200 space-y-5 shadow-sm">
                    <h3 class="font-semibold text-gray-900">Metodología</h3>
                    
                    <div class="space-y-1.5 ai-hover-wrapper">
                        <label class="text-sm font-medium text-slate-700">Nombre de Metodología</label>
                        <input type="text" id="methodology_name" value="Ciclo Nova" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <button class="ai-hover-btn flex items-center gap-1.5 px-2 py-1 bg-purple-100 border border-purple-200 rounded-full text-xs font-medium text-purple-700 hover:bg-purple-200 shadow-sm" onclick="setContext('methodology_name', 'Nombre Metodología')">
                            <i data-lucide="sparkles" class="w-3 h-3"></i> Chat
                        </button>
                    </div>

                    <div class="space-y-1.5 ai-hover-wrapper">
                        <label class="text-sm font-medium text-slate-700">Descripción de Metodología</label>
                        <textarea id="methodology_desc" rows="3" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">Un proceso iterativo de 4 pasos para garantizar resultados en ventas con IA.</textarea>
                        <button class="ai-hover-btn flex items-center gap-1.5 px-2 py-1 bg-purple-100 border border-purple-200 rounded-full text-xs font-medium text-purple-700 hover:bg-purple-200 shadow-sm" onclick="setContext('methodology_desc', 'Desc. Metodología')">
                            <i data-lucide="sparkles" class="w-3 h-3"></i> Chat
                        </button>
                    </div>
                </div>
            </div>

            <div class="px-6 py-4 border-t border-gray-100 bg-white flex justify-end gap-3">
                <button class="px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100 rounded-lg" onclick="closeModal()">Cancelar</button>
                <button class="px-4 py-2 text-sm font-medium bg-blue-600 text-white hover:bg-blue-700 rounded-lg shadow-sm" onclick="closeModal()">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let currentField = null;

        function openModal() {
            document.getElementById('modal-backdrop').classList.remove('modal-hidden');
            document.getElementById('modal-content').classList.remove('modal-content-hidden');
        }
        function closeModal() {
            document.getElementById('modal-backdrop').classList.add('modal-hidden');
            document.getElementById('modal-content').classList.add('modal-content-hidden');
        }

        function setContext(fieldId, label) {
            currentField = fieldId;
            document.getElementById('active-context').classList.remove('hidden');
            document.getElementById('active-context').classList.add('flex');
            document.getElementById('context-label').innerText = label;
            document.getElementById('chat-input').focus();
            
            document.getElementById(fieldId).classList.add('ring-2', 'ring-purple-500');
            setTimeout(() => document.getElementById(fieldId).classList.remove('ring-2', 'ring-purple-500'), 1500);
        }

        function clearContext() {
            currentField = null;
            document.getElementById('active-context').classList.add('hidden');
            document.getElementById('active-context').classList.remove('flex');
        }

        function simulateAI() {
            const input = document.getElementById('chat-input');
            const history = document.getElementById('chat-history');
            if(!input.value.trim()) return;

            history.innerHTML += `
                <div class="flex gap-3 justify-end">
                    <div class="bg-blue-600 text-white p-3 rounded-2xl rounded-tr-none shadow-sm text-sm">${input.value}</div>
                </div>
            `;
            input.value = '';
            history.scrollTop = history.scrollHeight;

            setTimeout(() => {
                if(currentField) {
                    const field = document.getElementById(currentField);
                    field.value = "Un ecosistema sinérgico diseñado para automatización cognitiva.";
                    field.classList.add('ai-highlight');
                    
                    history.innerHTML += `
                        <div class="flex gap-3">
                            <div class="w-7 h-7 rounded-full bg-purple-600 text-white flex items-center justify-center shrink-0"><i data-lucide="sparkles" class="w-3.5 h-3.5"></i></div>
                            <div class="bg-white border border-gray-200 p-3 rounded-2xl rounded-tl-none shadow-sm text-gray-700">
                                He actualizado el campo directamente en el modal que tienes abierto.
                            </div>
                        </div>
                    `;
                } else {
                    history.innerHTML += `
                        <div class="flex gap-3">
                            <div class="w-7 h-7 rounded-full bg-purple-600 text-white flex items-center justify-center shrink-0"><i data-lucide="sparkles" class="w-3.5 h-3.5"></i></div>
                            <div class="bg-white border border-gray-200 p-3 rounded-2xl rounded-tl-none shadow-sm text-gray-700">
                                Por favor abre un formulario y selecciona un campo para que pueda ayudarte a editarlo.
                            </div>
                        </div>
                    `;
                }
                history.scrollTop = history.scrollHeight;
            }, 1000);
        }
    </script>
</body>
</html>
