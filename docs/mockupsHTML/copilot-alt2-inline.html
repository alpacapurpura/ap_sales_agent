<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alternativa 2: Inline Popover (Copilot Focalizado)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        .ai-hover-wrapper { position: relative; }
        .ai-hover-btn {
            position: absolute; top: -14px; right: 12px; opacity: 0;
            transform: translateY(4px); transition: all 0.2s ease; z-index: 20;
        }
        .ai-hover-wrapper:hover .ai-hover-btn, .ai-hover-wrapper:focus-within .ai-hover-btn { opacity: 1; transform: translateY(0); }
        
        .ai-highlight { animation: pulse-bg 2s ease; }
        @keyframes pulse-bg { 0%, 100% { background-color: transparent; } 50% { background-color: #f5f3ff; border-color: #8b5cf6; } }

        /* Floating Popover Animation */
        #inline-copilot {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            transform-origin: top center;
        }
        .popover-hidden { opacity: 0; transform: scaleY(0.95) translateY(-10px); pointer-events: none; position: absolute; }
        .popover-visible { opacity: 1; transform: scaleY(1) translateY(0); position: relative; margin-top: 8px;}
    </style>
</head>
<body class="bg-gray-100 h-screen flex overflow-hidden text-slate-900">

    <aside class="w-16 md:w-64 bg-slate-900 text-white flex flex-col justify-between hidden sm:flex shrink-0">
        <div>
            <div class="h-16 flex items-center px-6 border-b border-slate-800">
                <i data-lucide="triangle" class="w-6 h-6 text-blue-500"></i>
                <span class="ml-2 font-bold text-lg hidden md:block">Visionarias</span>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col relative min-w-0 bg-white border-r border-gray-200">
        <header class="h-16 border-b border-gray-200 flex items-center justify-between px-6 bg-white shrink-0">
            <h1 class="text-lg font-semibold">Brand Studio</h1>
        </header>

        <div class="flex-1 overflow-y-auto p-8 bg-gray-50">
            <div class="max-w-3xl mx-auto space-y-12">
                <div>
                    <div class="border-b pb-2 mb-6 flex justify-between items-end">
                        <div>
                            <span class="text-blue-600 font-bold text-sm tracking-wider uppercase">CAPÍTULO 1</span>
                            <h2 class="text-2xl font-bold mt-1">Origen y Estrategia</h2>
                        </div>
                        <button class="flex items-center gap-2 text-sm text-blue-600 font-medium hover:bg-blue-50 px-3 py-1.5 rounded-md" onclick="openSidebar()">
                            <i data-lucide="pencil" class="w-4 h-4"></i> Editar Sección
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- RIGHT SIDEBAR NORMAL (El que ya tienes) -->
    <aside id="right-sidebar" class="w-[450px] bg-white flex flex-col shadow-2xl z-20 shrink-0 transform translate-x-full transition-transform duration-300">
        <div class="h-16 flex items-center justify-between px-4 border-b border-gray-200 shrink-0">
            <h3 class="font-semibold">Editar Origen y Estrategia</h3>
            <button class="p-1.5 text-gray-400 hover:bg-gray-100 rounded-md" onclick="closeSidebar()"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>

        <div class="flex-1 overflow-y-auto p-5 space-y-6 relative">
            
            <div class="space-y-6">
                <!-- Campo Nombre Metodología -->
                <div class="space-y-1.5 ai-hover-wrapper" id="wrap-name">
                    <label class="text-sm font-medium text-slate-700">Nombre de Metodología</label>
                    <input type="text" id="methodology_name" value="Ciclo Nova" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                    <button class="ai-hover-btn flex items-center gap-1.5 px-2 py-1 bg-white border border-purple-200 rounded-full text-xs font-medium text-purple-700 hover:bg-purple-50 shadow-sm" onclick="toggleInlineCopilot('wrap-name', 'methodology_name')">
                        <i data-lucide="sparkles" class="w-3 h-3"></i> AI Edit
                    </button>
                </div>

                <!-- Campo Descripción Metodología -->
                <div class="space-y-1.5 ai-hover-wrapper" id="wrap-desc">
                    <label class="text-sm font-medium text-slate-700">Descripción de Metodología</label>
                    <textarea id="methodology_desc" rows="4" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">Un proceso iterativo de 4 pasos para garantizar resultados en ventas con IA.</textarea>
                    <button class="ai-hover-btn flex items-center gap-1.5 px-2 py-1 bg-white border border-purple-200 rounded-full text-xs font-medium text-purple-700 hover:bg-purple-50 shadow-sm" onclick="toggleInlineCopilot('wrap-desc', 'methodology_desc')">
                        <i data-lucide="sparkles" class="w-3 h-3"></i> AI Edit
                    </button>
                    
                    <!-- EL POPOVER INLINE (Se mueve via JS debajo del wrapper activo) -->
                    <div id="inline-copilot" class="popover-hidden bg-white border border-purple-200 shadow-xl rounded-xl overflow-hidden z-30">
                        <div class="bg-purple-50/50 px-3 py-2 border-b border-purple-100 flex justify-between items-center">
                            <span class="text-xs font-semibold text-purple-700 flex items-center gap-1.5"><i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Editando con Copilot</span>
                            <button class="text-gray-400 hover:text-gray-600" onclick="closeInlineCopilot()"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
                        </div>
                        <div class="p-3 space-y-3">
                            <!-- Suggested Actions -->
                            <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar">
                                <button class="shrink-0 text-[11px] bg-gray-100 hover:bg-gray-200 px-2.5 py-1 rounded-full text-gray-700" onclick="fillInput('Hazlo más profesional y persuasivo')">Más profesional</button>
                                <button class="shrink-0 text-[11px] bg-gray-100 hover:bg-gray-200 px-2.5 py-1 rounded-full text-gray-700" onclick="fillInput('Hazlo más corto y directo')">Más corto</button>
                                <button class="shrink-0 text-[11px] bg-gray-100 hover:bg-gray-200 px-2.5 py-1 rounded-full text-gray-700" onclick="fillInput('Mejora la ortografía')">Corregir</button>
                            </div>
                            <!-- Input -->
                            <div class="relative">
                                <input type="text" id="inline-input" placeholder="O escribe instrucciones personalizadas..." class="w-full bg-gray-50 border border-gray-200 rounded-lg pl-3 pr-10 py-2 text-sm focus:bg-white focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none">
                                <button class="absolute right-1.5 top-1.5 w-6 h-6 flex items-center justify-center bg-purple-600 text-white rounded-md hover:bg-purple-700" onclick="simulateInlineAI()">
                                    <i data-lucide="arrow-up" class="w-3.5 h-3.5"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </aside>

    <script>
        lucide.createIcons();
        let activeFieldId = null;

        function openSidebar() { document.getElementById('right-sidebar').classList.remove('translate-x-full'); }
        function closeSidebar() { document.getElementById('right-sidebar').classList.add('translate-x-full'); }

        function toggleInlineCopilot(wrapperId, fieldId) {
            activeFieldId = fieldId;
            const popover = document.getElementById('inline-copilot');
            const wrapper = document.getElementById(wrapperId);
            
            // Mover popover al wrapper actual
            wrapper.appendChild(popover);
            
            popover.classList.remove('popover-hidden');
            popover.classList.add('popover-visible');
            document.getElementById('inline-input').focus();
        }

        function closeInlineCopilot() {
            const popover = document.getElementById('inline-copilot');
            popover.classList.remove('popover-visible');
            popover.classList.add('popover-hidden');
        }

        function fillInput(text) {
            document.getElementById('inline-input').value = text;
        }

        function simulateInlineAI() {
            const input = document.getElementById('inline-input');
            const field = document.getElementById(activeFieldId);
            
            if(!input.value) return;
            
            // Visual loading
            input.disabled = true;
            input.value = "Generando...";
            
            setTimeout(() => {
                if(activeFieldId === 'methodology_desc') {
                    field.value = "Un ecosistema sinérgico de 4 fases diseñado para transformar tráfico frío en evangelizadores de marca mediante automatización cognitiva.";
                } else {
                    field.value = "Sistema Elite V2";
                }
                
                field.classList.add('ai-highlight');
                setTimeout(() => field.classList.remove('ai-highlight'), 2000);
                
                input.disabled = false;
                input.value = "";
                closeInlineCopilot();
            }, 1200);
        }
    </script>
</body>
</html>
