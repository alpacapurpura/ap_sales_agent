  # ═══════════════════════════════════════════════════════════════════════
  # AGENTIC EVAL — cost + observability + voice fidelity
  # Note: pass^k + voice rubrics + adversarial suite full = stories E/F/G/I.
  # Story B baseline gates only.
  # ═══════════════════════════════════════════════════════════════════════

  - id: agentic_observability_invariants
    category: agentic_eval
    type: pytest
    cmd: "cd backend && .venv/bin/pytest tests/architecture/test_eval_simulator_observability_invariants.py -v --tb=short"
    must_pass: true
    timeout_sec: 60
    description: "Spec registered post-bootstrap import. eval_simulator_llm_call + eval_simulator_trace_event tables exist. Mandatory eval_metadata jsonb fields enforced (eval_run_kind/archetype_slug/actor_profile_id/trial_n/simulation_id/run_id). sanitize_payload applied pre-write."

  - id: agentic_cost_budget_baseline
    category: agentic_eval
    type: shell
    cmd: |
      cd backend && .venv/bin/python -c "
      import asyncio
      from sqlalchemy import create_engine, select, func
      from sqlalchemy.orm import Session
      from src.core.config import settings
      from src.modules.sales_agent.observability.eval_simulator.persistence.models import EvalSimulatorLLMCallModel
      engine = create_engine(settings.database_url)
      with Session(engine) as db:
          # Last test run cost summary
          per_sim = db.execute(
              select(EvalSimulatorLLMCallModel.eval_metadata['simulation_id'].astext.label('sim_id'),
                     func.sum(EvalSimulatorLLMCallModel.cost_usd).label('total'))
              .group_by(EvalSimulatorLLMCallModel.eval_metadata['simulation_id'].astext)
          ).all()
          assert all(row.total < 0.05 for row in per_sim), f'Individual cost cap violated: {per_sim}'
          suite_total = sum(row.total for row in per_sim)
          assert suite_total < 0.30, f'Suite total cost cap violated: {suite_total}'
          print(f'PASS — {len(per_sim)} simulations, max indiv ${max(r.total for r in per_sim):.4f}, suite total ${suite_total:.4f}')
      "
    must_pass: true
    timeout_sec: 60
    description: "D9 cost cap — individual <$0.05, suite total <$0.30 across 5-archetype parametrize + 4 single-tenant scenarios."

  - id: agentic_eval_kind_tag_enforced
    category: agentic_eval
    type: pytest
    cmd: "cd backend && .venv/bin/pytest tests/architecture/test_simulator_writes_eval_kind_tag.py -v --tb=short"
    must_pass: true
    timeout_sec: 30
    description: "H5 — every row written by simulator has metadata.eval_run_kind='simulator'. Streamlit prod queries safely filter eval traffic out."

  - id: agentic_no_mirrors_shared
    category: agentic_eval
    type: pytest
    cmd: "cd backend && .venv/bin/pytest tests/architecture/test_simulator_no_mirrors_shared.py -v --tb=short"
    must_pass: true
    timeout_sec: 30
    description: "H9 anti-mirror — no new file under simulator/*.py duplicates basename in shared/agent_observability/. Subclass via inheritance, no copy."

  - id: agentic_public_api_surface
    category: agentic_eval
    type: pytest
    cmd: "cd backend && .venv/bin/pytest tests/architecture/test_simulator_public_api_surface.py -v --tb=short"
    must_pass: true
    timeout_sec: 30
    description: "H9 — simulator/__init__.py exports exactly 7 names. No _internal symbols leaked."

  - id: agentic_termination_policy_registry_contract
    category: agentic_eval
    type: pytest
    cmd: "cd backend && .venv/bin/pytest tests/architecture/test_termination_policy_registry_contract.py -v --tb=short"
    must_pass: true
    timeout_sec: 30
    description: "H8 — TERMINATION_POLICIES registry exposes register_termination_policy publicly. Default 4 policies registered. Story I/H append-safe."

