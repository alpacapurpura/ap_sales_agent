  # ═══════════════════════════════════════════════════════════════════════
  # FUNCTIONAL — Gherkin scenarios from 01-spec.md
  # ═══════════════════════════════════════════════════════════════════════

  # --- Scenario 1 happy (parametrize × 5 archetypes) ---

  - id: scenario_happy_dual_llm_per_archetype
    category: functional
    type: pytest
    cmd: "cd backend && .venv/bin/pytest tests/agentic_evals/sales_agent/simulator/test_simulator_smoke.py::test_dual_llm_e2e_per_archetype --run-evals -v --tb=short"
    must_pass: true
    timeout_sec: 480
    scenario_id: happy
    description: "5-archetype parametrize: tenant_coach_lat / tenant_medicina_estetica / tenant_clinica_dental / tenant_agencia_growth_video / tenant_agencia_automatizacion_ia × actor_profile_lead_frio_impaciente × max_turns=3 × trial_n=0. Each runs in-process agent_app.ainvoke. Asserts: ≥2 turns, termination ∈ {goal_completion,max_turns,customer_exit}, simulation_id deterministic uuid5, schema_version=1, eval_simulator_llm_call ≥1 row, eval_simulator_trace_event ≥2 rows, transcript artifact exists, individual cost <$0.05, suite total <$0.30, tenant isolation 1 distinct tenant_id per simulation."

  # --- Scenario 2 negative ---

  - id: scenario_negative_invalid_archetype
    category: functional
    type: pytest
    cmd: "cd backend && .venv/bin/pytest tests/agentic_evals/sales_agent/simulator/test_simulator_smoke.py::test_invalid_archetype_raises_valueerror -v --tb=short"
    must_pass: true
    timeout_sec: 30
    scenario_id: negative
    description: "ValueError raised w/ valid slugs listed. Cero rows DB. Cero artifact. structlog warning emitted. Fixture eval_tenant_seeded NOT invoked (no DB inserts)."

  # --- Scenario 3 edge ---

  - id: scenario_edge_max_turns_cap
    category: functional
    type: pytest
    cmd: "cd backend && .venv/bin/pytest tests/agentic_evals/sales_agent/simulator/test_simulator_smoke.py::test_max_turns_cap --run-evals -v --tb=short"
    must_pass: true
    timeout_sec: 90
    scenario_id: edge
    description: "actor_profile_loop_forever × max_turns=2 → exact 2 agent turns, termination_reason=max_turns, transcript len ≥4 ≤5, artifact JSON contains termination_reason+cost_summary, cost_usd <$0.05."

  - id: scenario_edge_idempotency_simulation_id
    category: functional
    type: pytest
    cmd: "cd backend && .venv/bin/pytest tests/agentic_evals/sales_agent/simulator/test_simulator_smoke.py::test_idempotency_simulation_id --run-evals -v --tb=short"
    must_pass: true
    timeout_sec: 60
    scenario_id: edge
    description: "H2 idempotency — re-run with same (run_id, slug, actor_profile.id, trial_n) → same simulation_id deterministic UUID5. Artifact path stable."

  # --- Scenario 4 adversarial (2 sub-cases) ---

