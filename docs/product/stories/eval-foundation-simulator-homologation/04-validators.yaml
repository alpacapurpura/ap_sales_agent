  - id: H7
    spec_section: "Failure-mode taxonomy (AgentErrorSubtype + structlog)"
    validators: [scenario_adversarial_agent_error_graceful]
  - id: H8
    spec_section: "Termination policy registry (Strategy pattern)"
    validators: [hardening_h8_termination_registry, agentic_termination_policy_registry_contract]
  - id: H9
    spec_section: "Public API surface minimal"
    validators: [agentic_public_api_surface, agentic_no_mirrors_shared]
  - id: H10
    spec_section: "Frozen golden v1 fixture for migration regression"
    validators: [hardening_h1_schema_migration_regression]

# ═══════════════════════════════════════════════════════════════════════
# Iteration policy — autonomous build behavior
# ═══════════════════════════════════════════════════════════════════════

iteration:
  max_iterations: 3                   # D11 ratificado — service-story 2-3d, 3 cycles bastan
  on_fail: |
    1) Read failing validator output
    2) Identify exact file/line target (no shotgun edits)
    3) Apply minimal fix preserving spec intent + arch decisions
    4) Re-run failing validator only (not full suite)
    5) If pass → continue to next pending validator
  on_all_pass: |
    set state=developing→developed
    append iteration_log to T-{n}-impl-log.md
    transition checkpoint phase=BUILD_GREEN
  on_cap_reached: |
    set state=developing→blocked
    write blocker analysis to checkpoint.md
    escalate to Chris with last error trace + diagnosis hypothesis
