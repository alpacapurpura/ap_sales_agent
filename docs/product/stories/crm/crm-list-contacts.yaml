---
id: crm-list-contacts
type: service-story
module: crm
capability: contacts-cdp
status: live
slice: MVP
last_audit: 2026-05-04
date_introduced: 2026-04-30
pr_introduced: PR-10
pi_introduced: PI-1
deprecated_at: null

links:
  module_doc: "../../modules/crm.md"
  capability: "../../capabilities/crm/contacts-cdp.yaml"
  domain_doc: "../../../domains/module_crm.md"
  related_stories:
    - crm-contacts-page
    - crm-create-static-segment

context:
  job: "Como UI/copilot/integración necesito listar contactos del tenant con filtros y paginación para componer experiencias de listado, detalle y segmentación"
  why: "Sin endpoint paginado tenant-scoped no hay forma de exhibir contactos al user ni de armar segmentos. Si falla, /sales/contactos queda en blanco y campañas no pueden seleccionar audiencias."
  constraints:
    - "Tenant-scoped (header X-Tenant-ID required, validated by Depends(get_tenant_context))"
    - "Idempotente (GET puro)"
    - "18 filtros canonical forward-compat (subset PR-11 expuesto en UI lite)"
    - "Paginación por cursor o offset (DataTable headless TanStack consume)"
    - "Soft delete respected (`deleted_at IS NULL`)"

outcome:
  consumer_observable: "Cliente recibe `{items: ContactListItem[], total: int, next_cursor: str | null}` con contactos del tenant matcheando filtros"
  product_observable:
    - "DB: SELECT sobre contacts + identities + events join, scoped a tenant_id"
    - "Eventos emitidos: ninguno (read-only)"
    - "Métrics: latencia p95 < 300ms para tenant promedio (~1k contactos)"

service_contract:
  type: endpoint
  method: GET
  path: /api/v1/contacts
  request_schema: "backend/src/modules/crm/api/dto/contacts.py::ContactListQuery"
  response_schema: "backend/src/modules/crm/api/dto/contacts.py::ContactListResponse"
  auth: clerk-jwt
  rate_limit_per_tenant: "120/min"
  idempotency: none
  trigger: null

scenarios:
  - id: happy-path-paginated
    type: regression
    given:
      - "Tenant T1 tiene 50 contactos sin filtros activos"
      - "Auth válida con X-Tenant-ID=T1"
    when: "GET /api/v1/contacts?limit=20"
    then:
      - "Status 200 con items.length == 20"
      - "total == 50"
      - "next_cursor != null"
      - "Todos items.tenant_id == T1"
    graders:
      - type: contract_test
        path: "backend/tests/modules/crm/test_contacts_api.py"
      - type: state_check
        target: db
        query: "SELECT COUNT(*) FROM contacts WHERE tenant_id = ? AND deleted_at IS NULL"
        expect: "matches response.total"

  - id: invalid-filter-shape
    type: regression
    given:
      - "Auth válida"
    when: "GET /api/v1/contacts?lifecycle_stage=NOT_AN_ENUM_VALUE"
    then:
      - "Status 422 con detail explicando enum válido"
      - "DB no es queryeada (validation Pydantic falla antes)"
    graders:
      - type: contract_test
        path: "backend/tests/modules/crm/test_contacts_api.py"

  - id: filter-schema-discoverability
    type: regression
    given:
      - "Cliente FE necesita conocer filtros disponibles para construir UI dinámica"
    when: "GET /api/v1/contacts/_filter-schema"
    then:
      - "Status 200 con metadata 18 filtros (id, label, type, options)"
      - "Schema estable forward-compat entre PI-3 y FE lite PR-11"
    graders:
      - type: contract_test
        path: "backend/tests/modules/crm/test_contacts_api.py"

  - id: cross-tenant-leak
    type: regression
    given:
      - "Tenant T1 autenticado"
      - "Tenant T2 tiene contacto id=42"
    when: "GET /api/v1/contacts/42 con header X-Tenant-ID=T1"
    then:
      - "Status 404 (no leakea existencia cross-tenant)"
      - "Audit log: intento cross-tenant registrado"
      - "Response body sin campos del contacto T2"
    graders:
      - type: contract_test
        path: "backend/tests/modules/crm/test_contacts_api.py"
      - type: state_check
        target: api
        query: "GET /api/v1/contacts/42 con X-Tenant-ID=T1"
        expect: "404"

cross_module:
  reads_from:
    - campaigns
  read_by:
    - sales_agent
    - copilot
    - scheduling
    - analytics
  emits_events: []
  consumes_events: []

dependencies:
  stories: []
  capabilities: []

estimate:
  story_points: 5
  rough_hours: null
  copilot_operable: false
  copilot_tool_name: crm_search_contacts

test_coverage:
  contract_test_path: "backend/tests/modules/crm/test_contacts_api.py"
  state_check_implemented: true
  load_test_implemented: false
  coverage_pct: null
  last_run_at: null
  last_run_result: null
