# 04-validators.yaml — luana-shared-lift
#
# Schema v4: 5 categories (non_functional / functional / visual / agentic_eval / documentation).
# Each validator MUST be shell-executable. must_pass flag indicates blocking vs informational.
#
# Order of execution (mirrors §2 lift order in 03-arch.md):
#   1. Workspace registration (V-NF-1..3)
#   2. Per-package smoke (V-F-py-1..9 + V-F-ts-1..6)
#   3. Cross-package integration (V-F-x-1..3)
#   4. AISALESHT untouched (V-NF-4)
#   5. No-publish (V-NF-5..7)
#   6. Arch fitness (V-AG-1..2)
#   7. Documentation (V-D-1..2)

non_functional:
  - id: V-NF-1
    name: "uv sync --all-packages succeeds (Python workspace)"
    description: "Root pyproject.toml lists all 9 luana-core-* packages as workspace members. uv resolves all sources including cyclic platform↔llm dep."
    command: |
      cd ~/luana-platform && uv sync --all-packages 2>&1 | tail -20
      test ${PIPESTATUS[0]} -eq 0
    must_pass: true
    addressed_by_tickets: [T-1, T-13]

  - id: V-NF-2
    name: "pnpm install --frozen-lockfile succeeds (TS workspace)"
    description: "Root pnpm-workspace.yaml includes core/@luana/* glob. All 6 packages discovered and installable."
    command: |
      cd ~/luana-platform && pnpm install --frozen-lockfile 2>&1 | tail -10
      test ${PIPESTATUS[0]} -eq 0
    must_pass: true
    addressed_by_tickets: [T-1, T-13]

  - id: V-NF-3
    name: "Each Python package has pyproject.toml at version 0.0.1-alpha"
    description: "Per spec §3.1 — 9 packages × pyproject.toml at correct version."
    command: |
      cd ~/luana-platform
      MISSING=0
      for pkg in luana-core-platform luana-core-llm luana-core-channels luana-core-idempotency luana-core-observability luana-core-events luana-core-extraction luana-core-compliance luana-core-billing; do
        if [ ! -f "core/${pkg}/pyproject.toml" ]; then echo "MISSING: core/${pkg}/pyproject.toml"; MISSING=$((MISSING+1)); fi
        if ! grep -q 'version = "0.0.1-alpha"' "core/${pkg}/pyproject.toml" 2>/dev/null; then echo "WRONG VERSION: core/${pkg}"; MISSING=$((MISSING+1)); fi
      done
      test $MISSING -eq 0
    must_pass: true
    addressed_by_tickets: [T-2, T-3, T-4, T-5, T-6, T-7, T-8, T-9, T-10]

  - id: V-NF-4
    name: "AISALESHT not modified in Story 2 commits"
    description: "Per 01-spec.md §3.4. NO file under backend/src/shared/ or frontend/src/{components/ui,lib,hooks}/ modified during Story 2."
    command: |
      cd /home/chris/AISALESHT
      # Verify against last N commits during Story 2 window. STORY_BASE_SHA stored at story start.
      # Assumes /pm captures base SHA in checkpoint.md before Story 2 begins.
      BASE_SHA=$(grep -oP 'base_sha:\s*\K[a-f0-9]+' docs/product/stories/luana-shared-lift/checkpoint.md 2>/dev/null || git rev-parse HEAD)
      DIFF=$(git diff "$BASE_SHA" HEAD --name-only | grep -E '^(backend/src/shared|frontend/src/(components/ui|lib|hooks|__tests__))/' || true)
      if [ -n "$DIFF" ]; then
        echo "AISALESHT FILES MODIFIED (forbidden):"
        echo "$DIFF"
        exit 1
      fi
      echo "OK: AISALESHT untouched"
    must_pass: true
    addressed_by_tickets: [T-15]

  - id: V-NF-5
    name: "No publishConfig in any package.json"
    description: "Per 01-spec.md §3.5 — no GH Packages publishing in Story 2 (Story 9 territory)."
    command: |
      cd ~/luana-platform
      OFFENDERS=$(grep -l 'publishConfig' core/@luana/*/package.json 2>/dev/null || true)
      if [ -n "$OFFENDERS" ]; then echo "Found publishConfig in: $OFFENDERS"; exit 1; fi
      echo "OK: no publishConfig"
    must_pass: true
    addressed_by_tickets: [T-15]

  - id: V-NF-6
    name: "No .releaserc.json files"
    description: "Per 01-spec.md §3.5 — no semantic-release config."
    command: |
      cd ~/luana-platform
      FOUND=$(find . -name '.releaserc*' -not -path './node_modules/*' 2>/dev/null || true)
      if [ -n "$FOUND" ]; then echo "Found release configs: $FOUND"; exit 1; fi
      echo "OK"
    must_pass: true
    addressed_by_tickets: [T-15]

  - id: V-NF-7
    name: "No release.yml or publish workflow"
    description: "Per 01-spec.md §3.5 — no publish workflow."
    command: |
      cd ~/luana-platform
      FOUND=$(find .github/workflows -name 'release*' -o -name 'publish*' 2>/dev/null || true)
      if [ -n "$FOUND" ]; then echo "Found release/publish workflows: $FOUND"; exit 1; fi
      echo "OK"
    must_pass: true
    addressed_by_tickets: [T-15]

  - id: V-NF-8
    name: "uv run ruff check core/ GREEN"
    description: "Per 01-spec.md §3.3 — ruff baseline passes on lifted Python code (no new lint violations introduced by lift)."
    command: |
      cd ~/luana-platform && uv run ruff check core/ 2>&1 | tail -20
      test ${PIPESTATUS[0]} -eq 0
    must_pass: true
    addressed_by_tickets: [T-14]

  - id: V-NF-9
    name: "pnpm lint GREEN"
    description: "Per 01-spec.md §3.3."
    command: |
      cd ~/luana-platform && pnpm lint 2>&1 | tail -20
      test ${PIPESTATUS[0]} -eq 0
    must_pass: false  # informational — Story 1 placeholder may still echo
    addressed_by_tickets: [T-14]

  - id: V-NF-10
    name: "Each TS package has package.json at version 0.0.1-alpha and private: true"
    description: "Per spec §3.1."
    command: |
      cd ~/luana-platform
      MISSING=0
      for pkg in design-tokens hooks format ui-kit api-client schemas; do
        F="core/@luana/${pkg}/package.json"
        if [ ! -f "$F" ]; then echo "MISSING: $F"; MISSING=$((MISSING+1)); continue; fi
        if ! grep -q '"version": "0.0.1-alpha"' "$F"; then echo "WRONG VERSION: $F"; MISSING=$((MISSING+1)); fi
        if ! grep -q '"private": true' "$F"; then echo "NOT PRIVATE: $F"; MISSING=$((MISSING+1)); fi
      done
      test $MISSING -eq 0
    must_pass: true
    addressed_by_tickets: [T-11, T-12]

