  # Cross-package integration smoke
  - id: V-F-x-1
    name: "Cross-package Python import works (observability imports platform)"
    description: "Per 01-spec.md scenario D — luana_core_observability.recording imports from luana_core_platform.domain works."
    command: |
      cd ~/luana-platform && uv run python -c "
      from luana_core_observability.recording.sanitization import sanitize_payload
      from luana_core_platform.domain.base_entity import Base
      from luana_core_billing.application.budget_guard import BudgetGuard
      from luana_core_llm.factory import LLMFactory
      from luana_core_events.outbox.domain.outbox_entry import OutboxEntry
      from luana_core_channels.format import get_channel_format
      from luana_core_idempotency.domain.key import IdempotencyKey
      from luana_core_compliance.domain.lead_opt_in import LeadOptIn
      from luana_core_extraction.base_orchestrator import BaseExtractionOrchestrator
      print('all imports OK')
      "
    must_pass: true
    addressed_by_tickets: [T-13]

  - id: V-F-x-2
    name: "Cross-package TS import works (ui-kit imports format + hooks + design-tokens)"
    description: "Smoke test that workspace:* resolves correctly at TS compile."
    command: |
      cd ~/luana-platform && cat > /tmp/smoke.ts <<'TS_EOF'
      import { Button } from "@luana/ui-kit";
      import { formatMoney } from "@luana/format";
      import { useViewport } from "@luana/hooks";
      console.log(typeof Button, typeof formatMoney, typeof useViewport);
      TS_EOF
      # Use a single package's tsc to compile against workspace
      pnpm --filter @luana/ui-kit exec tsc --noEmit /tmp/smoke.ts 2>&1 | tail -10
      test ${PIPESTATUS[0]} -eq 0
    must_pass: false  # informational — barrel exports may need ticket polish
    addressed_by_tickets: [T-13]

  - id: V-F-x-3
    name: "uv run pytest entire luana-platform GREEN"
    description: "Aggregate test runs all 9 package suites + arch fitness in one command."
    command: |
      cd ~/luana-platform && uv run pytest core/ -x -q --tb=short --ignore=core/src 2>&1 | tail -30
      test ${PIPESTATUS[0]} -eq 0
    must_pass: true
    addressed_by_tickets: [T-13, T-16]

