  - id: T-3
    subject: "Docs deliverables: CHANGELOG.md + migration-from-nicolify.md + docs/api/ auto-gen + RELEASES update + extension-points header stamp + scripts/"
    description: |
      **Scope:** Cross-package CHANGELOG seed + consumer migration guide + API reference
      auto-gen scripts + RELEASES.md extension + extension-points.md header stamp + smoke
      script + rollback script.

      **Steps:**

      1. Emit `CHANGELOG.md` (root, ~150 lines) per 03-arch.md §7 verbatim seed.
         Sections: Stories 1-9 entries + "Known issues" + Migration ref + tagref.

      2. Emit `docs/migration-from-nicolify.md` (~150-200 lines) per 03-arch.md §8 verbatim outline.
         §1 Audience, §2 Pre-migration checklist, §3 Import mapping, §4 Dep installation,
         §5 Extension SDK consumer pattern, §6 Troubleshooting.
         **Spanish neutro LatAm tuteo** per 05-guidelines §1.5.

      3. Create `scripts/generate_api_docs.sh` per 03-arch-be.md §4.1:
         - pdoc per core/luana-core-* (output docs/api/python/{pkg}/)
         - typedoc monorepo (output docs/api/typescript/)
         - chmod +x

      4. Run `scripts/generate_api_docs.sh` to populate `docs/api/`:
         ```bash
         bash scripts/generate_api_docs.sh
         ```
         Best-effort: per-package failures emit warnings, script continues. Target ≥ 20 of 26
         Python packages have output (V-F-release-7 threshold).

      5. Create `scripts/publish_smoke_test.sh` per 03-arch.md §6 verbatim bash.
         chmod +x.

      6. Create `scripts/rollback_partial_publish.sh`:
         ```bash
         #!/bin/bash
         set -euo pipefail
         VERSION="${1:?Usage: rollback_partial_publish.sh VERSION}"

         echo "Rolling back partial publish of v${VERSION}"
         echo "WARNING: this deletes published packages from GH Packages registry."
         read -p "Proceed? [yes/no]: " CONFIRM
         [ "$CONFIRM" = "yes" ] || exit 0

         # Delete Python packages
         for pkg in luana-core-platform luana-core-llm luana-core-channels \
                    luana-core-idempotency luana-core-observability luana-core-events \
                    luana-core-extraction luana-core-compliance luana-core-billing \
                    luana-core-iam luana-core-tenant-profile luana-core-tenant-domains \
                    luana-core-commercial-calendar luana-core-social-proof luana-core-assets \
                    luana-core-crm luana-core-analytics-engine luana-core-landing \
                    luana-core-connections luana-core-brand-studio luana-core-offer-studio \
                    luana-core-copilot luana-core-sales-agent luana-core-campaigns \
                    luana-core-extension-sdk; do
           VERSIONS=$(gh api "/orgs/alpacapurpura/packages/pypi/${pkg}/versions" \
             --jq '.[] | select(.name == "'${VERSION}'") | .id' 2>/dev/null || echo "")
           for vid in $VERSIONS; do
             gh api -X DELETE "/orgs/alpacapurpura/packages/pypi/${pkg}/versions/${vid}"
             echo "Deleted $pkg@${VERSION}"
           done
         done

         # Delete TS packages
         for pkg in api-client design-tokens extension-sdk format hooks schemas ui-kit; do
           VERSIONS=$(gh api "/orgs/alpacapurpura/packages/npm/${pkg}/versions" \
             --jq '.[] | select(.name == "'${VERSION}'") | .id' 2>/dev/null || echo "")
           for vid in $VERSIONS; do
             gh api -X DELETE "/orgs/alpacapurpura/packages/npm/${pkg}/versions/${vid}"
             echo "Deleted @luana/$pkg@${VERSION}"
           done
         done

         echo "Rollback complete. Delete tag locally + remote, then retry release after fix."
         ```
         chmod +x.

