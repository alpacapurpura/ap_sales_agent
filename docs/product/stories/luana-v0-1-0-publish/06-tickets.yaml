         git add .github/workflows/release.yml release-please-config.json \
                 .release-please-manifest.json commitlint.config.cjs
         git commit -m "feat(release): introduce GH Packages publish pipeline

         release.yml workflow (tag-triggered v*.*.*) + release-please config
         (33 packages monorepo linked-versions). commitlint seed (active v0.2.0+).

         Dual auth: GH_PACKAGES_TOKEN || GITHUB_TOKEN fallback.

         Co-Authored-By: Claude Sonnet 4.5 <noreply@anthropic.com>"
