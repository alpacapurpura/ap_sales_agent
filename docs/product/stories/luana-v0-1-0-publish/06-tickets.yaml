      1. `tests/architecture/test_workspace_versions_uniform_at_v0_1_0.py`:
         ```python
         import re
         from pathlib import Path

         ROOT = Path(__file__).resolve().parents[2]

         def test_all_python_packages_at_0_1_0():
             """V-NF-2: all 26 luana-core-* + test-brand + brand stubs pyproject at 0.1.0."""
             pyprojects = list((ROOT / "core").glob("luana-core-*/pyproject.toml"))
             pyprojects += [ROOT / "apps/test-brand/pyproject.toml"]
             pyprojects += [ROOT / brand / "pyproject.toml" for brand in ["nicolify", "vitalia", "comunify", "lupulo"]]
             pyprojects.append(ROOT / "core/pyproject.toml")
             assert len(pyprojects) >= 31, f"only {len(pyprojects)} pyprojects found"
             for path in pyprojects:
                 content = path.read_text()
                 match = re.search(r'^version = "(.+?)"$', content, re.MULTILINE)
                 assert match, f"no version in {path}"
                 assert match.group(1) == "0.1.0", f"{path}: version={match.group(1)} (expected 0.1.0)"

         def test_all_typescript_packages_at_0_1_0():
             """V-NF-3 + V-NF-6: all 7 @luana/* + brand stubs + root package.json at 0.1.0."""
             import json
             pkgjsons = list((ROOT / "core/@luana").glob("*/package.json"))
             pkgjsons += [ROOT / brand / "package.json" for brand in ["nicolify", "vitalia", "comunify", "lupulo"]]
             pkgjsons.append(ROOT / "package.json")
             for path in pkgjsons:
                 data = json.loads(path.read_text())
                 assert data["version"] == "0.1.0", f"{path}: version={data['version']}"

         def test_no_alpha_suffix_anywhere():
             """V-NF-7: no -alpha substring in version fields."""
             for path in (ROOT / "core").rglob("pyproject.toml"):
                 if "node_modules" in str(path) or "dist" in str(path):
                     continue
                 content = path.read_text()
                 match = re.search(r'^version = "(.+?)"$', content, re.MULTILINE)
                 if match:
                     assert "-alpha" not in match.group(1), f"{path}: -alpha suffix retained"
         ```

      2. `tests/architecture/test_release_workflow_yaml_valid.py`:
         ```python
         import yaml
         from pathlib import Path
         ROOT = Path(__file__).resolve().parents[2]

         def _load_workflow():
             with open(ROOT / ".github/workflows/release.yml") as f:
                 return yaml.safe_load(f)

         def test_release_workflow_triggers_on_tag():
             """V-F-release-3: release.yml triggers on v*.*.* tag push."""
             cfg = _load_workflow()
             # YAML 1.1 'on' may parse as True (Python bool)
             trigger = cfg.get("on") or cfg.get(True)
             tags = trigger["push"]["tags"]
             assert "v*.*.*" in tags, f"tags={tags}"

         def test_release_workflow_atomicity_publish_dependency():
             """V-F-release-4: publish-typescript depends on publish-python (atomicity)."""
             cfg = _load_workflow()
             needs = cfg["jobs"]["publish-typescript"].get("needs", [])
             needs_list = [needs] if isinstance(needs, str) else list(needs)
             assert "publish-python" in needs_list, f"needs={needs_list}"

         def test_release_workflow_required_jobs_present():
             """V-F-release-2: all critical jobs declared."""
             cfg = _load_workflow()
             jobs = cfg["jobs"].keys()
             required = ["validate-tag", "build-python", "build-typescript", "publish-python", "publish-typescript", "create-github-release"]
             for job in required:
                 assert job in jobs, f"missing job: {job}"
         ```

