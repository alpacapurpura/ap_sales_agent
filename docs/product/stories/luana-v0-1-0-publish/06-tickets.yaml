tickets:

  - id: T-1
    subject: "Workspace version bumps cross-package + lockfile regen"
    description: |
      **Scope:** Mechanical bump of 33 publishable packages + workspace roots + brand stubs
      from current heterogeneous `0.0.x-alpha` states to uniform `0.1.0`. Idempotent sed/jq.

      **Steps:**

      1. Audit current state:
         ```bash
         cd ~/luana-platform
         find core/ apps/test-brand/ nicolify/ vitalia/ comunify/ lupulo/ -maxdepth 2 \
           \( -name "pyproject.toml" -o -name "package.json" \) -print | \
           xargs grep -l "0.0.[0-9]*-alpha" | sort
         ```
         Confirm match with 03-arch-be.md §1 inventory: 26 Python core/ + 1 core/pyproject.toml + 1 test-brand + 4 brand stubs (8 files) + 7 TS @luana/* + 5 brand stubs package.json + root package.json = ~52 files.

      2. Python bumps (idempotent sed):
         ```bash
         find core/ apps/test-brand/ nicolify/ vitalia/ comunify/ lupulo/ -maxdepth 2 \
           -name "pyproject.toml" \
           -exec sed -i -E 's/^version = "0\.0\.[0-9]+-alpha"$/version = "0.1.0"/' {} \;
         ```

      3. TS bumps:
         ```bash
         # @luana scope via pnpm
         pnpm -r --filter "./core/@luana/*" exec npm version 0.1.0 \
           --no-git-tag-version --allow-same-version

         # Brand stubs + root via jq (idempotent atomic write)
         for pkgjson in nicolify/package.json vitalia/package.json \
                        comunify/package.json lupulo/package.json package.json; do
           jq '.version = "0.1.0"' "$pkgjson" > "${pkgjson}.tmp" && \
             mv "${pkgjson}.tmp" "$pkgjson"
         done
         ```

      4. Add `publishConfig` to @luana/* package.json if missing (release infra prep):
         ```bash
         for pkgjson in core/@luana/*/package.json; do
           if ! jq -e '.publishConfig.registry' "$pkgjson" > /dev/null; then
             jq '.publishConfig = {"registry": "https://npm.pkg.github.com/"}' \
               "$pkgjson" > "${pkgjson}.tmp" && mv "${pkgjson}.tmp" "$pkgjson"
           fi
         done
         ```

      5. Lockfile regen:
         ```bash
         uv lock --upgrade
         pnpm install --lockfile-only
         ```

      6. Verify:
         ```bash
         find . -maxdepth 3 \( -name "pyproject.toml" -o -name "package.json" \) \
           ! -path "*/node_modules/*" ! -path "*/dist/*" -exec grep -l "0.0.[0-9]*-alpha" {} \;
         # Expected: empty (no -alpha remaining)
         ```

      7. Stage + commit:
         ```bash
         git add core/ apps/ nicolify/ vitalia/ comunify/ lupulo/ package.json uv.lock pnpm-lock.yaml
         git commit -m "chore(workspace): bump 33 packages 0.0.x-alpha → 0.1.0

         Uniform version cement per Story 9 release pipeline. SemVer real flip
         post outcome §7.5.2 D4=C. Lockfiles regen. publishConfig added to
         @luana/* TS packages (GitHub Packages npm registry).

         Co-Authored-By: Claude Sonnet 4.5 <noreply@anthropic.com>"
         git push origin main
         ```

      **Idempotency:** re-running T-1 = no-op (sed regex no longer matches).
