  - id: T-2
    subject: "Release infra: .github/workflows/release.yml + release-please-config.json + .release-please-manifest.json + commitlint.config.cjs seed"
    description: |
      **Scope:** Emit GitHub Actions release workflow + release-please monorepo config.
      Tag-triggered, fail-fast atomicity, dual auth path (GITHUB_TOKEN OR GH_PACKAGES_TOKEN).

      **Steps:**

      1. Create `.github/workflows/release.yml` per 03-arch.md §3 verbatim YAML.
         Verify shape:
         - Trigger: `on.push.tags: ['v*.*.*']`
         - Jobs: `validate-tag, build-python, build-typescript, publish-python, publish-typescript, create-github-release, smoke-test-published`
         - `publish-typescript` depends_on `publish-python` (atomicity)
         - Each job has `timeout-minutes`
         - Secrets ref: `${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}`

      2. Create `release-please-config.json` per 03-arch.md §4 verbatim JSON.
         33 packages enumerated. `linked-versions` plugin.

      3. Create `.release-please-manifest.json` with 33 entries all at `0.1.0`.

      4. Create `commitlint.config.cjs` seed (per 05-guidelines §1.4):
         ```js
         module.exports = {
           extends: ['@commitlint/config-conventional'],
           rules: {
             'subject-case': [0],
             'subject-max-length': [2, 'always', 100],
           },
         };
         ```
         (Active enforcement deferred Story 10+ — Story 9 emits seed only.)

      5. Lint:
         ```bash
