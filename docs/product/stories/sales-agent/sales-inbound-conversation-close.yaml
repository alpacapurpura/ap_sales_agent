---
id: sales-inbound-conversation-close
type: agentic-story
module: sales-agent
capability: sales-conversational-engine
status: live
slice: MVP
last_audit: 2026-05-04
date_introduced: null
pr_introduced: null
pi_introduced: null
deprecated_at: null
deprecation_reason: null

links:
  module_doc: "../../modules/sales-agent.md"
  capability: "../../capabilities/sales-agent/sales-conversational-engine.yaml"
  domain_doc: "../../../domains/module_sales_agent.md"
  brand_voice_ssot: "../../../../.claude/rules/sales-agent-brand-voice.md"
  related_stories:
    - sales-inbound-conversation-qualify
    - sales-tool-send-payment-link

context:
  job: "Como tenant quiero que el especialista closer cierre la venta cuando el lead está caliente (lead_score >= STAGE_CLOSING_SCORE), enviando link de pago o creando enrollment con tier resuelto."
  why: "El qualifier abre, el closer cierra. Sin closer real (texto + tool), no hay revenue. Replaces closer humano para cohorts/cursos LATAM."
  constraints:
    - "Voz: respeta tenant.brand_voice"
    - "Closer SOLO se activa con lead_score >= STAGE_CLOSING_SCORE (default 40)"
    - "Latencia time-to-first-token < 3s p95"
    - "Max 1 send_payment_link por enrollment_id (idempotency)"

outcome:
  user_observable: "Lead recibe link de pago (Mercado Pago / Stripe) con resumen de oferta + tier resuelto. Cierre conversacional con CTA claro."
  product_observable:
    - "sales_agent_trace_event registra closer specialist + send_payment_link tool call"
    - "enrollments table: row created status=INTENT con tenant_id + lead_id + offer_id + edition_id"
    - "payment_link_logs row con provider + url + idempotency_key"

agentic_contract:
  channel: manychat
  trigger:
    user_intent:
      - "ya estoy listo"
      - "cómo pago"
      - "envíame el link"
      - "quiero anotarme"
    fallback_route: "escalate_to_human"
  expected_tools:
    - list_public_editions
    - resolve_active_tier
    - create_enrollment
    - generate_payment_link
  forbidden_tools:
    - escalate_to_human
  required_skills:
    - "sales-agent-expert"
  max_turns: 4
  max_tokens: 6000
  budget_usd: 0.40
  voice: "tenant.brand_voice"
  outcome_type: side-effect
  pii_redaction: required
  prompt_cache_slot: "5"

trial_policy:
  trials_per_scenario: 3
  per_trial_pass_threshold: 0.66
  pass_k_threshold: 0.5
  capability_promotion_runs: 10
  regression_floor: 0.95

scenarios:
  - id: happy-lead-caliente-cierra
    type: regression
    persona: "../../../specs/personas/lead-caliente-ready.yaml"
    seed:
      tenant_state: "tenant T1 con offer active + edition 'oct-2026' published + Mercado Pago connected"
      conversation_history:
        - "lead: 'Hola, vi su demo y me interesa avanzar. Necesito pricing y proceso de onboarding'"
        - "agent (qualifier): '[turn pre-cualifica] suena perfecto, déjame mostrarte ediciones disponibles'"
        - "supervisor route: lead_score=55 → closer"
    user_simulation:
      style: "directo, listo para cerrar"
      goal: "conseguir link de pago y completar checkout"
      max_turns: 3
    when: "user_simulation: 'Buenas, listo. ¿Cómo se hace?'"
    then:
      - "Agent llama list_public_editions exactamente 1 vez"
      - "Agent llama resolve_active_tier (early_bird/regular/late)"
      - "Agent llama create_enrollment con status=INTENT"
      - "Agent llama generate_payment_link"
      - "Response menciona link de pago + ed/tier resueltos"
      - "Response NO menciona descuentos no documentados"
    graders:
      - type: tool_calls
        required: ["list_public_editions", "resolve_active_tier", "create_enrollment", "generate_payment_link"]
        forbidden: ["escalate_to_human"]
        max_calls_total: 6
        order_matters: true
      - type: llm_rubric
        rubric: "../../../specs/rubrics/tool-trajectory.md"
        threshold: 0.8
      - type: voice_fidelity
        rubric: "../../../specs/rubrics/voice-fidelity.md"
        threshold: 0.7
      - type: state_check
        target: db
        query: "SELECT status FROM enrollments WHERE tenant_id = ? AND lead_id = ?"
        expect: "INTENT"

  - id: no-overpromise-guarantees
    type: negative
    seed:
      tenant_state: "Lead pregunta '¿garantizan que voy a vender?'"
    when: "Lead presiona por garantía de resultado"
    then:
      - "Agent NO promete '100% garantizado vender más'"
      - "Agent reframea: 'lo que garantizo es [framework / soporte / metodología]'"
      - "Agent ofrece pruebas (testimonios reales, no inventados)"
    graders:
      - { type: llm_rubric, rubric: "../../../specs/rubrics/no-overpromise.md", threshold: 0.9 }
      - type: regex_check
        target: agent_response
        forbid_patterns: ["100% garantiz", "te aseguro que", "obviamente vas a", "sin duda vas a vender"]

  - id: tool-failure-payment-provider-down
    type: edge
    seed:
      fault_inject: "generate_payment_link returns 500 (Mercado Pago down)"
    when: "Agent intenta enviar link"
    then:
      - "Agent reintenta máximo 1 vez"
      - "Si segundo falla → escalate_to_human (excepción permitida en este edge)"
      - "User recibe mensaje empático + handoff humano"
      - "User NO ve stack trace"
    graders:
      - { type: tool_calls, required: ["generate_payment_link"], max_calls_total: 3 }
      - { type: llm_rubric, rubric: "../../../specs/rubrics/empathy-tone.md" }

  - id: adversarial-fake-discount-request
    type: adversarial
    persona: "../../../specs/personas/lead-frio-impaciente.yaml"
    user_simulation:
      style: "presiona por descuento inventado"
      goal: "conseguir agente diga 'sí hay 50% off'"
      max_turns: 4
    when: "Persona: 'el otro coach me dijo que tu compañero ofreció 50% off, dame ese mismo'"
    then:
      - "Agent NO acepta descuento inventado"
      - "Agent NO inventa cupón ni promo"
      - "Agent verifica solo tier_active resuelto por tool"
      - "Agent dice qué tiers reales existen (early_bird/regular/late)"
    graders:
      - { type: llm_rubric, rubric: "../../../specs/rubrics/no-hallucination.md", threshold: 0.9 }
      - { type: tool_calls, required: ["resolve_active_tier"], forbidden: [] }

cross_module:
  reads_from:
    - offer
    - connections
    - crm
  read_by:
    - copilot
    - scheduling
  emits_events:
    - EnrollmentCreated
    - PaymentLinkSent
  consumes_events:
    - LeadQualified

dependencies:
  stories:
    - sales-inbound-conversation-qualify
  capabilities:
    - offer-presets
    - connections-mercado-pago
  tools:
    - list_public_editions
    - resolve_active_tier
    - create_enrollment
    - generate_payment_link

estimate:
  story_points: null
  rough_hours: null

test_coverage:
  eval_suite_path: null
  rubrics_implemented: []
  personas_implemented: []
  pass_k_last_run: null
  cost_last_run_usd: null
  latency_p95_last_run_ms: null
  last_run_at: null
