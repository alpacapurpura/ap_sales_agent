id: landing-slug-edit
type: ui-story
module: landing
capability: landing-publishing
status: live
slice: MVP
last_audit: 2026-05-04
date_introduced: null
pr_introduced: null
pi_introduced: null

links:
  module_doc: "../../modules/landing.md"
  capability: "../../capabilities/landing/landing-publishing.yaml"
  domain_doc: "../../../domains/module_landing.md"
  related_stories:
    - landing-publish

context:
  job: "Como user quiero editar el slug de mi landing (URL path) para que la URL pública sea memorable y compatible con SEO."
  why: "Slug default es UUID o título; ninguna versión es shareable. Customizar slug = mejor SEO + mejor branding."
  constraints:
    - "Slug debe ser único por tenant"
    - "Solo a-z, 0-9, guiones permitidos"
    - "Si landing ya publicada → confirm de breaking change (URL antigua deja de servir)"

outcome:
  user_observable: "Usuario edita campo slug a 'curso-fotografia-q2' y desenfoca; toast confirma; URL pública refleja cambio."
  product_observable:
    - "DB: landing_pages.slug = 'curso-fotografia-q2'"
    - "Si publicada: 301 redirect del slug viejo (TODO/futuro)"

scenarios:
  - id: edit-slug-on-draft
    type: regression
    given:
      - "Tenant T1 con landing draft, slug='curso-q2'"
    when: "Usuario edita slug a 'curso-fotografia-q2' y desenfoca"
    then:
      - "PATCH /api/v1/landings/{id} con slug actualizado retorna 200"
      - "DB: slug='curso-fotografia-q2'"
      - "Preview URL muestra nuevo slug"
    graders:
      - type: e2e
        path: null
      - type: state_check
        target: db
        query: "SELECT slug FROM landing_pages WHERE id = ?"
        expect: "'curso-fotografia-q2'"

  - id: duplicate-slug
    type: negative
    given:
      - "Tenant T1 ya tiene landing con slug='curso-q2'"
    when: "Usuario edita otra landing y le pone slug='curso-q2'"
    then:
      - "Status 409 Conflict 'Slug ya en uso'"
      - "DB: slug NO se modifica"
      - "UI sugiere variante (curso-q2-v2)"
    graders:
      - type: contract_test
        path: null

  - id: invalid-chars
    type: negative
    when: "Usuario escribe slug 'Curso Q2!!!' (espacios, mayúsculas, símbolos)"
    then:
      - "Validation rechaza '$'/'!'/' '/'/' "
      - "Sugerencia 'Use solo a-z 0-9 -'"
    graders:
      - type: e2e
        path: null

  - id: change-slug-while-published
    type: edge
    given:
      - "Landing published con slug='curso-q1', URL pública funciona"
    when: "Usuario cambia slug a 'curso-q1-relanzamiento'"
    then:
      - "Confirm modal 'La URL anterior dejará de funcionar'"
      - "Tras confirm: DB.slug = nuevo, GET URL antigua → 404 o 301 (según política)"
    graders:
      - type: e2e
        path: null

