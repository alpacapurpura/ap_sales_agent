  estimated_cost_usd_range: [700, 1000]
  estimated_duration_minutes: 180-240
  parallelizable_with: [T-8]                  # Wave 3 ≤2 cap — DB + FE independent
  decisions_applicable: [D2]                   # D2 = fresh nicolify DB + alembic snapshot consolidation
  halt_triggers_applicable: [5, 8]
  repro_verified: false
  inputs:
    spec: "../01-spec.md §5 Feature 3 Scenarios 3.1-3.4"
    arch_doc: "../03-arch.md §2 Feature 3 + §7 Phase 0 Q2"
    arch_be_doc: "../03-arch-be.md §3 (alembic consolidation strategy — hybrid Phase 0 spike)"
    guidelines: "../05-guidelines.md §2.2 FORBIDDEN (alembic anti-patterns)"
    rules: [".claude/rules/backend-migrations.md"]
    domain_skills: ["backend-expert"]
  description: |
    Hybrid Phase 0 spike (03-arch-be.md §3) — pg_dump + alembic autogenerate diff resolution → consolidated `001_initial_snapshot.py`.

    **Step 1 — Capture current schema state:**
    ```bash
    docker exec visionarias_postgres_dev pg_dump --schema-only -U postgres visionarias_logs > /tmp/aisaleshT_schema.sql
    ```

    **Step 2 — Generate model-driven schema (alembic autogenerate on empty DB):**
    ```bash
    psql -U postgres -c "CREATE DATABASE _autogen_test;"
    DATABASE_URL=postgresql://postgres@localhost:5432/_autogen_test .venv/bin/alembic revision --autogenerate -m "models_inferred_baseline"
    psql -U postgres -c "DROP DATABASE _autogen_test;"
    ```

    **Step 3 — Diff for drift detection:**
    ```bash
    diff /tmp/pg_dump_ddl.txt /tmp/autogen_ddl.txt > /tmp/schema_drift.diff
    wc -l /tmp/schema_drift.diff   # → ≤ 20 lines acceptable cosmetic; >20 → Halt Trigger #5
    ```

    **Step 4 — Drift resolution per Halt Trigger #5** (03-arch-be.md §3.1):
    - Column nullable mismatch → Chris ratifies (A/B/C)
    - Index missing in DB → include in snapshot
    - Default mismatch → Chris ratifies

    **Step 5 — Write consolidated `001_initial_snapshot.py`** (raw SQL `IF NOT EXISTS` per backend-migrations.md — see 03-arch-be.md §3.2 template).

    **Step 6 — Fresh DB workflow (03-arch-be.md §3.3):**
    ```bash
    # Parallel container nicolify_postgres_dev on port 5433 during transition
    docker compose -f /home/chris/luana-platform/docker-compose.dev.yml up -d nicolify_postgres_dev
    docker exec nicolify_postgres_dev pg_isready -U postgres
    cd /home/chris/luana-platform/nicolify/backend
    DATABASE_URL=postgresql://postgres@localhost:5433/nicolify_dev uv run alembic upgrade head
    DATABASE_URL=postgresql://postgres@localhost:5433/nicolify_dev uv run alembic current   # → 001_initial_snapshot (head)
    ```

    **Step 7 — Schema verification + idempotency stress test (Scenario 3.3):**
    ```bash
    docker exec nicolify_postgres_dev pg_dump --schema-only -U postgres nicolify_dev > /tmp/nicolify_schema.sql
    diff /tmp/aisaleshT_schema.sql /tmp/nicolify_schema.sql > /tmp/schema_final_diff.txt
    HASH1=$(docker exec nicolify_postgres_dev pg_dump --schema-only -U postgres nicolify_dev | sha256sum)
    DATABASE_URL=postgresql://postgres@localhost:5433/nicolify_dev uv run alembic upgrade head   # second run no-op
    HASH2=$(docker exec nicolify_postgres_dev pg_dump --schema-only -U postgres nicolify_dev | sha256sum)
    test "$HASH1" = "$HASH2"
    ```

    **Step 8 — Run BE pytest against nicolify_dev (delta=0 vs T-1 baseline):**
    ```bash
    DATABASE_URL=postgresql://postgres@localhost:5433/nicolify_dev uv run pytest -x -q --tb=short
    ```

  blast_radius:
    files_affected_count: 3
    paths:
      - /home/chris/luana-platform/nicolify/backend/alembic/versions/001_initial_snapshot.py
      - /home/chris/luana-platform/docker-compose.dev.yml                                          # adds nicolify_postgres_dev container
      - /home/chris/luana-platform/nicolify/backend/.env / .env.example                            # POSTGRES_DB=nicolify_dev
  deliverables:
    - "001_initial_snapshot.py raw SQL IF NOT EXISTS pattern"
    - "Phase 0 spike diff resolution captured in T-10-impl-log.md (drift table + Chris ratify per row)"
    - "nicolify_postgres_dev container parallel, nicolify_dev DB created + at head"
    - "Schema diff vs AISALESHT cosmetic only (≤20 lines)"
    - "Idempotency stress test GREEN (sha256 equal before+after second upgrade)"
    - "BE pytest delta=0 against nicolify_dev"
  validators_referenced: [V-NF-7, V-F-16, V-F-17, V-F-18, V-F-19, V-F-20]
  out_of_scope:
    - "AISALESHT DB drop (T-14 — post 24h soak)"
    - "Production DB migration (Story 10 = dev env only; prod isolated per outcome §7.5.5)"
  acceptance:
    - { id: A1, description: "nicolify_dev exists + alembic head 001_initial_snapshot", verifier: { type: shell, cmd: "docker exec nicolify_postgres_dev psql -U postgres -d nicolify_dev -c 'SELECT version_num FROM alembic_version;' | grep 001_initial_snapshot" } }
    - { id: A2, description: "Schema diff ≤ 20 lines", verifier: { type: shell, cmd: "diff <(docker exec visionarias_postgres_dev pg_dump --schema-only -U postgres visionarias_logs | grep -E '^CREATE TABLE|^ALTER TABLE.*FOREIGN KEY|^CREATE INDEX' | sort -u) <(docker exec nicolify_postgres_dev pg_dump --schema-only -U postgres nicolify_dev | grep -E '^CREATE TABLE|^ALTER TABLE.*FOREIGN KEY|^CREATE INDEX' | sort -u) | wc -l | awk '{if ($1 <= 20) exit 0; else exit 1}'" } }
    - { id: A3, description: "Idempotency sha256 equal", verifier: { type: shell, cmd: "see Step 7 in description" } }
    - { id: A4, description: "Consolidated migration uses IF NOT EXISTS pattern", verifier: { type: pytest, cmd: "cd backend && .venv/bin/pytest tests/architecture/test_consolidated_migration_idempotent.py -v" } }
    - { id: A5, description: "pytest delta=0 against nicolify_dev", verifier: { type: shell, cmd: "see Step 8" } }
  quality_gates:
