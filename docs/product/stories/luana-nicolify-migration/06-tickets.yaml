  title: "Fresh nicolify_dev DB + alembic snapshot consolidation"
  type: backend
  surface: BE
  wave_position: 3
  production_code: false                      # Migration file consolidation (schema reference snapshot, NOT runtime business code)
  state: draft
  owner_eligibility:
