      from sqlalchemy import create_engine, select, func
      from sqlalchemy.orm import Session
      from src.core.config import settings
      from src.modules.sales_agent.observability.eval_simulator.persistence.models.eval_simulator_llm_call import EvalSimulatorLlmCallModel
      engine = create_engine(settings.database_url)
      with Session(engine) as db:
          # Suite total cost cap Story E ~\$330 cold / ~\$108 warm cache. Hard ceiling \$400 (alert threshold).
          grader_calls = db.execute(
              select(func.coalesce(func.sum(EvalSimulatorLlmCallModel.cost_usd), 0))
              .where(EvalSimulatorLlmCallModel.eval_metadata['grader'].astext == 'maj_eval')
          ).scalar()
          assert grader_calls < 400, f'Story E grader cost cap violated: \${grader_calls}'
          print(f'PASS — Story E grader cost \${grader_calls:.2f} < \$400 ceiling')
      "
    must_pass: true
    timeout_sec: 60
    description: "Cost budget Story E baseline: ~\$330 cold cache full eval / ~\$108 warm cache full eval (hit rate ≥70%). Hard ceiling \$400 (alert threshold). Story H interface receives baseline."

