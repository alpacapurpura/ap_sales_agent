      - pyproject.toml (uv workspace root, py3.12, ruff config line=120)
      - package.json (pnpm workspaces, turbo dev dep, type: module)
      - turbo.json (build/test/lint/publish task pipeline)
      - pnpm-workspace.yaml (packages: ['packages/ts/*'])
      - .python-version (3.12)
      - .npmrc (publishConfig to GH Packages)
      - .gitignore (cp from AISALESHT)
      - LICENSE placeholder (Chris ratifies content Q1)
      - README.md short stub
      Commit: feat(repo): bootstrap monorepo skeleton uv+pnpm+turborepo
    files:
      - "~/luana-platform/luana-core/pyproject.toml"
      - "~/luana-platform/luana-core/package.json"
      - "~/luana-platform/luana-core/turbo.json"
      - "~/luana-platform/luana-core/pnpm-workspace.yaml"
      - "~/luana-platform/luana-core/.python-version"
      - "~/luana-platform/luana-core/.npmrc"
      - "~/luana-platform/luana-core/.gitignore"
      - "~/luana-platform/luana-core/LICENSE"
      - "~/luana-platform/luana-core/README.md"
    blocked_by: [T-1]
    blocks: [T-3, T-4, T-5]
    estimated_minutes: 45
    owner_eligibility: [sonnet, opus]
    validators_addressed: [NF-3, NF-4]

