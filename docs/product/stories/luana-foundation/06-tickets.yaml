tickets:

  - id: T-1
    subject: "Create GitHub Org luana-platform + 5 private repos with branch protection"
    description: |
      Manual Chris step (browser) + gh CLI scripts.

      **Manual (Chris):** create org luana-platform via github.com/account/organizations/new (Free plan).

      **Scripted (after Chris confirms org exists):**
      - gh repo create × 5 (luana-core, nicolify, vitalia, comunify, lupulo-labs) all --private
      - Branch protection on main for all 5 (PR mandatory, required checks lint+test, review_count=0)
      - GH Discussions enable org-wide
    files:
      - "(no AISALESHT files — all GitHub side)"
    blocked_by: []
    blocks: [T-2, T-7]
    estimated_minutes: 20
    owner_eligibility: [sonnet, opus]
    validators_addressed: [NF-1, NF-2]

