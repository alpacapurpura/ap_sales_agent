# Tickets DAG — Luana Foundation

# Each ticket is atomic, independently mergeable, with clear inputs/outputs.
# Owner field: per 05-guidelines.md §5, all eligible Sonnet (no R23 trigger — pure infra).
# All work happens in ~/luana-platform/ (cloned monorepo). Story 1 does NOT touch AISALESHT.

tickets:

  - id: T-1
    subject: "Clone monorepo + branch protection + CODEOWNERS + PR template + ADR folder"
    description: |
      **Pre-flight (Chris done 2026-05-10):**
      - ✅ Repo `alpacapurpura/luana-platform` exists (private, empty)
      - ✅ ADR-001 ratified

      **Steps:**
      1. Clone repo locally:
         ```
         cd ~ && git clone git@github.com:alpacapurpura/luana-platform.git
         cd luana-platform
         ```
      2. Configure branch protection on main via gh API:
         ```
         gh api -X PUT "repos/alpacapurpura/luana-platform/branches/main/protection" \
           -f required_pull_request_reviews.required_approving_review_count=1 \
           -f required_status_checks.strict=true \
           -f required_status_checks.contexts[]="lint" \
           -f required_status_checks.contexts[]="test" \
           -f enforce_admins=false \
           -f allow_force_pushes=false
         ```
         (Note: branch protection initially fails because `lint`/`test` checks don't exist yet.
          Set checks AFTER T-3 merges. This ticket sets review_count + force-push block first;
          add status checks post T-3 via second gh API call.)
      3. Create `.github/CODEOWNERS` with required path rules (per 03-arch.md §5.1)
      4. Create `.github/PULL_REQUEST_TEMPLATE.md` with required sections (per 03-arch.md §5.2)
      5. Create `docs/architecture/ADR/README.md` explaining ADR template + index (per 03-arch.md §5.3)
      6. Commit: `feat(repo): bootstrap monorepo governance (CODEOWNERS + PR template + ADR folder + branch protection)`
      7. Open PR, self-merge once CI exists (T-3); for T-1 alone: direct push allowed since branch protection not yet enforcing checks (Chris bootstrap moment).

      **Note:** Chris is solo owner — `required_approving_review_count=1` + `enforce_admins=false`
      means Chris can self-approve PR. CODEOWNERS attribution = Chris.
    files:
      - "~/luana-platform/.github/CODEOWNERS"
      - "~/luana-platform/.github/PULL_REQUEST_TEMPLATE.md"
      - "~/luana-platform/docs/architecture/ADR/README.md"
    blocked_by: []
    blocks: [T-2]
    estimated_minutes: 45
    owner_eligibility: [sonnet, opus]
    validators_addressed: [NF-1, NF-3, NF-4, NF-5]

  - id: T-2
    subject: "Bootstrap monorepo workspace skeleton (pyproject + package.json + turbo.json + workspaces + .python-version + .gitignore + LICENSE + README)"
    description: |
      In ~/luana-platform/, create at REPO ROOT:

      - `pyproject.toml` — uv workspace root with:
        - `[tool.uv.workspace] members = ["core", "nicolify", "vitalia", "comunify", "lupulo"]`
        - `[tool.ruff] line-length = 120, target-version = "py312"`
        - NO `[project]` section at root (workspace root is not a package itself)
      - `package.json` — pnpm workspace root with:
        - `"private": true`
        - `"name": "luana-platform"`
        - `"packageManager": "pnpm@9.x"`
        - `devDependencies: { turbo: "^2.3.0" }`
        - `scripts: { lint, test, build } via turbo run`
      - `turbo.json` — task pipeline (build, test, lint with dependsOn ^build for build/test)
      - `pnpm-workspace.yaml` — `packages: [core, nicolify, vitalia, comunify, lupulo]`
      - `.python-version` — `3.12`
      - `.gitignore` — copied from AISALESHT (Python venvs, node_modules, .env*, dist/, build/, .turbo, etc.)
      - `LICENSE` — proprietary "All Rights Reserved" template (Chris ratified 2026-05-10)
      - `README.md` — short stub (5-10 lines) with project name + link to docs/

      **NO** `.npmrc` with publishConfig (Story 9). **NO** `.releaserc.json` (Story 9).

      Commit: `feat(repo): bootstrap monorepo skeleton uv+pnpm+turborepo`
    files:
      - "~/luana-platform/pyproject.toml"
      - "~/luana-platform/package.json"
      - "~/luana-platform/turbo.json"
      - "~/luana-platform/pnpm-workspace.yaml"
      - "~/luana-platform/.python-version"
      - "~/luana-platform/.gitignore"
      - "~/luana-platform/LICENSE"
      - "~/luana-platform/README.md"
    blocked_by: [T-1]
    blocks: [T-3, T-4, T-5, T-6]
    estimated_minutes: 50
    owner_eligibility: [sonnet, opus]
    validators_addressed: [NF-2, NF-6, NF-7, NF-8, D-4]

  - id: T-3
    subject: "CI workflow (.github/workflows/ci.yml) with 4 parallel jobs"
    description: |
      Create `.github/workflows/ci.yml` per 03-arch.md §4.1 with 4 jobs:
      - python-lint: setup-uv + ruff check
      - python-test: setup-uv + pytest (placeholder OK Story 1 — `|| echo "no tests"`)
      - ts-lint: pnpm/action-setup + eslint (placeholder OK Story 1)
      - ts-test: pnpm/action-setup + vitest (placeholder OK Story 1)

      Triggered on PR + push to main.

      **Post-merge of T-3:** Update branch protection to require `lint` + `test`
      status checks. /dev-team decides naming strategy — either:
      - 4 separate checks (python-lint, python-test, ts-lint, ts-test), OR
      - 2 aggregator jobs (lint = ruff+eslint, test = pytest+vitest)
      Choose what works with branch protection UI.

      Smoke test: open trivial PR (whitespace change), verify CI green, then
      gh API call to add status checks to branch protection.

      Commit: `feat(ci): bootstrap CI workflow 4 parallel jobs`
    files:
      - "~/luana-platform/.github/workflows/ci.yml"
    blocked_by: [T-2]
    blocks: [T-7]
    estimated_minutes: 40
    owner_eligibility: [sonnet, opus]
    validators_addressed: [F-1]

  - id: T-4
    subject: "Lift .claude-shared/ from AISALESHT (cp -r)"
    description: |
      Lift `.claude/` directory tree from AISALESHT to `.claude-shared/` in monorepo:

      ```
      cd ~/luana-platform
      mkdir -p .claude-shared
      cp -r /home/chris/AISALESHT/.claude/rules .claude-shared/
      cp -r /home/chris/AISALESHT/.claude/skills .claude-shared/
      cp -r /home/chris/AISALESHT/.claude/agents .claude-shared/
      ```

      Then create `.claude/` as a directory copy (NOT symlink — Windows-compat for future):
      ```
      cp -r .claude-shared .claude
      ```
      (Alternative: symlink `ln -sf .claude-shared .claude` if Linux-only confirmed.)

      Verify: `ls .claude/rules/parallel-safety.md` exists.

      Commit: `chore: lift .claude-shared from AISALESHT (initial sync)`

      **No subtree pattern needed** — single monorepo, all workspace members see `.claude/` directly.
    files:
      - "~/luana-platform/.claude-shared/rules/"
      - "~/luana-platform/.claude-shared/skills/"
      - "~/luana-platform/.claude-shared/agents/"
      - "~/luana-platform/.claude/"
    blocked_by: [T-2]
    blocks: [T-7]
    estimated_minutes: 20
    owner_eligibility: [sonnet, opus]
    validators_addressed: [F-4, F-5]

  - id: T-5
    subject: "Bootstrap 5 subfolders (core + nicolify + vitalia + comunify + lupulo) with placeholder structure"
    description: |
      For each of `core`, `nicolify`, `vitalia`, `comunify`, `lupulo`:

      - Create directory at repo root
      - `{sub}/README.md` — purpose + scope + link to `docs/ARCHITECTURE.md` (5-10 lines)
      - `{sub}/pyproject.toml` — minimal workspace member:
        - `[project] name = "luana-{sub}" version = "0.0.1-alpha" requires-python = ">=3.12"`
        - empty `dependencies = []` (Story 2+ populates)
      - `{sub}/package.json` — minimal workspace member:
        - `"name": "@luana/{sub}", "version": "0.0.1-alpha", "private": true`

      Subfolder-specific notes:
      - `core/`: explicit purpose statement "engine SSoT — Story 2 lifts shared/, Story 3 lifts iam/, etc."
      - `nicolify/`: "canonical SaaS marketing — Story 10 lifts AISALESHT codebase here"
      - `vitalia/`, `comunify/`, `lupulo/`: brand placeholder — "vertical-{niche} populated Stories 11-13"

      Verify pyproject.toml workspace registration (T-2 declared `members = [core, nicolify, vitalia, comunify, lupulo]` — these dirs must exist now).

      Commit: `feat(repo): bootstrap 5 workspace subfolders (core + 4 brands placeholders)`
    files:
