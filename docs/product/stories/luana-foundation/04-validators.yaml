# Validators — must_pass:true ALL before state developing → developed

# Categories: non_functional / functional / visual / agentic_eval / documentation
# All commands assume Chris cloned monorepo to ~/luana-platform/

categories:
  non_functional:

    - id: NF-1
      description: "Monorepo cloned with main branch protected (review_count=1, no force pushes, lint+test required)"
      command: |
        gh api "repos/alpacapurpura/luana-platform/branches/main/protection" \
          --jq '{
            review_count: .required_pull_request_reviews.required_approving_review_count,
            force_pushes: .allow_force_pushes.enabled,
            checks: .required_status_checks.contexts
          }' | grep -qE '"review_count": 1' && \
        gh api "repos/alpacapurpura/luana-platform/branches/main/protection" \
          --jq '.allow_force_pushes.enabled' | grep -qE '^false$'
      expected_exit: 0
      must_pass: true
      owner: chris (manual via gh CLI initial config; verifiable scripted)

    - id: NF-2
      description: "uv workspace syncs without errors at monorepo root"
      command: |
        cd ~/luana-platform && uv sync --all-packages
      expected_exit: 0
      must_pass: true

    - id: NF-3
      description: ".github/CODEOWNERS exists with required path rules (core/copilot, core/sales-agent, core/shared, ADR)"
      command: |
        cd ~/luana-platform && \
        test -f .github/CODEOWNERS && \
        grep -qE '^core/copilot/\*\*' .github/CODEOWNERS && \
        grep -qE '^core/sales-agent/\*\*' .github/CODEOWNERS && \
        grep -qE '^core/shared/\*\*' .github/CODEOWNERS && \
        grep -qE '^docs/architecture/ADR/\*\*' .github/CODEOWNERS
      expected_exit: 0
      must_pass: true

    - id: NF-4
      description: ".github/PULL_REQUEST_TEMPLATE.md exists with required sections"
      command: |
        cd ~/luana-platform && \
        test -f .github/PULL_REQUEST_TEMPLATE.md && \
        grep -q "## Qué cambia" .github/PULL_REQUEST_TEMPLATE.md && \
        grep -q "## Por qué" .github/PULL_REQUEST_TEMPLATE.md && \
        grep -q "## Módulos tocados" .github/PULL_REQUEST_TEMPLATE.md && \
        grep -q "## ADR ref" .github/PULL_REQUEST_TEMPLATE.md && \
        grep -q "## Outcome / story ref" .github/PULL_REQUEST_TEMPLATE.md
      expected_exit: 0
      must_pass: true

    - id: NF-5
      description: "docs/architecture/ADR/README.md exists explaining ADR template + index"
      command: |
        cd ~/luana-platform && \
        test -f docs/architecture/ADR/README.md && \
        grep -qiE "(ADR template|template|formato Michael Nygard)" docs/architecture/ADR/README.md && \
        grep -qiE "(ADR index|índice)" docs/architecture/ADR/README.md
      expected_exit: 0
      must_pass: true

    - id: NF-6
      description: "pnpm workspace installs without errors"
      command: |
        cd ~/luana-platform && pnpm install --frozen-lockfile
      expected_exit: 0
      must_pass: true

    - id: NF-7
      description: "Ruff lint passes across all subfolders"
      command: |
        cd ~/luana-platform && uv run ruff check core nicolify vitalia comunify lupulo
      expected_exit: 0
      must_pass: true

    - id: NF-8
      description: "pnpm lint passes (or no-op exits 0 on Story 1 placeholder)"
      command: |
        cd ~/luana-platform && pnpm lint 2>&1 | tee /tmp/pnpm-lint.log; \
        grep -qE '(no eslint yet|0 problems|all checks passed)' /tmp/pnpm-lint.log || \
        [ "$(grep -cE 'error' /tmp/pnpm-lint.log)" -eq 0 ]
      expected_exit: 0
      must_pass: true

  functional:

    - id: F-1
      description: "luana-platform CI workflow runs successfully on PR (smoke commit)"
      command: |
        gh run list --repo alpacapurpura/luana-platform --limit 1 --json conclusion -q '.[].conclusion' | grep -qE 'success'
      expected_exit: 0
      must_pass: true

    - id: F-2
      description: "5 subfolders exist (core, nicolify, vitalia, comunify, lupulo) with README.md each"
      command: |
        cd ~/luana-platform && \
        for sub in core nicolify vitalia comunify lupulo; do
          test -d "$sub" && test -s "$sub/README.md" || exit 1
        done
      expected_exit: 0
      must_pass: true

    - id: F-3
      description: "Each subfolder is registered as workspace member (pyproject.toml + pnpm-workspace.yaml)"
      command: |
        cd ~/luana-platform && \
        for sub in core nicolify vitalia comunify lupulo; do
          grep -qE "\"$sub\"" pyproject.toml || exit 1
          grep -qE "(- $sub|- $sub/\*)" pnpm-workspace.yaml || exit 1
        done
      expected_exit: 0
      must_pass: true

    - id: F-4
      description: ".claude-shared/{rules,skills,agents}/ have content (>20 rules, >10 skills)"
      command: |
        cd ~/luana-platform && \
        test -d .claude-shared/rules && \
        test -d .claude-shared/skills && \
        test -d .claude-shared/agents && \
        test "$(ls .claude-shared/rules | wc -l)" -gt 20 && \
        test "$(ls .claude-shared/skills | wc -l)" -gt 10
      expected_exit: 0
      must_pass: true

    - id: F-5
      description: ".claude/ exists (copy or symlink to .claude-shared/)"
      command: |
        cd ~/luana-platform && \
        test -e .claude/rules && \
        test -e .claude/skills && \
        test -e .claude/agents
      expected_exit: 0
      must_pass: true

    - id: F-6
      description: "Architectural fitness bootstrap tests pass (workspace + CODEOWNERS + ADR + claude-shared + PR template)"
      command: |
        cd ~/luana-platform/nicolify && \
        test -d tests/architecture && \
        (cd ~/luana-platform && uv run pytest nicolify/tests/architecture/ -x -q --tb=short)
      expected_exit: 0
      must_pass: true

  visual:

    - id: V-1
      description: "Manual: Chris confirms branch protection UI shows correct settings"
      command: "manual_check"
      expected_exit: 0
      must_pass: false                          # visual N/A automated, manual confirm
      owner: chris

  agentic_eval:

    - id: AE-1
      description: "N/A — story has no agentic surface"
      command: "echo 'no agentic eval needed for foundation'"
      expected_exit: 0
      must_pass: true

  documentation:

    - id: D-1
      description: "docs/CONTRIBUTING.md exists describing Conventional Commits + PR flow + ADR rules + > 30 lines"
      command: |
        cd ~/luana-platform && \
        test -f docs/CONTRIBUTING.md && \
        test "$(wc -l < docs/CONTRIBUTING.md)" -gt 30 && \
        grep -qiE "conventional commits" docs/CONTRIBUTING.md && \
        grep -qiE "(ADR|architecture decision)" docs/CONTRIBUTING.md
      expected_exit: 0
      must_pass: true

    - id: D-2
      description: "docs/ARCHITECTURE.md exists describing monorepo topology + 5 subfolders"
      command: |
        cd ~/luana-platform && \
        test -f docs/ARCHITECTURE.md && \
        grep -qE "core" docs/ARCHITECTURE.md && \
        grep -qE "nicolify" docs/ARCHITECTURE.md && \
        grep -qE "vitalia" docs/ARCHITECTURE.md && \
        grep -qE "comunify" docs/ARCHITECTURE.md && \
        grep -qE "lupulo" docs/ARCHITECTURE.md
      expected_exit: 0
      must_pass: true

    - id: D-3
      description: "docs/RELEASES.md placeholder exists noting publishing deferred to Story 9"
      command: |
        cd ~/luana-platform && \
        test -f docs/RELEASES.md && \
        grep -qiE "(story 9|luana-v0-1-0-publish|deferred|placeholder)" docs/RELEASES.md
      expected_exit: 0
      must_pass: true

    - id: D-4
      description: "README.md at repo root exists + non-empty"
      command: |
        cd ~/luana-platform && test -s README.md
      expected_exit: 0
      must_pass: true

# Summary
notes:
  - "Total validators: 14 (12 must_pass:true + 1 manual visual + 1 N/A agentic_eval)"
  - "All commands assume Chris cloned monorepo to ~/luana-platform/"
  - "GITHUB_TOKEN env var must be set with `repo` scope for gh API checks (NF-1, F-1)"
  - "Story 1 done (state developed) when 12/12 must_pass:true validators GREEN"
  - "Then: Chris triggers /auditor for CHECKPOINTS C1-C5 → done"
  - "REMOVED from v1: GH Packages publishing smoke tests (F-1, F-2 publish + F-3, F-4 install) — Story 9"
  - "REMOVED from v1: subtree helper script + cross-org Project v2 — single repo, no need"
  - "ADDED in v2: NF-3 CODEOWNERS, NF-4 PR template, NF-5 ADR folder, F-6 arch fitness bootstrap"
