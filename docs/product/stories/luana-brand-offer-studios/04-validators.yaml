    description: "Per 05-guidelines.md §scope. Stub explains: package name, lift origin path (AISALESHT), key exports + deferrals."
    command: |
      cd ~/luana-platform
      MISSING=0
      for pkg in luana-core-brand-studio luana-core-offer-studio; do
