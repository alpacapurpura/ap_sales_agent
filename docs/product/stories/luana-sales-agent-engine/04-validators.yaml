    addressed_by_tickets: [T-1, T-17]

  - id: V-NF-2
    name: "luana-core-sales-agent pyproject.toml at version 0.0.7-alpha"
    command: |
      cd ~/luana-platform
      test -f core/luana-core-sales-agent/pyproject.toml || { echo "MISSING"; exit 1; }
      grep -q 'version = "0.0.7-alpha"' core/luana-core-sales-agent/pyproject.toml || { echo "WRONG VERSION"; exit 1; }
      echo "OK"
    must_pass: true
    addressed_by_tickets: [T-2]

  - id: V-NF-3
    name: "Workspace declares luana-core-sales-agent in [tool.uv.sources]"
    command: |
      cd ~/luana-platform
      grep -q '^luana-core-sales-agent = { workspace = true }' pyproject.toml || { echo "NOT IN sources"; exit 1; }
      grep -q '"core/luana-core-sales-agent"' pyproject.toml || { echo "NOT IN members"; exit 1; }
      echo "OK"
    must_pass: true
    addressed_by_tickets: [T-1]

  - id: V-NF-4
    name: "AISALESHT not modified in Story 7 commits"
    description: "Per outcome §7.3. Sales agent module + tests READ-ONLY."
    command: |
      cd /home/chris/AISALESHT
      BASE_SHA=$(grep -oP 'base_sha:\s*\K[a-f0-9]+' docs/product/stories/luana-sales-agent-engine/checkpoint.md 2>/dev/null || git rev-parse HEAD)
      DIFF=$(git diff "$BASE_SHA" HEAD --name-only 2>/dev/null | grep -E '^(backend/src/modules/sales_agent|backend/tests/modules/sales_agent)/' || true)
      if [ -n "$DIFF" ]; then echo "AISALESHT FILES MODIFIED:"; echo "$DIFF"; exit 1; fi
      echo "OK"
    must_pass: true
    addressed_by_tickets: [T-19]

  - id: V-NF-5
    name: "No publishConfig"
    command: |
      cd ~/luana-platform
      OFFENDERS=$(grep -l 'publishConfig' core/luana-core-sales-agent/pyproject.toml 2>/dev/null || true)
      if [ -n "$OFFENDERS" ]; then echo "Found publish config"; exit 1; fi
      echo "OK"
    must_pass: true
    addressed_by_tickets: [T-19]

  - id: V-NF-6
    name: "No .releaserc / release.yml added"
    command: |
      cd ~/luana-platform
      FOUND_R=$(find . -name '.releaserc*' -not -path './node_modules/*' 2>/dev/null || true)
      FOUND_W=$(find .github/workflows -maxdepth 2 -type f \( -name 'release*' -o -name 'publish*' \) 2>/dev/null || true)
      if [ -n "$FOUND_R" ] || [ -n "$FOUND_W" ]; then echo "Found: $FOUND_R $FOUND_W"; exit 1; fi
      echo "OK"
    must_pass: true
    addressed_by_tickets: [T-19]

