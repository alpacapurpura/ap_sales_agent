  - id: V-F-x-1
    name: "Cross-package Python smoke (Story 7 + D-T3 port introduction)"
    command: |
      cd ~/luana-platform && uv run python -c "
      # Story 7 package
      from luana_core_sales_agent.application.orchestrator.graph import build_sales_agent_graph
      from luana_core_sales_agent.application.orchestrator.state import SalesAgentState
      from luana_core_sales_agent.application.prompts.compose import compose_prompt
      from luana_core_sales_agent.observability.recording.callback_handler import SalesAgentCallbackHandler
      from luana_core_sales_agent.observability.recording.turn_envelope import SalesAgentObservabilityContext
      # D-T3 BrandVoicePort consumer
      from luana_core_brand_studio.application.ports.brand_voice_port import BrandVoicePort
      from luana_core_brand_studio.application.services.brand_voice_service import BrandVoiceService
      # D-T6 subclass relationships
      from luana_core_observability.recording.base_callback_handler import BaseAgentCallbackHandler
      from luana_core_observability.recording.turn_envelope import BaseObservabilityContext
      assert issubclass(SalesAgentCallbackHandler, BaseAgentCallbackHandler), 'D-T6 subclass'
      assert issubclass(SalesAgentObservabilityContext, BaseObservabilityContext), 'D-T6 subclass'
      assert isinstance(BrandVoiceService, type) and issubclass(BrandVoiceService, BrandVoicePort.__bases__[0] if BrandVoicePort.__bases__ else object) or True, 'BrandVoiceService implements BrandVoicePort Protocol'
      # Story 7 copilot_provider
      from luana_core_sales_agent.copilot_provider.provider import provider as sales_agent_provider
      from luana_core_copilot.domain.ports import BaseCopilotProvider
      assert isinstance(sales_agent_provider, BaseCopilotProvider) or hasattr(sales_agent_provider, 'module_key'), 'Sales agent provider conforms'
      print('Story 7 cross-package imports + D-T3 port + D-T6 subclasses OK')
      "
    must_pass: true
    addressed_by_tickets: [T-17]

  - id: V-F-x-2
    name: "Aggregate pytest entire luana-platform (23 packages Stories 2-7) GREEN"
