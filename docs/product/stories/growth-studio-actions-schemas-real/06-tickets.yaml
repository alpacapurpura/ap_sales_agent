merge_strategy: |
  Single PR cumulative merge. Atomic commits per ticket (TDD discipline).
  Each ticket = 1 conventional commit minimum (RED tests first, GREEN second).
  T-1 → T-2 (parallel safe; T-2 references 2A registries only)
  T-3 (sequential after T-1 — golden depends on tool names)
  T-4 (sequential after T-3 — goldens reference registered tools)
  T-5 (sequential after T-1 + T-2 — alignment test needs both schemas)
  T-6 (sequential after T-2 + T-3 — smoke needs UI + tools wired)
  T-7 (final — verifies cumulative)

  Push to development; PM reviews + merges to main per /pase-produccion (manual trigger).

