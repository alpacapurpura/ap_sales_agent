         ```python
         def test_sales_agent_adapter_read_only_no_private_access():
             """V-AG-new-story-8 — AST parse forbids private attr access."""
             import ast
             from pathlib import Path
             adapter_file = Path("src/luana_core_extension_sdk/_adapters.py")
             src = adapter_file.read_text()
             tree = ast.parse(src)
             forbidden_prefixes = ("_dispatch", "_mutate", "_internal_", "_private_")
             for node in ast.walk(tree):
                 if isinstance(node, ast.Attribute):
                     for prefix in forbidden_prefixes:
                         assert not node.attr.startswith(prefix), \
                             f"Adapter touches private surface: ._inner.{node.attr} ({prefix})"

         def test_sales_agent_adapter_raises_not_implemented_on_missing_method():
             """Adapter graceful when inner registry lacks register_*_from_extension."""
             from luana_core_extension_sdk._adapters import _SalesAgentToolRegistryAdapter
             from luana_core_extension_sdk.models import ToolDef
             class FakeRegistry:
                 pass  # no register_tool_from_extension
             adapter = _SalesAgentToolRegistryAdapter(FakeRegistry())
             tool = ToolDef(name="vitalia.test", description="x", input_schema={}, handler=lambda: None)
             try:
                 adapter.register_extension_tool(tool)
             except NotImplementedError as e:
                 assert "Story 7 ToolRegistry lacks" in str(e)
             else:
                 raise AssertionError("Expected NotImplementedError")

         def test_copilot_adapter_raises_not_implemented_on_missing_method():
             """Idem for WorkflowRegistry."""
             from luana_core_extension_sdk._adapters import _CopilotWorkflowRegistryAdapter
             from luana_core_extension_sdk.models import WorkflowDef
             class FakeRegistry:
                 pass
             adapter = _CopilotWorkflowRegistryAdapter(FakeRegistry())
             wf = WorkflowDef(name="vitalia.test", description="x", steps=())
             try:
                 adapter.register_extension_workflow(wf)
             except NotImplementedError as e:
                 assert "Story 6 WorkflowRegistry lacks" in str(e)
             else:
                 raise AssertionError("Expected NotImplementedError")

         def test_adapters_used_only_via_register_extension_public_methods():
             """No method named _dispatch / _mutate / _internal_ on adapter classes."""
             from luana_core_extension_sdk._adapters import (
                 _SalesAgentToolRegistryAdapter, _CopilotWorkflowRegistryAdapter,
             )
             for cls in [_SalesAgentToolRegistryAdapter, _CopilotWorkflowRegistryAdapter]:
                 methods = [m for m in dir(cls) if not m.startswith("_") or m.startswith("__")]
                 forbidden_in_methods = [m for m in methods if any(
                     m.startswith(p) for p in ("dispatch", "mutate", "internal")
