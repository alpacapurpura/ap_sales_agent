links:
  module_doc: "../../modules/connections.md"
  capability: "../../capabilities/connections/connections-status-monitoring.yaml"
  domain_doc: "../../../domains/module_connections.md"
  related_stories:
    - connections-status-list-ui

context:
  job: "Como tenant clickeo 'Reconectar' en plataforma expired → re-OAuth flow → vuelve a /connections con status=active."
  why: "Reconnect frecuente (tokens 60d Meta, refresh fail GA4). Self-service crítico."
  constraints:
    - "Preserva config existing (page_id, ad_account, ga4_property)"
    - "Tenant-scoped"
    - "Single-click reconnect (no re-config full)"

outcome:
  user_observable: "Tras OAuth, tenant retorna a /connections con badge 'Conectado ✓'"
  product_observable:
    - "DB: channel_connections.status → active, token refreshed, config preserved"

scenarios:
  - id: happy-reconnect-meta
    type: regression
    given:
      - "Meta token expired, tenant tiene page_id=P1 saved"
    when: "User clickea Reconectar → completes OAuth"
    then:
      - "Status → active"
      - "DB: page_id=P1 preserved"
      - "Toast 'Reconectado'"
    graders:
      - type: e2e
        path: null

  - id: oauth-canceled-by-user
    type: negative
    given:
      - "User clickea Reconectar"
    when: "User cancels en OAuth screen"
    then:
      - "Redirect a /connections con status sin cambio"
      - "Toast 'OAuth cancelado'"
    graders:
      - type: e2e
        path: null

  - id: reconnect-different-account
    type: edge
    given:
      - "Tenant con Meta page_id=P1 saved, reconnect con cuenta diferente que no admin P1"
    when: "Reconnect completes"
    then:
      - "Config preserva page_id=P1 pero status=mismatch_warning"
      - "UI prompt: 'tu nuevo account no admin la page anterior, ¿elegir otra?'"
    graders:
      - type: e2e
        path: null

  - id: cross-tenant-reconnect-spoof
    type: adversarial
    given:
      - "Attacker callback con state forged tenant T2"
    when: "OAuth callback"
    then:
      - "State validation rejects"
      - "NO se afecta T2 connection"
    graders:
      - type: contract_test
        path: "backend/tests/modules/connections/test_meta_tenant_isolation.py"

cross_module:
  reads_from: []
  read_by: []
  emits_events:
