      test ${PIPESTATUS[0]} -eq 0
    must_pass: true
    addressed_by_tickets: [T-5]

  # Cross-package integration smoke
  - id: V-F-x-1
    name: "Cross-package Python import works (Story 4 packages consume platform + iam)"
    description: "Per 01-spec.md scenario A — luana_core_{crm,analytics_engine,landing,connections}.* imports from luana_core_platform.* AND luana_core_iam.* work."
    command: |
      cd ~/luana-platform && uv run python -c "
      # Story 4 domain entities
      from luana_core_crm.domain.lead import Lead
      from luana_core_crm.domain.customer import CustomerProfile
      from luana_core_crm.domain.sale import Sale
      from luana_core_analytics_engine.domain.metric_catalog import METRIC_CATALOG
      from luana_core_analytics_engine.domain.extraction_contract import EXTRACTION_CONTRACTS
      from luana_core_landing.domain.landing_page import LandingPage
      from luana_core_connections.domain import ChannelType  # adjust if domain has different exports
      # Story 4 → Story 3 edges (iam)
      from luana_core_iam.domain.user import User
      from luana_core_iam.api.dependencies import get_current_user
      # Story 4 → Story 2 platform edges
      from luana_core_platform.domain.base_entity import Base
      from luana_core_platform.domain.currency import FALLBACK_CURRENCY
      print('all Story 4 cross-package imports OK')
      "
    must_pass: true
    addressed_by_tickets: [T-8]

  - id: V-F-x-2
    name: "uv run pytest entire luana-platform (Stories 2+3+4) GREEN"
    description: "Aggregate test runs Story 2+3+4 packages + arch fitness in one command. Confirms no regressions in Story 2+3 packages from new Story 4 workspace deps."
    command: |
      cd ~/luana-platform && uv run pytest core/ -x -q --tb=short --ignore=core/src 2>&1 | tail -30
      test ${PIPESTATUS[0]} -eq 0
    must_pass: true
    addressed_by_tickets: [T-8, T-11, T-12]

  # ETL extraction-contract regen smoke + idempotency
  - id: V-F-etl-1
    name: "make extraction-contract regenerates markdown successfully"
    description: "Per 01-spec.md §3.3 + scenario B — per-package Makefile target executes the script and writes docs/extraction-contract.md."
    command: |
      cd ~/luana-platform/core/luana-core-analytics-engine
      make extraction-contract 2>&1 | tail -20
      test -f docs/extraction-contract.md && test -s docs/extraction-contract.md
    must_pass: true
    addressed_by_tickets: [T-9]

  - id: V-F-etl-2
    name: "make extraction-contract is idempotent (same bytes on consecutive runs)"
    description: "Per 03-arch.md §7.3 — two consecutive regens produce identical SHA256."
    command: |
      cd ~/luana-platform/core/luana-core-analytics-engine
      make extraction-contract > /dev/null 2>&1
      HASH1=$(sha256sum docs/extraction-contract.md | cut -d' ' -f1)
      make extraction-contract > /dev/null 2>&1
      HASH2=$(sha256sum docs/extraction-contract.md | cut -d' ' -f1)
      if [ "$HASH1" != "$HASH2" ]; then
        echo "FAIL: extraction-contract regen drifted between runs"
        echo "  hash1=$HASH1"
        echo "  hash2=$HASH2"
        exit 1
      fi
      echo "OK: regen idempotent"
    must_pass: true
    addressed_by_tickets: [T-9]

  # Connections engine smoke
  - id: V-F-conn-1
    name: "Connections engine accepts stub adapter registration (brand-agnostic)"
    description: "Per 01-spec.md scenario C + §3.4 — engine ABC structural contract preserved, can register a stub adapter without brand affiliation."
    command: |
      cd ~/luana-platform && uv run pytest core/luana-core-connections/tests/test_engine_stub_adapter_registration.py -x -q --tb=short 2>&1 | tail -20
      test ${PIPESTATUS[0]} -eq 0
    must_pass: true
    addressed_by_tickets: [T-10]

