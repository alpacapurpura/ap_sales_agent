# 04-validators.yaml — luana-crm-analytics-landing-connections
#
# Schema v4: 5 categories (non_functional / functional / visual / agentic_eval / documentation).
# Each validator MUST be shell-executable. must_pass flag indicates blocking vs informational.
#
# Order of execution (mirrors §2 lift order in 03-arch.md):
#   1. Workspace registration (V-NF-1..3)
#   2. Per-package smoke (V-F-py-1..4)
#   3. Cross-package integration (V-F-x-1..2)
#   4. ETL contract regen smoke (V-F-etl-1..2)
#   5. Connections engine smoke (V-F-conn-1)
#   6. AISALESHT untouched (V-NF-4)
#   7. No-publish (V-NF-5..7)
#   8. Brand-agnostic engines arch fitness (V-AG-1..3)
#   9. Documentation (V-D-1..2)

non_functional:
  - id: V-NF-1
    name: "uv sync --all-packages succeeds (Python workspace, 19 packages)"
    description: "Root pyproject.toml lists all Story 2+3+4 packages as workspace members. uv resolves all sources."
    command: |
      cd ~/luana-platform && uv sync --all-packages 2>&1 | tail -20
      test ${PIPESTATUS[0]} -eq 0
    must_pass: true
    addressed_by_tickets: [T-1, T-8]

  - id: V-NF-2
    name: "Each Story 4 Python package has pyproject.toml at version 0.0.1-alpha"
    description: "Per spec §3.1 — 4 packages × pyproject.toml at correct version."
    command: |
      cd ~/luana-platform
      MISSING=0
      for pkg in luana-core-crm luana-core-analytics-engine luana-core-landing luana-core-connections; do
        if [ ! -f "core/${pkg}/pyproject.toml" ]; then echo "MISSING: core/${pkg}/pyproject.toml"; MISSING=$((MISSING+1)); fi
        if ! grep -q 'version = "0.0.1-alpha"' "core/${pkg}/pyproject.toml" 2>/dev/null; then echo "WRONG VERSION: core/${pkg}"; MISSING=$((MISSING+1)); fi
      done
      test $MISSING -eq 0
    must_pass: true
    addressed_by_tickets: [T-2, T-3a, T-3b, T-3c, T-4, T-5]

  - id: V-NF-3
    name: "Workspace declares Story 4 packages in [tool.uv.sources]"
    description: "All 4 Story 4 packages registered as workspace sources for cross-package import resolution."
    command: |
      cd ~/luana-platform
      MISSING=0
      for pkg in luana-core-crm luana-core-analytics-engine luana-core-landing luana-core-connections; do
        if ! grep -q "^${pkg} = { workspace = true }" pyproject.toml; then echo "NOT IN [tool.uv.sources]: ${pkg}"; MISSING=$((MISSING+1)); fi
      done
      test $MISSING -eq 0
    must_pass: true
    addressed_by_tickets: [T-1]

  - id: V-NF-4
    name: "AISALESHT not modified in Story 4 commits"
    description: "Per 01-spec.md §3.6. NO file under backend/src/modules/{crm,analytics,landing,connections}/ OR backend/tests/modules/{same set}/ modified during Story 4."
    command: |
      cd /home/chris/AISALESHT
      BASE_SHA=$(grep -oP 'base_sha:\s*\K[a-f0-9]+' docs/product/stories/luana-crm-analytics-landing-connections/checkpoint.md 2>/dev/null || git rev-parse HEAD)
      DIFF=$(git diff "$BASE_SHA" HEAD --name-only 2>/dev/null | grep -E '^(backend/src/modules/(crm|analytics|landing|connections)|backend/tests/modules/(crm|analytics|landing|connections))/' || true)
      if [ -n "$DIFF" ]; then
        echo "AISALESHT FILES MODIFIED (forbidden Story 4 surfaces):"
        echo "$DIFF"
        exit 1
      fi
      echo "OK: AISALESHT untouched"
    must_pass: true
    addressed_by_tickets: [T-13]

  - id: V-NF-5
    name: "No publishConfig in any Story 4 package"
    description: "Per 01-spec.md §3.7 — no GH Packages publishing in Story 4 (Story 9 territory)."
    command: |
      cd ~/luana-platform
      OFFENDERS=$(grep -l 'publishConfig\|\[project\.urls\].*registry' core/luana-core-crm/pyproject.toml core/luana-core-analytics-engine/pyproject.toml core/luana-core-landing/pyproject.toml core/luana-core-connections/pyproject.toml 2>/dev/null || true)
      if [ -n "$OFFENDERS" ]; then echo "Found publish config in: $OFFENDERS"; exit 1; fi
      echo "OK: no publish config"
    must_pass: true
    addressed_by_tickets: [T-13]

  - id: V-NF-6
    name: "No .releaserc.json files introduced by Story 4"
    description: "Per 01-spec.md §3.7."
    command: |
      cd ~/luana-platform
      FOUND=$(find . -name '.releaserc*' -not -path './node_modules/*' 2>/dev/null || true)
      if [ -n "$FOUND" ]; then echo "Found release configs: $FOUND"; exit 1; fi
      echo "OK"
    must_pass: true
    addressed_by_tickets: [T-13]

  - id: V-NF-7
    name: "No release.yml or publish workflow added"
    description: "Per 01-spec.md §3.7."
    command: |
      cd ~/luana-platform
      FOUND=$(find .github/workflows -name 'release*' -o -name 'publish*' 2>/dev/null || true)
      if [ -n "$FOUND" ]; then echo "Found release/publish workflows: $FOUND"; exit 1; fi
      echo "OK"
    must_pass: true
    addressed_by_tickets: [T-13]

  - id: V-NF-8
    name: "uv run ruff check Story 4 packages GREEN"
    description: "Per 01-spec.md §3.5 — ruff baseline passes on lifted code (lift mode preserves lint state from AISALESHT)."
    command: |
      cd ~/luana-platform && uv run ruff check core/luana-core-crm core/luana-core-analytics-engine core/luana-core-landing core/luana-core-connections 2>&1 | tail -20
      test ${PIPESTATUS[0]} -eq 0
    must_pass: true
    addressed_by_tickets: [T-13]

