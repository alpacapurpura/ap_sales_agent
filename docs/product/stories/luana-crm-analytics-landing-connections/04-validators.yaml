    name: "luana-core-analytics-engine tests pass (102 tests)"
    description: "uv run pytest core/luana-core-analytics-engine/tests/ GREEN. Includes test_metric_catalog.py for catalog SSoT alignment."
    command: |
      cd ~/luana-platform && uv run pytest core/luana-core-analytics-engine/tests/ -x -q --tb=short 2>&1 | tail -30
