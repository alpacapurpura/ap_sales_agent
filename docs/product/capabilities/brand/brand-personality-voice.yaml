## Capabilities cubiertas por este grupo

- Edición de PersonalityProfile (3 pilares: dimensions, patterns, exchanges)
- 6 presets base (cercano, autoridad, directo, etc) seleccionables
- Cloning de estilo desde un chat real pegado por el user (extracción LLM)
- Edición de communication_style (`brand_studio/estilo`) — punto único de configuración
- system_instruction generada (SSoT voz consumida por sales_agent compiler v2)
- Voice fidelity grader (grader.py) para validar output agentes contra voz declarada

