## Gaps identificados

- E2E `personality.smoke.spec.ts` solo valida render — falta regression flow completo (edit → save → sales_agent consume nueva voz)
- Voice fidelity grader (`backend/src/modules/brand/application/voice_fidelity/grader.py`) tiene tests pero no está incluido en CI gates de PRs que tocan personality
- Cloning chat agentic no tiene eval suite dedicada (no rubrics, no personas de prueba)
- DR-7 (BudgetGuard wiring) — 7 callsites brand sin BudgetGuard wrap activo
