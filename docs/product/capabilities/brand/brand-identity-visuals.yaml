## Capabilities cubiertas por este grupo

- Edición de identidad de marca (logo, paleta de colores, tipografía base) vía formulario guiado
- Edición de visuales extendidos (galería, mockups, elementos gráficos) en sección dedicada
- Persistencia tenant-scoped en `brand_settings` con auto-save on change
- Auto-fill desde extracción web/docs (operable desde copilot)

