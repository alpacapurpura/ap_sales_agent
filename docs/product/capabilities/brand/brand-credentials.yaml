- Team CRUD: agregar/editar/eliminar miembros con foto, rol, bio, redes
- Testimonials CRUD: agregar/editar testimonios con autor, foto, texto, métrica destacada
- Authority Vault CRUD: credenciales (logros, premios, methodology, certificaciones, números clave)
- Páginas dedicadas en brand-studio: `/team`, `/testimonials`, `/authority`

