## Capabilities cubiertas por este grupo

- Creación de buyer persona nueva (multi-persona soportado por tenant)
- Edición de persona existente (demografía, dolores, motivaciones, objeciones)
- Upload de docs (transcripciones de entrevistas, perfiles previos) → auto-fill via LLM extraction
- Field-contract-platform homologado (mismo runtime que offer-studio)

