## Capabilities cubiertas por este grupo

- Scraping web (multiple fuentes / crawler) → extracción identity, story, positioning, voice
- Upload de documentos (PDF, transcripciones, copy) → extracción wave-based
- Orquestador wave-based (`BaseExtractionOrchestrator` shared) con persistencia per-wave
- Trace events (`extraction_trace`) para observabilidad y debugging del pipeline

