## Gaps identificados

- No hay verificación E2E del flujo completo "subo URL → veo brand poblada en UI"
- Worker de re-extracción (`brand_summary_regen`) usa LLM sin BudgetGuard activo (DR-7)
- Cost monitoring del pipeline (tokens/USD por extraction) no surface en UI ni en alerting
