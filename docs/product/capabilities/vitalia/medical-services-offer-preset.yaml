# vitalia-medical-services-offer-preset

Vitalia offer presets for medical services: prepaid payment (MercadoPago LIFT shared) + Stripe Connect tokenized recurring + booking flow with advisory_locks.

## Surface

- **MercadoPagoAdapter LIFT SHARED** (T-payment-1): lifted to `@luana/core/channels` from nicolify; vitalia extends `VitaliaMercadoPagoAdapter(MercadoPagoAdapter)` for medical-specific payment metadata (treatment_id, doctor_id, consent_required)
- **Stripe Connect + Tokenized Recurring** (T-payment-2): adapter for cross-border + recurring follow-up payments
- **BookingService + advisory_locks** (T-be-5): prevents double-booking of doctor slots via Postgres advisory locks
- **PrepaidPaymentService** (T-be-6): manages patient prepaid balances + quota deduction per procedure
- **5 webhook receivers HMAC + idempotency** (T-be-8): payment confirmations, refunds, chargebacks, reschedules, cancellations

## Test coverage

- T-payment-1: 38/38 + 100/100 core regression
- T-payment-2: 16/16 (skip integration — Postgres)
- T-be-5: 9/9 unit (6 integration skip — Postgres)
- T-be-6: 25/25 PASS
