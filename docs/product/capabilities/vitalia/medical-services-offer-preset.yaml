## Dependencies

- luana-core-channels (MercadoPagoAdapter base — Story 11 LIFT)
- luana-core-payments (Stripe Connect base — Story 9?)
- luana-core-platform (advisory_locks helpers)
- vitalia/backend repositories

## Scenarios live

- Patient books appointment → BookingService checks doctor slot + advisory_lock acquired → prevents race
- Patient pays prepaid via MercadoPago → MercadoPago webhook → HMAC verified + idempotency → balance updated
- Recurring follow-up payment via Stripe Connect tokenized → cross-border + auto-debit
- Patient cancels → refund webhook + advisory_lock released
- Chargeback received → ComplianceEvent recorded + admin notified
