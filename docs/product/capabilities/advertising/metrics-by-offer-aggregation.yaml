## Capabilities cubiertas por este grupo

- GET `/api/v1/advertising/metrics-by-offer` con query params (date_from, date_to, offer_id opcional)
- Aggregation MetricsByOfferService cruza `official_metrics` con `ad_offer_association`
- Currency desde Meta account (multi-currency LATAM)
- Repository métricas tenant-scoped
- Funnel reach calculation per offer

