## Gaps identificados

- Auto-detect text matching es heurístico (string similarity) — no LLM-based, deja false negatives
- No hay UI dedicada en growth-studio para gestionar asociaciones (solo API + offer-studio campaigns view)
- Module doc describe advertising como "placeholder" pero implementación tiene 11 archivos test — drift documentación
