## Capabilities cubiertas por este grupo

- POST/DELETE/GET asociaciones ad ↔ offer (`/api/v1/advertising/associations`)
- Auto-detect via text matching (ad copy ↔ offer titles) — `OfferDetectionService`
- Sugerencias batch + apply suggestions endpoint
- Repository tenant-scoped soft-delete
- AssociationTargetType enum (CAMPAIGN/ADSET/AD)
- AssociationType enum (MANUAL/AUTO_DETECTED)

