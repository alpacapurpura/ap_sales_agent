## Capabilities cubiertas por este grupo

- `infrastructure/channels/meta.py` — OAuth flow + token exchange + refresh
- `infrastructure/channels/instagram.py` — IG specific endpoints (organic + DM via Manychat)
- `api/meta.py` — endpoints `/api/v1/connections/meta/{auth-url, callback, pages, ad-accounts}`
- `api/dto/` — Pydantic DTOs PII-stripped
- Token rotation handling (long-lived 60d → refresh)
- Status monitoring (healthy/disconnected/expired)
- Test connection endpoint
- Reconnect flow tras token expiry
- IG Direct Login = placeholder (OAuth credentials configured, flow pendiente per module doc)

