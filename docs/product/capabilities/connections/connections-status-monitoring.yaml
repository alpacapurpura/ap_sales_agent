## Capabilities cubiertas por este grupo

- `api/health.py` — endpoint `/api/v1/connections/health` retorna status all platforms
- `api/status.py` — per-platform status detail
- `application/services/connection_port_impl.py` — abstracción para sales_agent/copilot/scheduling consume
- `infrastructure/repositories/` — channel_connection_repository con soft delete
- FE feature `frontend/src/features/connections/` — list view + reconnect button + test connection
- Cross-module port (`shared/links/ports/connection.py`) — read-only consumers
- Soft delete handling (deleted_at filter)
- Test connection per platform endpoint

