## Capabilities cubiertas por este grupo

- `infrastructure/marketing_connectors/manychat.py` — full client wrapper Manychat API
- `api/manychat.py` — webhook endpoints `/api/v1/connections/manychat/webhook`
- `api/marketing_webhooks.py` — generic ingestion router
- Send Content API (text, quick replies, attachments)
- Subscriber sync + custom field updates
- Tags management (apply/remove for state pivots)
- Trigger flows via API
- Webhook signature validation (Manychat secret token)

