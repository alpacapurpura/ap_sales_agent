## Capabilities cubiertas por este grupo

- `infrastructure/channels/google_calendar.py` — Calendar adapter
- `infrastructure/channels/gmail.py` — Gmail adapter
- `infrastructure/channels/google_ads.py` — Ads adapter
- `infrastructure/channels/google_analytics.py` — GA4 adapter
- `api/google_workspace.py` — Workspace OAuth bundle
- `api/google_analytics.py` — GA4 specific (property selection)
- `api/calendar.py` — Calendar webhook + watch channel
- `api/gmail.py` — Gmail send + reply tracking
- Token refresh + incremental scopes
- Property picker GA4 (BE done per active context, FE PENDING per MEMORY.md)

