## Capabilities cubiertas por este grupo

- `plan_config` table con 5 planes default editables sin migration
- `tenant_subscriptions` 1 row per tenant con `custom_overrides JSONB` (e.g. `{"llm_budget_total_usd": X, "max_outbound_msg_per_day": Y}`)
- `PlanService.get_effective(tenant_id)` mergea base plan + custom_overrides con cache 5min
- Redis pub/sub invalidation cross-instance al cambiar plan o override
- Streamlit admin `/planes-billing` con toggle `is_default` atómico + partial unique index `uq_plan_config_one_default`
- `BillingDefaultPlanMissingError` fail-fast si no hay default plan

