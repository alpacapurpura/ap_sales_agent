## Gaps identificados

- API user-facing pública para "qué plan tengo" ausente (solo admin)
- Tests de cache invalidation cross-instance vía Redis no exhaustivos
- Sin tool copilot para "subir plan" / self-serve upgrade
- Sin BudgetGuard wired a custom_overrides en todos los módulos consumidores (DR-7 pendiente)
