## Capabilities cubiertas por este grupo

- Webhook Clerk `user.created/updated/deleted` → sync espejo local users (POST `/api/v1/iam/webhooks/clerk`)
- Resolución `get_current_user` (Depends) desde JWT Clerk + auto-sync campos perfil
- `get_tenant_context` (Depends) inyecta tenant_id desde header `X-Tenant-ID` con validación membership user→tenant
- `TenantLocale` VO resuelto por tenant para currency/timezone (master data)
- Roles básicos owner/member (sin RBAC granular todavía)

