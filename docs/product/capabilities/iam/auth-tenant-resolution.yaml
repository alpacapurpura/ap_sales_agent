## Gaps identificados

- Roles avanzados ausentes (solo owner/member; sin RBAC por feature)
- Onboarding sin flow conversacional copilot (gap doc en módulo)
- Sin tool copilot para invitar member nuevo
- Webhook signature verification en `webhooks.py` debería tener test adversarial dedicado (signature mismatch)
- Sin métric/alerting ante webhook failures (silent drop posible)
