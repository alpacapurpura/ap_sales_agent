## Capabilities cubiertas por este grupo

- 3 tools BE (`get_stage_metrics`, `get_channel_overview`, `trigger_etl_refresh`) en `ANALYTICS_TOOLS` group de copilot module
- 5 action React components: `StageMetricsAction`, `ChannelOverviewAction`, `ETLRefreshAction`, `ETLRateLimitedAction`, `ETLConfirmAction`
- 4 zod schemas con `.strict()` parity vs Pydantic `extra="forbid"` (filter params, channel config, KPI selection, tier loading)
- `actions/registry.ts` side-effect import desde `schemas/index.ts` (mirror brand-studio pattern)
- `EtlRefreshGuard` Redis sliding-window (1h window, 3/hour limit per channel, fail-open per tessl__graceful-degradation)
- Cross-stack contract test (z.toJSONSchema() ↔ Pydantic schema)
- 3 voice fidelity eval goldens para nuevos tool calls (sales_agent personas/rubrics)

