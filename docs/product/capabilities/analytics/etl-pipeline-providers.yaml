## Capabilities cubiertas por este grupo

- 12+ provider adapters (Meta Ads, Meta Pixel, Google Ads, GA4, Search Console, Shopify, MailerLite, Manychat, TikTok, YouTube, CRM internal) en `backend/src/modules/analytics/infrastructure/providers/`
- Period-aware extraction Meta (`time_increment=1`) — invariante daily-only enforced por arch tests
- Upsert idempotente sobre `official_metrics` (PK natural: tenant_id + channel + metric + date)
- Currency preservada desde data source (no convert on write)
- Scheduler tick + ETL service orquestación (`etl_service.py`)
- Extraction contract sincronizado código + docs (auto-gen `docs/etl/extraction-contract.md`)
- Provider registry SSoT (`providers/registry.py`)

