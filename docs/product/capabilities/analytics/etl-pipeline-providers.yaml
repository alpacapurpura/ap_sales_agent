## Gaps identificados

- ETL credential expiry (Meta/GA4) silent fail: no hay alerta proactiva al user via copilot push notification cuando token caduca
- Initial-load endpoint (`POST /metrics/{provider}/initial-load`) tiene status endpoint pero sin progress streaming UI
- Provider adapter Manychat / TikTok tienen menos cobertura tests que Meta/Google (unit tests existen, integration tests parciales)
- No hay regression e2e que valide pipeline end-to-end source-of-truth post-extraction (capa 1 source probe existe via `make verify-probe-{p}`, no E2E con UI)
