## Gaps identificados

- Action triggers tienen UI pero integraciones limitadas (e.g. "crear campaña desde nodo Bowtie conversacionalmente" gap reconocido en module doc)
- Smoke manual stages × mobile + desktop PENDIENTE Chris (drawer/bowtie hotfix PI-8)
- No hay e2e regression dedicado que valide los 4 tiers progressive loading bajo carga (tier 3 cache invalidation edge cases)
- Stage detail expansión/evangelización tienen menos cobertura tests vs attraction/capture
