## Capabilities cubiertas por este grupo

- Bowtie summary endpoint (`GET /metrics/summary`) Tier 0 — load instantáneo, KPIs agregados
- Stage overview endpoints (`GET /metrics/{stage}/overview`) Tier 1 — cache warm
- Group detail endpoints (`GET /metrics/{stage}/groups/{group_key}`) Tier 2 — cache hit
- Stage detail endpoints (`GET /metrics/attraction|capture|nurturing|...`) Tier 3 — DB query
- Stage services SSoT (`stage_services/{attraction,capture,nurture,opportunity,sales,adoption,expansion,evangelization}_stage.py`)
- Bowtie sankey chart (`GET /metrics/sankey`)
- Timeseries por stage (`GET /metrics/timeseries`)
- Channel-grouped widgets (Tier 2 group_detail)
- Multi-currency display via TenantLocale + per-channel currency
- Action triggers (clic nodo → right slider con action ejecutable: ad sync, campaign launch, etc)

