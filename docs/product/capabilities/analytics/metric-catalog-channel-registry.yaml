## Gaps identificados

- Industry benchmarks son hardcoded — no actualizados por proceso continuo
- Metric catalog endpoint no expone documentación human-readable (solo machine-format)
- Channel registry no tiene UI admin para inspeccionar el catálogo desde Streamlit
