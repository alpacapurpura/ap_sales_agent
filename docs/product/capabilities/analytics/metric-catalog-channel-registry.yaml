## Capabilities cubiertas por este grupo

- Metric catalog endpoint (`GET /metrics/catalog`) — listado métricas con units, currency flag, semantics
- Metric resolver (`metric_resolver.py`) cross-source aggregation
- Channel registry (`channel_registry.py`) — único origen slugs canales (`facebook`, `google_ads`, `email-attraction`, etc)
- Group mappings (`STAGE_CHANNEL_MAP`, `_GROUP_MAP` en `constants.py`) — agrupación canales por stage
- Cost-type mapping (`cost_type_mapping.py`) — clasificación costos
- Industry benchmarks (`industry_benchmarks.py`) — referencia comparativa

