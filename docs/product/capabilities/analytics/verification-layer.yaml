## Capabilities cubiertas por este grupo

- Layer 0 ETL execution verification (`make verify-etl provider={n}`)
- Layer 1 Source Probe (provider API call vs DB row equality)
- Layer 2 Pipeline integrity (DB row vs serialized DTO)
- Layer 3 UI Fidelity (API response vs rendered display value)
- Extraction contract enforcement (`backend/src/modules/analytics/domain/extraction_contract.py` SSoT + arch test gate)
- Auto-gen contract MD on `make extraction-contract`

