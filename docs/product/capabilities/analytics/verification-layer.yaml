## Gaps identificados

- Layer 3 UI Fidelity verification depende de Playwright runner que no corre en CI por default (manual)
- No hay alerta automática cuando contract drift detected — el arch test falla pero no notifica al equipo
- Verification layers no están integradas en `/test-all` pipeline native — corren solo on-demand
