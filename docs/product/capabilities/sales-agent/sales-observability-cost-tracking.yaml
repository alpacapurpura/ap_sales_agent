## Gaps identificados

- **Cost tracking accuracy degraded** (resolved_by: sales-agent-litellm-canonicalization, on: 2026-05-06): bug `cost_usd=0` por pricing resolution (deepseek mis-tag como openai en `model_pricing_snapshot`) eliminado en raíz. LiteLLM Proxy = canonical único path runtime (6 adapters legacy DELETED, flag LITELLM_PROXY_ENABLED REMOVED), cost_usd via CostRecorderCustomLogger bridge consume kwargs['response_cost'] directo, pricing snapshot reducido a audit ledger inmutable. Migración historical T-3 + 4 cols tenant API key deprecadas T-6a/T-6c.
- Retention worker exists but no production observability dashboard (Streamlit `/admin/cost-sales-agent` placeholder)
- No alert rules (Prometheus/Grafana) on cost overrun per tenant
- Dual-write reconciliation worker exists pero no schedule documented (cron expression)
