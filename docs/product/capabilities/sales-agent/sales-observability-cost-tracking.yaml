## Gaps identificados

- **Cost tracking accuracy degraded** (en remediación por `sales-agent-litellm-canonicalization` PI-12 S1): `cost_usd=0` por pricing resolution (deepseek mis-tag como openai en `model_pricing_snapshot`). Story planeada elimina el bug en raíz canonicalizando LiteLLM como único path runtime + pricing snapshot pasa a audit ledger inmutable.
- Retention worker exists but no production observability dashboard (Streamlit `/admin/cost-sales-agent` placeholder)
- No alert rules (Prometheus/Grafana) on cost overrun per tenant
- Dual-write reconciliation worker exists pero no schedule documented (cron expression)
