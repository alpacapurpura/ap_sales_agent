## Capabilities cubiertas por este grupo

- `observability/recording/turn_envelope.py` — `SalesAgentObservabilityContext(BaseObservabilityContext)` con custom slots
- `observability/recording/callback_handler.py` — `SalesAgentCallbackHandler(BaseAgentCallbackHandler)` LLM/tool/chain hooks
- `observability/persistence/sales_agent_trace_event_repository.py` + `sales_agent_llm_call_repository.py`
- Cost tracking: PricingResolver shared + FXResolver.default() — captura cost_usd + fx_rate en errors (best-effort)
- Domain event subscribers (`observability/domain_events/`) — pricing_alias_resolved, fx_resolved
- PII redaction obligatoria via `sanitize_payload()` shared
- Reconciliation worker (`observability/workers/dual_write_reconciliation.py`) — verify dual-write integrity
- `observe_turn` lifecycle around `agent_app.ainvoke` (PR-2 PI-1.1 commit `d80d15f5`) — traces reales persistidos
- Pool isolation: SA bucket vs Others bucket (BudgetGuard primitive shared)

