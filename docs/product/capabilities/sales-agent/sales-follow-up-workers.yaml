## Capabilities cubiertas por este grupo

- `workers/follow_up_engine.py` — cadencias config en `domain/tuning.py::FOLLOW_UP_CADENCES` (e.g., 1h, 24h, 3d, 7d)
- `workers/payment_reminder_engine.py` — recordatorio pago pending (link no clickeado o checkout abandonado)
- `workers/appointment_reminder_engine.py` — recordatorio cita próxima
- `workers/frozen_detection.py` — detecta conversación detenida >N hours, reabre
- `workers/verify_pending_bookings.py` — verifica con Google Calendar bookings sin confirm
- `workers/verify_pending_payments.py` — verifica con Mercado Pago / Stripe payments pending
- Idempotency vía `shared/idempotency/` decorator
- ComplianceService + OutboundRateLimiter gates pre-send

