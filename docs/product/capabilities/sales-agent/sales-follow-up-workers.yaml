## Gaps identificados

- No load test workers (cron concurrency con miles de leads)
- Frozen detection threshold hardcoded (`MAX_INTERNAL_TURNS` en `domain/tuning.py`) — no per-tenant tunable
- Tests `test_follow_up_engine.py` cubren happy + cadencia básica pero NO escenario adversarial (lead respondió "no me contactes más" → se sigue contactando = bug)
- No structured event emission documented al WMS de marketing (analytics) para feedback loop
