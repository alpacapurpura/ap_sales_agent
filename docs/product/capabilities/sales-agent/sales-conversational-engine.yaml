- ~~**Eval suite agentic faltante**: NO existe `backend/tests/agentic_evals/sales_agent/`~~ → **EN CURSO PI-12**: addressed por `sales-agent-eval-runner-foundation` (planned 2026-05-04, foundation harness multi-layer 5 capas: trajectory + tool_calls + output + cost + latency). Stories 2-9 del PI-12 lo extienden (pass^k, budget cap, 3-tenant goldens, personas, voice grader, CI gate, adversarial).
