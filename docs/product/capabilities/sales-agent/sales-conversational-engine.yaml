## Capabilities cubiertas por este grupo

- LangGraph supervisor → routea entre `qualifier`, `product_expert`, `closer` por estado/score
- Brand voice SSoT: `PersonalityProfile.system_instruction` compilado v2 (6 bloques "ASÍ HABLAS / ASÍ NO") inyectado en slot 5 cache prefix
- Specialists static prompt body (cacheable cross-tenant) + state-dependent suffix
- Semantic router → tier pricing (Kimi K2.6 / DeepSeek V4-Flash / GPT-4o por complejidad)
- Per-tenant prompt caching slots 1-6 byte-equal — hit rate ≥60%
- Supervisor outbound skip-qualifier flag (lead_score >= 40 + outbound_mode → directo a closer)
- BudgetGuardingChatModel wired single-point en `ConversationPipeline.__init__` — gating SA pool reservado
- ComplianceService gating outbound (WABA24h + OptIn + Blacklist + CountryBlock)
- OutboundRateLimiter Redis sliding window 24h cap por tenant

