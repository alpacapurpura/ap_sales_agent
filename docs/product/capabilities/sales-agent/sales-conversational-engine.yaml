## Gaps identificados

- **Eval suite agentic faltante**: NO existe `backend/tests/agentic_evals/sales_agent/` — solo unit tests `test_nodes.py` + snapshot tests `test_chat_orchestrator_snapshot.py`. CRÍTICO.
- Voice fidelity grader: `SALES_AGENT_VOICE_FIDELITY_THRESHOLD` env default 0.7 declared (Decision 30) pero coverage de runs reales contra goldens dataset = 0% (no goldens checked-in)
- Personas (`lead-caliente-ready`, `lead-frio-impaciente`, `lead-tibio-dudoso`) declarados en `docs/specs/personas/` pero NO consumidos por suite alguna
- Adversarial scenarios (jailbreak, prompt injection, persona hostile leak system prompt) no instrumentados
- `cost_usd=0` post-fix por pricing resolution (deepseek tagged como openai) — backlog PR follow-up
