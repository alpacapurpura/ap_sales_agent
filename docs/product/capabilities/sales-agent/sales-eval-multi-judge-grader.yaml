description: "MAJ-EVAL state machine grades simulated transcripts via 3 heterogeneous judges (Sonnet 0.4 + GPT-4o 0.4 + Kimi 0.2) per (turn × rubric). Round 1 parallel asyncio.gather + Semaphore(20). Variance >0.15 (Round 1 max-min) triggers Round 2 peer-only debate (DQ3 anti-anchoring — judge sees peer scores+brief reasoning, NOT own R1 score). R2 partial fallback DQ6. Unconverged → R1 weighted avg + suspicious flag DQ8. Cache via 5-field SHA256 hash (rubric_version + judge_weights + voice_hash + transcript_hash + judge_set_hash) → invalidation precision. Sandbox markers cement (literal <<TRANSCRIPT_BEGIN>>...<<TRANSCRIPT_END>> Slot 5 + system directive Slot 1 — DQ2 3-layer enforcement). Cost-bucket H7 separation (writes eval_simulator_llm_call ONLY — zero contamination of copilot/sales_agent/campaign cost buckets enforced by AST gate). LiteLLM Proxy ONLY dispatch (D-AG-17). Voice SSoT personality_profile.system_instruction consumed READ-ONLY (NO distill/mirror/fine-tune)."
