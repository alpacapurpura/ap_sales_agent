    summary: "Re-run identical (transcript + voice + rubric_v + judges + weights) returns cached MajEvalScore from eval_simulator_grade_cache (lookup by 5-field SHA256). Mutate ONE field (e.g., rubric_version bump) → cache miss → fresh grade. 3 invalidation tests cover rubric_version + judge_weights + voice_hash precision."
