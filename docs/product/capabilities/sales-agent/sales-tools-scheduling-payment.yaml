## Gaps identificados

- **Adversarial tool call**: agente invocando tool con args inventados o `tool` no en allowlist — test trajectory grader pendiente
- Tool failure recovery (provider 500/timeout) — `test_tools.py` unit-tested pero no en eval suite agentic con persona simulada
- No goldens dataset para tool sequences (qualifier→closer→send_payment_link)
- `escalate_to_human` → Closer Studio handoff: no e2e regression entre handoff + WS notification
