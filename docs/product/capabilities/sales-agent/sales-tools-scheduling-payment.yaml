## Capabilities cubiertas por este grupo

- `scheduling/tools.py` + `scheduling/providers.py` — Google Calendar OAuth via connections, slot resolution per timezone tenant
- `payment/tools.py` + `payment/providers.py` — Mercado Pago / Stripe / PayPal links generation
- `enrollment_tools.py` — list_public_editions, create_enrollment (INTENT/WAITLIST), generate_payment_link, resolve_active_tier
- `webhook_providers.py` (scheduling + payment) — recibe callbacks providers, emite eventos a `scheduling_event_handlers.py` + `payment_event_handlers.py`
- `tools/registry.py` — registry SSoT de tools disponibles al specialist (bloqueado por allowlist)
- Voseo prohibido en tool args/responses (sales_agent respeta voz tenant pero schemas técnicos = neutro)

