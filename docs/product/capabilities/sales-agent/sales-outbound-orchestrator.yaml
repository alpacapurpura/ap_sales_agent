## Capabilities cubiertas por este grupo

- `OutboundOrchestrator.send_outbound(*, db, tenant_id, lead_id, campaign_id, campaign_instructions, channel_type, channel_adapter, budget_guard)` único entrypoint async
- AgentState additive: `campaign_id` / `campaign_instructions` / `outbound_mode` con defaults `None / None / False` — inbound chat path NO se rompe (arch test `test_campaign_state_additive.py` enforce)
- Slot 7 `CAMPAIGN_CONTEXT` emitted ONLY cuando `outbound_mode=True`. Cache prefix slots 1-6 byte-equal preservando hit rate ≥60%
- Supervisor skip-qualifier (`outbound_mode=True` + `lead_score >= 40` → directo a closer) — invariante 1000 clientes (NO per-tenant tunable)
- `SALES_AGENT_OUTBOUND_CLOSER_MIN_SCORE` env follow-up adjustment si telemetry false positives
- ComplianceService + OutboundRateLimiter pre-send gates obligatorios
- `SALES_AGENT_VOICE_FIDELITY_THRESHOLD` env default 0.7 (Decision 30 — global invariant)

