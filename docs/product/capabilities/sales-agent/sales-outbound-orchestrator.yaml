## Gaps identificados

- **No eval suite outbound**: voice fidelity threshold 0.7 declared pero NO runs reales midiéndose. Solo arch tests no-breaking + state additive
- ComplianceService bypass: si test no cubre escenario "tenant outside opt-in window" → outbound podría enviarse violando WABA24h
- Supervisor skip-qualifier edge: `lead_score=39` vs `lead_score=40` boundary no testeado con persona simulada
- E2E smoke: `frontend/e2e/specs/regression/sales/campaign-launch-telegram.spec.ts` cubre launch FE-side pero NO valida output agente respecting brand voice
