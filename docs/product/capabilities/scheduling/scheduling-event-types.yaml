## Capabilities cubiertas por este grupo

- `api/event_types.py` — CRUD endpoints `/api/v1/scheduling/event-types`
- `application/services/event_type_service.py` — domain logic
- `application/booking_url.py` — public booking URL computation (custom domain + slug)
- `domain/event_type_schema.py` — Pydantic schema duration/type/buffers/questions
- `api/public_links.py` — public read endpoints (no auth) para booking page
- `api/agenda.py` — tenant-facing agenda view (próximas citas)

