## Capabilities cubiertas por este grupo

- `connections/infrastructure/channels/google_calendar.py` — OAuth + adapter
- `application/services/availability_service.py` — compute available slots dado event_type + timezone tenant
- `domain/availability_schema.py` — JSON schema availability config (working_hours, blackout, buffers)
- `domain/event_type_schema.py` — duration, type (1:1, group, round-robin), buffers, custom domain integration
- TenantLocale-driven (timezone resolution per tenant)
- Watch channel push notifications (incremental sync no full pull)

