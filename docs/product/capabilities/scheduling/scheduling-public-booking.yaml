## Capabilities cubiertas por este grupo

- `api/public_links.py` — public endpoint sin auth (rate-limited per IP)
- ICS generation post-booking (RFC 5545)
- Email reminders via gmail/MailerLite connections
- Cancellation flow (single-use token)
- Reschedule flow (mantener attendees)
- Tenant_domain integration (booking under custom domain)
- Multi-timezone (lead picks own tz, agent stored in tenant tz)
- Confirmación email + ICS attachment

