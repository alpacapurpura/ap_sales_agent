## Capabilities cubiertas por este grupo

- Listado de eventos filtrable por country_code y rango fechas
- Vista `current-week` para sugerencias contextuales del copilot
- Crear / actualizar / eliminar eventos custom del tenant
- Sistema-wide holidays multi-país LATAM (compartidos cross-tenant, read-only para tenant)
- Tenant-specific events (CRUD completo, scoped a tenant_id)
- Copilot provider expuesto (módulo tiene `copilot_provider/`)

