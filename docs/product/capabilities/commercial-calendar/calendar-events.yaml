## Gaps identificados

- **No hay UI dedicada (FE placeholder)** — solo API + copilot provider
- Sin tool copilot que sugiera campaña basado en evento próximo (gap doc en módulo)
- Country code filtering no documenta default ni fallback (qué pasa si tenant no tiene country definido)
- Sin recurring events (eventos anuales como Black Friday no auto-generan próximas iteraciones)
- Sin coverage E2E (es módulo BE-only sin UI)
