## Gaps identificados

- Sin tool copilot para flow OAuth + verificación DNS conversacional (gap doc en módulo)
- Cloudflare API errors (rate limit, transient) no exponen retry policy clara al user
- Sin métric/alert si worker `poll_domain_verification` se atasca en pending por >24h
- No hay test E2E que exercise el wizard completo (solo unit FE + integration BE)
- DNS conflict edge cases (`extract_root_domain` cubre algunos pero no exhaustivo en e.g. wildcard subdominios)
