## Capabilities cubiertas por este grupo

- POST `/api/v1/domains/` — agregar custom domain con instrucciones DNS
- GET `/api/v1/domains/{id}/instructions` — instrucciones CNAME/TXT que el tenant pega en su DNS
- POST `/api/v1/domains/{id}/verify` — disparar verificación on-demand (re-check DNS + SSL status)
- GET listing + detail con status (`pending` | `verified` | `failed` | `active`)
- PATCH set primary domain
- DELETE soft delete
- Worker `poll_domain_verification` (background) polea Cloudflare hasta SSL ready
- UI lite `tenant-domains` feature: `CustomDomainWizard`, `DomainList`, `DomainSettings`, `DomainStatusBadge`, `PlatformSubdomain`

