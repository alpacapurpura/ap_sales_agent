## Capabilities cubiertas por este grupo

- Crear edition nueva clonando edition existente (dry-run preview soportado)
- Publish edition (archetype-aware rules — ej. cohort-based course requiere fechas)
- Archive de edition con propagación a landing/assets
- Lifecycle states (draft/published/archived/closed)

