## Capabilities cubiertas por este grupo

- Edición de oferta a nivel section (identity, promise, psychology, gallery, instructors, location, pricing, etc.)
- Pricing tiers con multi-currency (TenantLocale-driven)
- Variants polimórficas (TIER, BUNDLE) con archetype-aware UI
- Conditional questions por preset (76 presets soportados)
- Sections cross-módulo: LOCATION → scheduling, PRICING → connections, INSTRUCTORS → brand team

