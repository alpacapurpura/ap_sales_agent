## Capabilities cubiertas por este grupo

- Catálogo de 76 presets navegables por ExpertBusinessType
- Wizard preset picker en flow de creación de oferta
- Archetype/format/value-level inferidos a partir del preset
- Conditional questions per preset
- Versioning de catálogos via `_CATALOG_VERSION` bump (arch test enforces)

