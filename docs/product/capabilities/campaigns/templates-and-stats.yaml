## Gaps identificados

- Templates seed son globales hardcoded — no flow user-friendly para clonar+editar masivamente
- Frontend campaigns-lite tests solo covers detail/new clients — no E2E flow completo
- Variables resolución no expuesta al user (sin UI para previsualizar render template)
- Sales E2E spec `segment-create-and-launch-campaign.spec.ts` flaky por auth Clerk
