## Capabilities cubiertas por este grupo

- 5 templates globales seed con UUID v5 reproducible
- 7 endpoints REST `/api/v1/campaign-templates/` (CRUD + clone + catalog)
- CampaignTemplateService (catalog list, clone-to-tenant, variable resolution)
- Stats endpoint (`/campaigns/{id}/stats`)
- Frontend `frontend/src/features/campaigns-lite/` — CampaignDetailClient + CampaignNewClient + hooks (create, launch, schedule, add-step)
- Routes Next: `/sales/campanas`, `/sales/campanas/[id]`, `/sales/campanas/nuevo`

