## Capabilities cubiertas por este grupo

- `CampaignOrchestrator.launch()` — @idempotent, single-TX, genera SOLO root tasks (step_index==0)
- `run_campaign_execution_task` ARQ worker (dispatch Telegram via CB + idempotency)
- `run_campaign_scheduler_tick` ARQ cron (promote SCHEDULED + claim pending tasks)
- `run_segment_refresh_tick` ARQ cron
- `purge_old_campaigns_audit` ARQ cron (retention 90d, cron 04:30 UTC)
- TelegramChannelRouter pipeline pre-send
- ChannelRouterRegistry singleton thread-safe + startup bootstrap
- Circuit breaker custom asyncio Redis Lua atómico (CLOSED/OPEN/HALF_OPEN)
- AuditLogService PII-sanitized + `campaign_audit` table
- SalesAgentAdapter (PR-7 Sub-D) — bridge CALL_SUBAGENT_BRIEF → OutboundOrchestrator
- Decisión D11/D14/D15/D18/D22 documentadas

