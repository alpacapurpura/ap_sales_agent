## Capabilities cubiertas por este grupo

- Campaign aggregate + 6-state FSM (draft → scheduled → running → paused/completed/failed/cancelled)
- DAG steps (CampaignStep con step_type CALL_SUBAGENT_BRIEF, MESSAGE_SEND, etc)
- 9 endpoints REST `/api/v1/campaigns/` (CRUD + 4 transitions + list paginated)
- Idempotency-key opt-in via header
- Plan enforcement (402 si tenant fuera de plan)
- Soft-delete tenant-scoped
- Audit log via `AuditLogService` best-effort
- 4 arch fitness tests AST-based (response_model, FSM service-layer, pagination, segment SQL)

