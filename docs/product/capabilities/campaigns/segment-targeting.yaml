## Gaps identificados

- Solo segments STATIC tienen worker refresh — no DYNAMIC segments aún (PI-2)
- DSL filter v1 es minimal — no soporta OR compuestos ni negación profunda
- `segment_create` NL via copilot PENDIENTE (PI-2)
- E2E regression `segment-create-and-launch-campaign.spec.ts` existe pero rota frecuentemente (auth flow)
