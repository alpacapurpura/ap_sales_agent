## Capabilities cubiertas por este grupo

- Segment domain + SegmentFilter strict DSL
- 7 endpoints REST `/api/v1/segments/` (CRUD + resolve + snapshot)
- SegmentService.resolve() SQL-filtered
- SegmentService.snapshot() materialización
- SegmentFilterEvaluator (BinaryExpression composer, no cross-module crm)
- Worker `run_segment_refresh_tick` ARQ cron — refresca STATIC segments
- Domain Filter strict mode (extra=forbid bloquea fields mistyped)

