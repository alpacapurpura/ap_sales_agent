## Capabilities cubiertas por este grupo

- `application/orchestrator/chat.py::CopilotOrchestrator` con `stream_chat` (web SSE) + `invoke_text` (Telegram non-streaming)
- `application/orchestrator/deep_agent.py::build_deep_agent_graph` — LangGraph wrapper sobre `deepagents.create_deep_agent`
- `application/router/model_router.py` + classifiers (rule_classifier + llm_classifier) → tier selection
- ModelRole único SSoT (S3 PR-1 PI-2): NANO→NANO, FAST, REASONING, AGENT
- LiteLLM Proxy motor multi-provider centralizado (`shared/infrastructure/llm/providers/litellm.py`)
- Memory: rolling_summarizer + token_counter + context_window_builder (per-channel `for_channel(channel)`)
- Per-tenant prompt caching slot architecture v2 (system_prompt_layout + system_prompt_composer)
- BudgetGuardingChatModel wired single-point en `build_deep_agent_graph(budget_guard, tenant_id)` — Others bucket
- Subagent isolation: stream_provenance_classifier
- output_sanitizer post-stream (prompt injection guard + voseo cleanup según tenant)

