## Gaps identificados

- **Eval suite agentic faltante**: existe `backend/src/modules/copilot/evals/` con classifier+summarizer goldens (5 cat × 8 + 10 adversarial each = 100 ejemplos) pero NO eval runner orchestrator-level (scenarios end-to-end con persona simulated)
- Goldens cubre classifier + summarizer scorers (ROUGE+cosine) — NO cubre tool trajectory ni voice fidelity
- Personas `tenant-novato-tech` + `tenant-experto-saturado` declaradas pero NO consumidas
- No regression suite con conversaciones largas (Lost-in-the-Middle mitigation per-turn anchor declared parcial)
- RAG style anchors per tenant (slot 5) status=placeholder pendiente >=50 mensajes reales aprobados
