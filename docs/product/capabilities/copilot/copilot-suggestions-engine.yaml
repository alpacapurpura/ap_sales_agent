## Capabilities cubiertas por este grupo

- `application/suggestions/engine.py::SuggestionEngine` — orchestrator providers ranked
- `application/suggestions/registry.py` — provider registry (offer/brand/sales_agent/copilot)
- `application/suggestions/providers/{offer,brand,sales_agent,copilot}_provider.py` — heuristic rules per provider
- `api/suggestions.py` — POST /copilot/suggestions retorna `{suggestions, breakdown, latency_ms}` best-effort 200
- POST /copilot/suggestions/accept → emite `SuggestionAccepted` event → subscriber S1 escribe `copilot_trace_event`
- Persistencia via copilot_trace_event (no tabla nueva — Decision 2026-04-29)
- Provider priority: int per provider (tiebreak explicito)
- SalesAgentObservabilityPort cross-module read-only (`shared/links/ports/sales_agent.py`) — solo lectura enrollments + messages, NO toca §3 protected
- BrandDataPort extension additive: `get_buyer_persona_count`, `get_active_personality_profile_present`
- 6 reglas Offer provider: no offers→create chip, high_ticket→pricing, recurring_billing→billing, is_lead_magnet→link core, incomplete promise.headline→variants, lead_magnet sin core→link
- Heuristic <11ms p99 con 4 providers (per CONTRACT D-15)
- LLM ranking = backlog PI-2 S2+ si motor heuristico no alcanza

