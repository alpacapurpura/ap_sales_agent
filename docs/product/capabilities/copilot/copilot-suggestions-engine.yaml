## Gaps identificados

- ML feedback loop = backlog PI-2 S2+ (migrar tabla nueva si volumen lo justifica)
- LLM ranking pendiente eval pre-promote (latencia + costo vs heuristico)
- No e2e regression chips → accept → suggestion_accepted event → trace
- Métricas adopción declaradas (`COUNT(*) FILTER (WHERE event_type='suggestion_accepted') / shown`) pero NO dashboard production
