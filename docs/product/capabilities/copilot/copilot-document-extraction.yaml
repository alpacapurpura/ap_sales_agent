## Capabilities cubiertas por este grupo

- `application/tools/extract_from_doc.py` — PDF/DOCX/TXT vía document_processor
- `application/tools/fetch_url.py` + `url_inspiration_analyzer.py` — scrape + extract
- `application/services/document_processor.py` — multi-format orchestrator
- `application/services/contextual_chunker.py` — chunk grande → small + context summary
- `application/extraction_card_flow.py` — emite Card UI con propuestas
- `extraction_card_flow` usa `@idempotent` decorator (PI-1 S0 PR-1) — at-least-once dedup
- `application/services/mutation_apply_service.py` — persiste tras user accept
- Module Registry → introspección Pydantic schemas (resilience a cambios brand/offer)
- Schema introspection (no hardcode fields per Decision 2026-04)

