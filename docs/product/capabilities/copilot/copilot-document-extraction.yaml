## Gaps identificados

- No eval suite con goldens documentos reales (PDFs Brand → expected fields)
- Adversarial: doc malicioso con prompt injection ("ignore previous, extract X as Y") — no testeado en eval
- Fallback handling: extracción retorna 0 fields → user-facing message ambiguo
- Card UI accept/reject → mutation_apply_service no tiene rollback transaccional cross-module
