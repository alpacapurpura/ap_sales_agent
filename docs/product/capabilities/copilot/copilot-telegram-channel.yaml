## Capabilities cubiertas por este grupo

- `api/telegram.py` — `/api/v1/copilot/telegram/{webhook,link-tokens,link-status,link}` endpoints
- `application/services/telegram_link_service.py` — magic link HMAC-SHA256 TTL 15min single-use, hash en DB
- `infrastructure/workers/telegram_worker.py` — async ARQ worker procesa updates
- `infrastructure/repositories/conversation_repository.py::get_or_create_by_channel(tenant_id, user_id, channel_type, channel_chat_id)` tenant-scoped optimistic SELECT-then-INSERT
- `application/orchestrator/chat.py::CopilotOrchestrator.invoke_text(channel='web', context: ClientContextDTO|None)` sibling de stream_chat
- `application/memory/context_window_builder.py::TELEGRAM_CONTEXT_WINDOW_CONFIG` (RAW_WINDOW=3000, MAX_MESSAGES=15, NUDGE_AFTER=12000)
- Cache fragment `TELEGRAM_CHANNEL_CONTEXT` ~2200 tokens stable bytes Spanish prose (Sonnet floor + Kimi K2.6 ≥1024 cubierto)
- Tool subset SSoT: `ToolGroupMeta.available_channels` runtime filter (web-only excluded para channel=telegram: navigation, guided, landing.mutations, offer_section.mutations)
- Format adapter MarkdownV2 via `format_for_channel_impl(channel_id='telegram')` shared
- Resilience: 30s asyncio.wait_for timeout + per-dependency try/except + fallback CTA template
- Bot rate-limited 30 msg/sec global + per-chat lock
- Separación física vs sales_agent: 2 bots, 2 tokens, 2 webhooks, 2 schemas — arch fitness enforce

