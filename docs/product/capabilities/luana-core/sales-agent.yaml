## D-T3 cardinal (BrandVoicePort hexagonal port)

Sales agent NEVER imports PersonalityCompiler directly. Slot 5 BRAND_VOICE consumes via `voice_port.compile_system_instruction(tenant_id)` + `voice_port.get_voice_metadata(tenant_id)`. PersonalityCompiler SSoT stays in `luana_core_brand_studio.domain.personality` (Story 5 cement). V-AG-3 + V-AG-4 + V-AG-7 triple-cement.

## D-T6 cardinal (anti-mirror observability subclass)

SalesAgentCallbackHandler + SalesAgentObservabilityContext are SUBCLASSES of `luana_core_observability.recording.base_callback_handler.BaseAgentCallbackHandler` + `BaseObservabilityContext`. NEVER mirror shared/agent_observability — INHERIT only. V-AG-6 arch fitness enforces (5 forbidden class declarations + 1 forbidden function = zero declarations in sales_agent src/). Anti-duplication.md cardinal.

## D-T1 sales_agent tool registry frozen at lift moment

`application/tools/registry.py` ToolRegistry public API FROZEN. Story 8 EP-1..EP-5 Extension SDK wraps registry as formal extension points (EP-3 tool + EP-4 workflow + EP-5 specialist) without internals modified.

