# luana-core-extension-sdk

Formal Extension SDK contract surface for Luana platform — 18 extension points + 5 cross-cutting policies enforcing brand isolation while preserving shared SSoT discipline. Cemented Session 4 (2026-05-12) per outcome `luana-platform-migration` Story 8.

## Architecture overview

`ExtensionPointRegistry` class — central registry brand apps consume at FastAPI lifespan startup via explicit `register_all(registry)` pattern (§7.5.2 D2=B). Post-lifespan `registry.lock()` cements immutability (CC-3).

Two-tier EP cement:
- **EP-1..EP-5 critical EXECUTABLE** — full register + dispatch paths. Wrap Stories 6+7 frozen registries byte-stable (D-T1 cardinal).
- **EP-6..EP-18 backlog SIGNATURE-ONLY** — registry receives registrations + dispatch raises `NotImplementedError` graceful. Implementations deferred Stories 11-13 vertical bootstraps.

