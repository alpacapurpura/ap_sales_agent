## Cross-cutting policies (§7.5.1)

| ID | Policy | Enforcement |
|---|---|---|
| CC-1 | Signature pattern per-EP natural (data → DataClass, behavior → Callable) | Architecture |
| CC-2 | Default `mode='append'` + `mode='override'` permitted only on EP-17 + EP-18 | Runtime + arch fitness `test_mode_override_only_EP-17_EP-18_permitted` |
| CC-3 | Startup-only registration | `registry.lock()` raises `RegistrationClosedError` post-lifespan |
| CC-4 | Namespaced obligatorio (`brand_slug.` prefix) + strict raise on duplicate | Runtime `NamespaceViolationError` + `DuplicateRegistrationError` + arch fitness `test_brand_slug_namespace_allowlist.py` |
| CC-5 | Immutable post-startup (no `unregister_*`) | Arch fitness `test_no_unregister_api.py` AttributeError on attempt |

## BrandContext frozen dataclass (9 fields, §7.5.2 D3)

```python
@dataclass(frozen=True)
class BrandContext:
    tenant_id: str
    brand_slug: str
    plan_tier: str
    locale: str
    feature_flags: dict[str, Any]   # opaque dict — brand apps inject at request boundary
    tenant_profile_id: str
    vertical_kind: str
    compliance_flags: dict[str, Any]
    pii_policy: str
```

Future-proof: optional fields can be added without breaking handlers (backward compat). Removing/changing semantic = breaking → SDK semver bump major (post Story 9 publish enforced).

## Architecture cement

- **D-T1 frozen contracts:** EP-3/EP-4 wrappers via `_adapters.py` READ-ONLY delegation. Stories 6+7 registries byte-stable preserved (golden snapshot tests Story 6 V-AG-3 + Story 7 ToolRegistry GREEN post-Story-8).
- **§7.5.4 NO EP-19:** Vertical agents are brand APPs consuming luana-core piecewise, NOT core extension points. Arch fitness `test_no_ep19_method_in_registry.py` enforces. `docs/extension-points.md §4` documents Vitalia treatment-agent worked recipe.
- **§7.5.6 Cross-brand learning principle:** Features graduate to core via /pm promotion path (never cross-namespace consumption).

