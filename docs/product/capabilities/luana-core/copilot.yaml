# luana-core-copilot

Copilot agentic engine lifted verbatim from AISALESHT `backend/src/modules/copilot/` (33k LOC) to `luana-platform/core/luana-core-copilot/` per outcome `luana-platform-migration` Story 6.

## Surface

- **Domain layer:** module_registry (lazy-load per brand), ports (cross-module contracts), workflow + extractor + rule + skill + hook registries (5 frozen public APIs per D-T1), message/event/voice/suggestion/plan domain types, mutation_journal, schema_introspection, field_paths_hint, navigation_map, card_payloads, routing_policy
- **Infrastructure:** SQLA models (conversation + inspiration + mutation_journal + pinned_memory + routing_log + event + tenant_limits + workflow_metric + 4 more), repositories, persisters (brand + buyer_persona + offer + registry), channels (Telegram bot + in_memory), voice (Whisper transcriber), Qdrant (marketing_kb_store tenant-agnostic), cache (data_query_cache), prompts (base + sanitizer + templates Jinja2 + brand_extraction prompts), web (Trafilatura + Tavily search), workers (Telegram worker arq), in_memory_{hook,rule,skill}_registry
- **Application orchestrator:** LangGraph 2.0 StateGraph + deepagents harness + 11-slot prompt cache composer (TTL 1h slots 1-3, 5min slots 4-6, per-tenant cache prefix) + 3 subagents (data_query + url_analyzer + audit_inspector) + state + chat + conversational_questioning + inspirations_layer + block_adapters + stream_filters + stream_provenance + output_sanitizer + tool_call_dedup + context_budget + subagent_budget
- **Application tools:** ToolRegistry SSoT + 24 tools + ask_tenant_data/ (7 files) + guided/ (4 files) + shared_tools/ (2 files)
- **Application subfolders:** router (model_router + classifiers/), suggestions (engine + registry + providers/), workflows (engine + registry), procedures (brand_setup + offer_creation + first_setup), data_access, extraction, guided, memory, observability (judge + rag_goldens)
- **Application services:** brand_ai_actions, offer_psychology, mutation_apply, telegram_link, document_processor, contextual_chunker, limits_resolver, event_cleanup, offer_suggestion_reader + handlers/ + discovery + extraction_card_flow
- **Observability subfolder (D-T6 subclass pattern):** CopilotCallbackHandler(BaseAgentCallbackHandler) + CopilotObservabilityContext(BaseObservabilityContext) + module-scoped LLMCallRepository + TraceEventRepository + DomainSubscribers (inherit from luana_core_observability — NEVER mirror)
- **API:** 11 routers (chat + conversations + voice + telegram + plan + suggestions + actions + events + media + knowledge + nudge) + 11 DTOs + _dependencies.py
- **Evals:** golden_dataset + 4 scorers (base + classifier + summarizer + runner) — 20 goldens lifted with copilot
- **Utils:** module-internal helpers

## Frozen public API (D-T1)

ToolRegistry + WorkflowRegistry + ExtractorRegistry + ModuleRegistry + SuggestionRegistry public method signatures + dataclass fields FROZEN at lift moment. Golden snapshot `core/tests/architecture/_snapshots/copilot_registry_v1.json` (write-once script). V-AG-3 enforces byte-stable diff. Story 8 EP-1..EP-5 wraps externally — no internals modified.

## Anti-mirror cardinal (D-T6)

CopilotCallbackHandler + CopilotObservabilityContext are SUBCLASSES of `luana_core_observability.recording.base_callback_handler.BaseAgentCallbackHandler` + `BaseObservabilityContext`. NEVER mirror shared/agent_observability — INHERIT only. V-AG-5 arch fitness enforces (5 forbidden class declarations + 1 forbidden function = zero declarations in copilot src/). Anti-duplication.md cardinal.

