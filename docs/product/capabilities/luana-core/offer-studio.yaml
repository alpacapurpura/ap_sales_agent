# luana-core-offer-studio

Offer domain engine lifted verbatim from AISALESHT `backend/src/modules/offer/` to `luana-platform/core/luana-core-offer-studio/` per outcome `luana-platform-migration` Story 5.

## Surface

- **Domain layer (7 catalogs DAG):** ExpertBusinessType + OfferValueLevel + SectionCatalog + VariantStructure (base layer) → OfferArchetype (intermediate) → OfferFormat + OfferLadderHints + OfferTypePreset (composites). 21 sections + 84 presets + 25 formats + 5 archetypes + 5 value levels + 8 variants + 45 ladder hints.
- **Application services:** offer_data_adapter, offer_extraction_orchestrator (wave-based), launch_edition_service, form_runtime_engine, condition_evaluator (conditional questions/flags resolution)
- **Infrastructure:** SQLA models (Offer + Edition + Asset + Variant + Section), repositories
- **API:** REST routers (offers, editions, launches, extraction, sections)
- **Workers:** Celery tasks for extraction wave execution

## Catalog versioning

`_CATALOG_VERSION` constants preserved verbatim per layer. Future catalog edits requiere version bump + arch fitness re-validation (V-F-cat-1).

## Test coverage

- 628 tests GREEN per `cd /home/chris/luana-platform && uv run pytest core/luana-core-offer-studio/tests/`
