# luana-core-brand-studio

Brand domain engine lifted verbatim from AISALESHT `backend/src/modules/brand/` to `luana-platform/core/luana-core-brand-studio/` per outcome `luana-platform-migration` Story 5.

## Surface

- **Domain layer:** Identity, Personality (3-pilar PersonalityProfile + StoryBrand narrative + brand_personality Jung archetype), BuyerPersona (multi-persona + field_contract), Positioning (UVP + competitor matrix), Story (origin + mission + vision), Strategy (objectives + go-to-market), Team (instructors + methodology), Communication Assets, Authority Vault (credentials + testimonials)
- **Application services:** brand_data_adapter, brand_field_apply_adapter, personality_service (compile system_instruction), extraction_orchestrator (wave-based LLM extraction), extraction_service, voice_fidelity grader, style_analyzer agent
- **Infrastructure:** SQLA models (Identity, Personality, BuyerPersona, Avatar, ExtractionTrace, Summary), repositories
- **API:** REST routers (avatars, buyer_personas, extraction, personality, sections, style)
- **Workers:** Celery tasks for extraction wave execution

## Voice compiler v2 SSoT (ADR-001 §2.4)

`class PersonalityCompiler` vive en `luana_core_brand_studio.domain.personality.PersonalityCompiler`. Único compiler — cemented por arch fitness V-AG-3 (voice-compiler-SSoT placement test).

Story 7 (luana-sales-agent-engine) consumirá vía `BrandVoicePort.compileSystemInstruction(tenant_id) → str` (port introducido Story 7, no Story 5).

Voice cloning pipeline NO existe yet — deferred Stories 11-13 (brand bootstraps).

