## Capabilities cubiertas por este grupo

- Listado paginado de contactos con 18 filtros canonical forward-compat (subset expuesto en UI lite)
- Detalle unificado Profile+Lead vía `GET /api/v1/contacts/{id}`
- UI lite `/sales/contactos` (DataTable shared + ContactsPageClient + drawer detail responsive)
- Crear segmento STATIC desde contactos seleccionados (REUSE `SegmentModel.filter_dsl` JSONB sin migration)
- Cross-module read CampaignsLookupPort (`has_campaign_engagement` filter, ventana 90d)
- Identidad multi-canal (3-tabla pattern: contacts + identities + events) — soft delete + tenant aislado UUID

