## Gaps identificados

- No hay UI dedicada de pipeline (kanban view) — solo vía API
- Lifecycle scoring sin transparencia para user (no se ve el "porqué" del score)
- No hay regression e2e de pipeline override (solo unit + integration)
- Sin tool copilot para mover stage conversacionalmente
