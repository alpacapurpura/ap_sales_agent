## Capabilities cubiertas por este grupo

- Pipeline service expone vista por etapas (`GET /api/v1/crm/pipeline`)
- Override manual de stage por profile_id (`PUT /api/v1/crm/pipeline/{profile_id}/stage`)
- Journey events log (touch points lifecycle multi-canal)
- Lifecycle scoring engine (auto-recalcula score por touch point)
- Histórico de transiciones (`GET .../transitions`)

