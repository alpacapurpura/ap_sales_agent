## Capabilities cubiertas por este grupo

- GET público de landing por slug+tenant (no auth)
- Tokenizer para reemplazar variables ({{offer.name}}, {{tenant.name}}, etc.)
- Captura de lead vía formulario CTA → crm
- Tracking de visitas (analytics integration)

