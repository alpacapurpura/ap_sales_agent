## Capabilities cubiertas por este grupo

- Botón publish/unpublish con confirmación
- Slug editable con validación de unicidad por tenant
- Integración con tenant_domains (custom hostname Cloudflare)
- Preview antes de publicar
- Estado published/draft persistido

