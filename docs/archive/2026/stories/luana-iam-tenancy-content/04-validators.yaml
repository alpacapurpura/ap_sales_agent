    name: "Each Story 3 package has README.md stub"
    description: "Per 05-guidelines.md §scope. Stub explains: package name, lift origin path (AISALESHT), key exports."
    command: |
      cd ~/luana-platform
      MISSING=0
      for pkg in luana-core-iam luana-core-tenant-profile luana-core-tenant-domains luana-core-commercial-calendar luana-core-social-proof luana-core-assets; do
        if [ ! -f "core/${pkg}/README.md" ]; then echo "MISSING: core/${pkg}/README.md"; MISSING=$((MISSING+1)); fi
      done
      test $MISSING -eq 0
    must_pass: true
    addressed_by_tickets: [T-11]

  - id: V-D-2
    name: "core/DEFERRED-FILES.md updated with Story 3 entries"
    description: "Per 03-arch.md §9 — audit trail of 2 deferred copilot_provider/ subfolders. File created Story 2; appended in Story 3."
