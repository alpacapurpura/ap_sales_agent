# 04-validators.yaml — luana-iam-tenancy-content
#
# Schema v4: 5 categories (non_functional / functional / visual / agentic_eval / documentation).
# Each validator MUST be shell-executable. must_pass flag indicates blocking vs informational.
#
# Order of execution (mirrors §2 lift order in 03-arch.md):
#   1. Workspace registration (V-NF-1..3)
#   2. Per-package smoke (V-F-py-1..6)
#   3. Cross-package integration (V-F-x-1..2)
#   4. AISALESHT untouched (V-NF-4)
#   5. No-publish (V-NF-5..7)
#   6. Brand-agnostic IAM arch fitness (V-AG-1..2)
#   7. Documentation (V-D-1..2)

non_functional:
  - id: V-NF-1
    name: "uv sync --all-packages succeeds (Python workspace, 15 packages)"
    description: "Root pyproject.toml lists all 9 Story 2 + 6 Story 3 packages as workspace members. uv resolves all sources."
    command: |
      cd ~/luana-platform && uv sync --all-packages 2>&1 | tail -20
      test ${PIPESTATUS[0]} -eq 0
    must_pass: true
    addressed_by_tickets: [T-1, T-7]

  - id: V-NF-2
    name: "Each Story 3 Python package has pyproject.toml at version 0.0.1-alpha"
    description: "Per spec §3.1 — 6 packages × pyproject.toml at correct version."
    command: |
      cd ~/luana-platform
      MISSING=0
      for pkg in luana-core-iam luana-core-tenant-profile luana-core-tenant-domains luana-core-commercial-calendar luana-core-social-proof luana-core-assets; do
        if [ ! -f "core/${pkg}/pyproject.toml" ]; then echo "MISSING: core/${pkg}/pyproject.toml"; MISSING=$((MISSING+1)); fi
        if ! grep -q 'version = "0.0.1-alpha"' "core/${pkg}/pyproject.toml" 2>/dev/null; then echo "WRONG VERSION: core/${pkg}"; MISSING=$((MISSING+1)); fi
      done
      test $MISSING -eq 0
    must_pass: true
    addressed_by_tickets: [T-2, T-3, T-4, T-5, T-6]

  - id: V-NF-3
    name: "Workspace declares Story 3 packages in [tool.uv.sources]"
    description: "All 6 Story 3 packages registered as workspace sources for cross-package import resolution."
    command: |
      cd ~/luana-platform
      MISSING=0
      for pkg in luana-core-iam luana-core-tenant-profile luana-core-tenant-domains luana-core-commercial-calendar luana-core-social-proof luana-core-assets; do
        if ! grep -q "^${pkg} = { workspace = true }" pyproject.toml; then echo "NOT IN [tool.uv.sources]: ${pkg}"; MISSING=$((MISSING+1)); fi
      done
      test $MISSING -eq 0
    must_pass: true
    addressed_by_tickets: [T-1]

  - id: V-NF-4
    name: "AISALESHT not modified in Story 3 commits"
    description: "Per 01-spec.md §3.5. NO file under backend/src/modules/{iam,tenant_profile,tenant_domains,commercial_calendar,social_proof,assets}/ OR backend/tests/modules/{same set}/ modified during Story 3."
    command: |
      cd /home/chris/AISALESHT
      # BASE_SHA captured at story start in checkpoint.md (auditor pre-flight per Story 2 pattern)
      BASE_SHA=$(grep -oP 'base_sha:\s*\K[a-f0-9]+' docs/product/stories/luana-iam-tenancy-content/checkpoint.md 2>/dev/null || git rev-parse HEAD)
      DIFF=$(git diff "$BASE_SHA" HEAD --name-only 2>/dev/null | grep -E '^(backend/src/modules/(iam|tenant_profile|tenant_domains|commercial_calendar|social_proof|assets)|backend/tests/modules/(iam|tenant_profile|tenant_domains|commercial_calendar|social_proof|assets))/' || true)
      if [ -n "$DIFF" ]; then
        echo "AISALESHT FILES MODIFIED (forbidden Story 3 surfaces):"
        echo "$DIFF"
        exit 1
      fi
      echo "OK: AISALESHT untouched"
    must_pass: true
    addressed_by_tickets: [T-10]

  - id: V-NF-5
    name: "No publishConfig in any Story 3 package"
    description: "Per 01-spec.md §3.6 — no GH Packages publishing in Story 3 (Story 9 territory)."
    command: |
      cd ~/luana-platform
      OFFENDERS=$(grep -l 'publishConfig\|\[project\.urls\].*registry' core/luana-core-iam/pyproject.toml core/luana-core-tenant-profile/pyproject.toml core/luana-core-tenant-domains/pyproject.toml core/luana-core-commercial-calendar/pyproject.toml core/luana-core-social-proof/pyproject.toml core/luana-core-assets/pyproject.toml 2>/dev/null || true)
      if [ -n "$OFFENDERS" ]; then echo "Found publish config in: $OFFENDERS"; exit 1; fi
      echo "OK: no publish config"
    must_pass: true
    addressed_by_tickets: [T-10]

  - id: V-NF-6
    name: "No .releaserc.json files introduced by Story 3"
    description: "Per 01-spec.md §3.6 — no semantic-release config additions."
    command: |
      cd ~/luana-platform
      FOUND=$(find . -name '.releaserc*' -not -path './node_modules/*' 2>/dev/null || true)
      if [ -n "$FOUND" ]; then echo "Found release configs: $FOUND"; exit 1; fi
      echo "OK"
    must_pass: true
    addressed_by_tickets: [T-10]

  - id: V-NF-7
    name: "No release.yml or publish workflow added"
    description: "Per 01-spec.md §3.6."
    command: |
      cd ~/luana-platform
      FOUND=$(find .github/workflows -name 'release*' -o -name 'publish*' 2>/dev/null || true)
      if [ -n "$FOUND" ]; then echo "Found release/publish workflows: $FOUND"; exit 1; fi
      echo "OK"
    must_pass: true
    addressed_by_tickets: [T-10]

  - id: V-NF-8
    name: "uv run ruff check Story 3 packages GREEN"
    description: "Per 01-spec.md §3.4 — ruff baseline passes on lifted code (lift mode preserves lint state from AISALESHT)."
    command: |
      cd ~/luana-platform && uv run ruff check core/luana-core-iam core/luana-core-tenant-profile core/luana-core-tenant-domains core/luana-core-commercial-calendar core/luana-core-social-proof core/luana-core-assets 2>&1 | tail -20
      test ${PIPESTATUS[0]} -eq 0
    must_pass: true
    addressed_by_tickets: [T-9]

