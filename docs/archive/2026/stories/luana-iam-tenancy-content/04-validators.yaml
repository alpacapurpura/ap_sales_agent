  # Cross-package integration smoke
  - id: V-F-x-1
    name: "Cross-package Python import works (Story 3 packages consume platform + iam)"
    description: "Per 01-spec.md scenario B — luana_core_X.* imports from luana_core_platform.* AND luana_core_iam.* work."
    command: |
      cd ~/luana-platform && uv run python -c "
      # Story 3 → Story 2 edges
      from luana_core_iam.domain.user import User
      from luana_core_iam.domain.tenant import Tenant
      from luana_core_iam.api.dependencies import get_current_user
      from luana_core_tenant_profile.domain.tenant_profile import TenantProfile
      from luana_core_tenant_domains.domain.domain_entity import TenantDomain
      from luana_core_commercial_calendar.domain.calendar_event import CalendarEvent
      from luana_core_social_proof.domain.testimonial import Testimonial
      from luana_core_assets.domain.entity import Asset
      # Story 3 → Story 2 platform edges
      from luana_core_platform.domain.base_entity import Base
      from luana_core_platform.infrastructure.external.clerk import ClerkService
      print('all Story 3 cross-package imports OK')
      "
    must_pass: true
    addressed_by_tickets: [T-7]

  - id: V-F-x-2
    name: "uv run pytest entire luana-platform (Story 2 + Story 3) GREEN"
    description: "Aggregate test runs all 9 Story 2 + 6 Story 3 package suites + arch fitness in one command. Confirms no regressions in Story 2 packages from new Story 3 workspace deps."
    command: |
      cd ~/luana-platform && uv run pytest core/ -x -q --tb=short --ignore=core/src 2>&1 | tail -30
      test ${PIPESTATUS[0]} -eq 0
    must_pass: true
    addressed_by_tickets: [T-7, T-8]

visual: []  # No UI changes in Story 3.

agentic_eval:
  - id: V-AG-1
    name: "Architecture fitness — luana-core-iam is brand-agnostic"
    description: "Per 01-spec.md §2.5 + §3.3. NO `if brand == \"...\"` or hardcoded Clerk app IDs in iam source. ClerkService instantiation reads config from settings/env only."
    command: |
      cd ~/luana-platform && uv run pytest core/tests/architecture/test_iam_brand_agnostic.py -x -q 2>&1 | tail -20
      test ${PIPESTATUS[0]} -eq 0
    must_pass: true
    addressed_by_tickets: [T-8]

  - id: V-AG-2
    name: "Architecture fitness — Story 3 packages have no forward module imports"
    description: "Per 03-arch.md §7.2. NO Story 3 package imports from luana_core_{crm,analytics,advertising,social_media,landing,connections,brand,offer,copilot,sales_agent,campaigns,scheduling} OR from src.modules.*. Forward-coupling would break the migration sequence."
    command: |
      cd ~/luana-platform && uv run pytest core/tests/architecture/test_story3_no_forward_module_imports.py -x -q 2>&1 | tail -20
      test ${PIPESTATUS[0]} -eq 0
    must_pass: true
    addressed_by_tickets: [T-8]

