      - "core/luana-core-platform/src/luana_core_platform/infrastructure/{files,prompts,database,external,web,models,__init__}/"
      - "core/luana-core-platform/src/luana_core_platform/workers/brand_summary_regen.py"
      - "core/luana-core-platform/src/luana_core_platform/api/currencies.py"
      - "core/luana-core-platform/src/luana_core_platform/application/{ai_action_service,brand_summary_event_handlers,field_diff,progress_emitter,__init__}.py"
      - "core/luana-core-platform/tests/__init__.py"
      - "core/luana-core-platform/tests/{test_currencies_api,test_currency,test_currency_catalog,test_datetime_utils,test_event_bus,test_expert_business_type,test_field_contract_platform,test_legacy_event_bus_deprecation_warning,test_locale,test_prompt_loader_resilience,test_web_crawler,test_ai_action_extract_json,test_ai_action_service}.py"
      - "core/luana-core-platform/tests/application/{test_brand_summary_event_handlers,test_field_diff,test_progress_emitter}.py"
      - "core/luana-core-platform/tests/workers/test_brand_summary_regen.py"
      - "core/luana-core-platform/tests/infrastructure/llm/ (if any LLM tests target platform — verify)"
    description: |
      LIFT VERBATIM (per 05-guidelines.md §1.1):
      1. Copy backend/src/core/ → core/luana-core-platform/src/luana_core_platform/core/
      2. Copy backend/src/shared/domain/ → .../luana_core_platform/domain/
      3. Copy backend/src/shared/links/ → .../luana_core_platform/links/
      4. Copy backend/src/shared/infrastructure/{files,prompts,database,external,web,models}/ → .../luana_core_platform/infrastructure/<sub>/
      5. Copy backend/src/shared/workers/brand_summary_regen.py → .../luana_core_platform/workers/ (NOT the eval workers — deferred)
      6. Copy backend/src/shared/api/ → .../luana_core_platform/api/
      7. Copy backend/src/shared/application/{ai_action_service,brand_summary_event_handlers,field_diff,progress_emitter}.py → .../luana_core_platform/application/
         (NOT personality_event_handlers — deferred per §3.3)
      8. Copy tests verbatim per 03-arch.md §6.1 mapping.
      9. Apply sed import path rewrites per 05-guidelines.md §1.3:
         - from src.core. → from luana_core_platform.core.
         - from src.shared.domain. → from luana_core_platform.domain.
         - from src.shared.links. → from luana_core_platform.links.
         - from src.shared.infrastructure.{files,prompts,...} → from luana_core_platform.infrastructure.{files,prompts,...}
         - from src.shared.workers. → from luana_core_platform.workers.
         - from src.shared.api. → from luana_core_platform.api.
         - from src.shared.application.{ai_action_service,...} → from luana_core_platform.application.{ai_action_service,...}
         - from src.shared.infrastructure.llm. → from luana_core_llm.  (CYCLIC — files/image_analysis + ai_action_service consume LLM)
      10. Write pyproject.toml per 03-arch.md §8.1 template (declares luana-core-llm cyclic dep via [tool.uv.sources]).
      11. Write README.md stub.
      12. Run `cd ~/luana-platform && uv sync --all-packages` (will fail because luana-core-llm not lifted yet — expected; T-13 retries).
      13. Run `cd ~/luana-platform && uv run pytest core/luana-core-platform/tests/ -x -q` — most tests will fail on llm imports until T-3 lifts llm; defer GREEN to T-13.
      14. Commit per 05-guidelines.md §7.

      DEVIATION NOTE: src/core/ lift NOT in spec §2.2 but required per 03-arch.md §9.
      Document in commit body.

