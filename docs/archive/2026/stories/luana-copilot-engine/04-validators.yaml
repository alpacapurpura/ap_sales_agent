    name: "Cross-package Python smoke (Story 6 package consumes Stories 2-5 + observability)"
    description: "Per 03-arch.md §1.3 — luana_core_copilot.* imports resolve."
    command: |
      cd ~/luana-platform && uv run python -c "
      # Story 6 domain core
      from luana_core_copilot.domain.module_registry import ModuleRegistry, ModuleDescriptor
      from luana_core_copilot.domain.ports import BaseCopilotProvider
      from luana_core_copilot.domain.workflow import Workflow, WorkflowEngine
      from luana_core_copilot.domain.extraction_domain_registry import ExtractorRegistry
      # Application registries (D-T1 FROZEN)
      from luana_core_copilot.application.tools.registry import ToolRegistry
      from luana_core_copilot.application.workflows.registry import WorkflowRegistry
      from luana_core_copilot.application.suggestions.registry import SuggestionRegistry
      # Orchestrator
      from luana_core_copilot.application.orchestrator.graph import build_deep_agent_graph
      from luana_core_copilot.application.orchestrator.system_prompt_composer import compose_system_prompt
      # Observability subclasses (D-T6 anti-mirror)
      from luana_core_copilot.observability.recording.callback_handler import CopilotCallbackHandler
      from luana_core_copilot.observability.recording.turn_envelope import CopilotObservabilityContext
      # Verify subclass relationship
      from luana_core_observability.recording.base_callback_handler import BaseAgentCallbackHandler
      from luana_core_observability.recording.turn_envelope import BaseObservabilityContext
      assert issubclass(CopilotCallbackHandler, BaseAgentCallbackHandler), 'CopilotCallbackHandler must subclass BaseAgentCallbackHandler (D-T6)'
      assert issubclass(CopilotObservabilityContext, BaseObservabilityContext), 'CopilotObservabilityContext must subclass BaseObservabilityContext (D-T6)'
      # Cross-package edges
      from luana_core_brand_studio.domain.aggregates import BrandSettings
      from luana_core_offer_studio.domain.offer import Offer
      from luana_core_iam.api.dependencies import get_current_user
      from luana_core_platform.domain.ports import BrandReadPort, OfferReadPort
      print('Story 6 cross-package imports + D-T6 subclass relationships OK')
      "
    must_pass: true
    addressed_by_tickets: [T-18]

