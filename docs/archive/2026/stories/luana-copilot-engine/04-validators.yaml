# 04-validators.yaml — luana-copilot-engine
#
# Schema v4: 5 categories (non_functional / functional / visual / agentic_eval / documentation).
# Each must be shell-executable. must_pass:true blocks merge.
# Order of execution mirrors §2 lift order in 03-arch.md (workspace → skeleton → domain → infra → app → api → unlift → cleanup → integration → arch fitness → finalization).

non_functional:
  - id: V-NF-1
    name: "uv sync --all-packages succeeds (22 packages: Stories 2+3+4+5+6)"
    description: "Root pyproject.toml lists all packages including new luana-core-copilot. uv resolves all sources."
    command: |
      cd ~/luana-platform && uv sync --all-packages 2>&1 | tail -20
      test ${PIPESTATUS[0]} -eq 0
    must_pass: true
    addressed_by_tickets: [T-1, T-18]

  - id: V-NF-2
    name: "luana-core-copilot pyproject.toml at version 0.0.6-alpha"
    description: "Per 03-arch.md §3.2 — package versioned correctly."
    command: |
      cd ~/luana-platform
      test -f core/luana-core-copilot/pyproject.toml || { echo "MISSING pyproject"; exit 1; }
      grep -q 'version = "0.0.6-alpha"' core/luana-core-copilot/pyproject.toml || { echo "WRONG VERSION"; exit 1; }
      echo "OK"
    must_pass: true
    addressed_by_tickets: [T-2]

  - id: V-NF-3
    name: "Workspace declares luana-core-copilot in [tool.uv.sources]"
    command: |
      cd ~/luana-platform
      grep -q '^luana-core-copilot = { workspace = true }' pyproject.toml || { echo "NOT IN sources"; exit 1; }
      grep -q '"core/luana-core-copilot"' pyproject.toml || { echo "NOT IN members"; exit 1; }
      echo "OK"
    must_pass: true
    addressed_by_tickets: [T-1]

  - id: V-NF-4
    name: "AISALESHT not modified in Story 6 commits"
    description: "Per outcome §7.3 lift mode. NO file under backend/src/modules/copilot/ OR backend/tests/modules/copilot/ modified during Story 6."
    command: |
      cd /home/chris/AISALESHT
      BASE_SHA=$(grep -oP 'base_sha:\s*\K[a-f0-9]+' docs/product/stories/luana-copilot-engine/checkpoint.md 2>/dev/null || git rev-parse HEAD)
      DIFF=$(git diff "$BASE_SHA" HEAD --name-only 2>/dev/null | grep -E '^(backend/src/modules/copilot|backend/tests/modules/copilot)/' || true)
      if [ -n "$DIFF" ]; then echo "AISALESHT FILES MODIFIED:"; echo "$DIFF"; exit 1; fi
      echo "OK: AISALESHT untouched"
    must_pass: true
    addressed_by_tickets: [T-21]

  - id: V-NF-5
    name: "No publishConfig in Story 6 package"
    description: "Per outcome §7.1 GH Packages deferred until Story 9."
    command: |
      cd ~/luana-platform
      OFFENDERS=$(grep -l 'publishConfig\|\[project\.urls\].*registry' core/luana-core-copilot/pyproject.toml 2>/dev/null || true)
      if [ -n "$OFFENDERS" ]; then echo "Found publish config: $OFFENDERS"; exit 1; fi
      echo "OK"
    must_pass: true
    addressed_by_tickets: [T-21]

  - id: V-NF-6
    name: "No .releaserc or release.yml workflow added"
    command: |
      cd ~/luana-platform
      FOUND_R=$(find . -name '.releaserc*' -not -path './node_modules/*' 2>/dev/null || true)
      FOUND_W=$(find .github/workflows -maxdepth 2 -type f \( -name 'release*' -o -name 'publish*' \) 2>/dev/null || true)
      if [ -n "$FOUND_R" ] || [ -n "$FOUND_W" ]; then echo "Found: $FOUND_R $FOUND_W"; exit 1; fi
      echo "OK"
    must_pass: true
    addressed_by_tickets: [T-21]

