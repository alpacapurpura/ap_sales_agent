# ═══════════════════════════════════════════════════════════════════════
# Iteration policy — autonomous build behavior
# ═══════════════════════════════════════════════════════════════════════

iteration:
  max_iterations: 3                   # agentic story 3-4d, 3 cycles bastan
  on_fail: |
    1) Read failing validator output
    2) Identify exact file/line target (no shotgun edits)
    3) Apply minimal fix preserving spec intent + arch decisions D1-D17 + D-AG-* + D-BE-*
    4) Re-run failing validator only (not full suite)
    5) If pass → continue to next pending validator
    6) If iteration cap reached on agentic complexity ticket → escalate to Chris (do NOT shortcut)
  on_all_pass: |
    set state=developing→developed
    append iteration_log to T-{n}-impl-log.md
    transition checkpoint phase=BUILD_GREEN
    commit + push (parallel-safety: stage by name, no force, no pull, no revert)
  on_cap_reached: |
    set state=developing→blocked
    write blocker analysis to checkpoint.md (root cause + last error trace + diagnosis hypothesis)
    escalate to Chris

