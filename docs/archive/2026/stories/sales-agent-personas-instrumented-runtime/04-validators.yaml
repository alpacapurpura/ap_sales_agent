  - id: agentic_cost_budget_story_c_baseline
    category: agentic_eval
    type: shell
    cmd: |
      cd backend && .venv/bin/python -c "
      from sqlalchemy import create_engine, select, func
      from sqlalchemy.orm import Session
      from src.core.config import settings
      from src.modules.sales_agent.observability.eval_simulator.persistence.models.eval_simulator_llm_call import EvalSimulatorLlmCallModel
      engine = create_engine(settings.database_url)
      with Session(engine) as db:
          per_sim = db.execute(
              select(EvalSimulatorLlmCallModel.eval_metadata['simulation_id'].astext.label('sim_id'),
                     func.sum(EvalSimulatorLlmCallModel.cost_usd).label('total'))
              .group_by(EvalSimulatorLlmCallModel.eval_metadata['simulation_id'].astext)
          ).all()
          assert all(row.total < 0.10 for row in per_sim), f'Individual cost cap violated (Story C nurture allowance up to \$0.10): {per_sim}'
          suite_total = sum(row.total for row in per_sim)
          assert suite_total < 3.00, f'Suite total cost cap violated Story C: \${suite_total} (baseline \$2.20, ceiling \$3.00)'
          print(f'PASS — {len(per_sim)} simulations, max indiv \${max(r.total for r in per_sim):.4f}, suite total \${suite_total:.4f}')
      "
    must_pass: true
    timeout_sec: 60
    description: "D9 cost cap Story C — individual <\$0.10 (nurture max_turns=15 allowance), suite total <\$3.00. Baseline ~\$2.20 from delta-spec.md."

  - id: agentic_cost_bucket_zero_contamination
    category: agentic_eval
    type: shell
    cmd: |
      cd backend && .venv/bin/python -c "
      from sqlalchemy import create_engine, select, func
      from sqlalchemy.orm import Session
      from src.core.config import settings
      # Verify Story C runs created NO rows in copilot_llm_call
      from src.modules.copilot.observability.persistence.models.copilot_llm_call import CopilotLlmCallModel
      engine = create_engine(settings.database_url)
      with Session(engine) as db:
          # filter sales_agent eval_kind tagged rows in copilot table
          contamination_count = db.scalar(
              select(func.count()).select_from(CopilotLlmCallModel)
              .where(CopilotLlmCallModel.created_at >= 'now()::timestamp - interval \\'1 hour\\'')
          )
          assert contamination_count == 0 or contamination_count is None, f'Cost bucket contamination: {contamination_count} rows in copilot_llm_call from Story C run'
          print('PASS — zero contamination prod copilot bucket')
      "
    must_pass: true
