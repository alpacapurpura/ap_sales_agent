# ════════════════════════════════════════════════════════════════
# Iteration policy — autonomous build behavior
# ════════════════════════════════════════════════════════════════

iteration:
  max_iterations: 10
  on_fail: "fix targeted file based on test output, re-run failing validator only"
  on_all_pass: "set state=developing→developed, append iteration_log to T-{n}-impl-log.md"
  on_cap_reached: "set state=developing→blocked, escalate to Chris with last error trace"

# ════════════════════════════════════════════════════════════════
# Halt triggers (per spec § 16 Q-set + Story 10/11 H1-H13 adapted)
# ════════════════════════════════════════════════════════════════

halt_triggers:
  H1: "cost variance >100% vs budget (V-AE-18/19/20/21 fail)"
  H2: "validators blocked >cap iter (max_iterations=10)"
  H3: "arch fitness violation introduced (V-NF-5/6 fail)"
  H4: "spec drift detected (impl != spec ratified)"
  H5: "tenant isolation regression (V-F-11/V-AE-5 fail)"
  H6: "PII leak detected (V-AE-2/V-AE-28 fail)"
  H7: "Spanish neutro violation chrome UI user-facing (V-NF-6 fail)"
  H8: "alembic consolidation conflict (V-NF-9/10 fail)"
  H9: "cross-module import boundary violation"
  H10: "anti-duplication detection (shared abstraction needed)"
  H11: "anti-default-flip-audit violation (dormant Story 12 — no flag flips planned)"
  H12: "hotfix repro_verified false (N/A Story 12 — greenfield)"
  H13: "builder spawn refusal (Sonnet picked Opus-only ticket per R23)"
