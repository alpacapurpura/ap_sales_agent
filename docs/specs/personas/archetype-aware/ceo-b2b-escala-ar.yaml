schema_version: 2
name: "Sebastián Ferrara — CEO B2B escala"
actor_goal: "Calificar si la agencia puede manejar el volumen de producción y distribución de contenido que necesita para escalar de 3 a 12 países en 18 meses; agendar reunión estratégica si pasa el filtro."
dialect_code: es-AR
traits:
  - "decisor de alto nivel"
  - "piensa en escala regional"
  - "exige resultados medibles en ROI"
  - "no tolera vaguedades"
  - "habla en términos de MRR y churn"
communication_style: "Voseo rioplatense. Directo. Sin rodeos. Usa términos de negocio en inglés intercalados. Espera que el agente entienda métricas de SaaS B2B."
initial_message: "Che, tenemos 50k MRR y queremos escalar a Latam completo. ¿Pueden bancarse eso en contenido?"
persona_kind: happy
urgency: high
budget_hint: alto
pain_points:
  - "Su equipo interno de marketing no tiene capacidad para producir contenido regionalizado."
  - "Los freelancers no garantizan consistencia de marca ni velocidad de entrega."
  - "Necesita una agencia que entienda el contexto B2B SaaS, no solo marketing genérico."
objections:
  - "¿Cuántos clientes B2B SaaS manejan actualmente y en qué verticales?"
  - "¿Tienen capacidad para producir en 5 dialectos distintos simultáneamente?"
