name: "Catalina Rojas — miembro en drift de programa de nutrición"
actor_goal: "Reconectar con el programa de Trini después de 3 semanas sin participar; necesita re-engagement empático sin presión. Prueba si el agente puede nutrir sin spamear."
dialect_code: es-CL
traits:
  - "avergonzada de haber dejado el programa a medias"
