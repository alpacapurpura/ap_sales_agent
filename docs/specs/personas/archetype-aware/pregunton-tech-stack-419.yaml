id: pregunton-tech-stack-419
schema_version: 2
name: "Camila Rojas — preguntona tech stack IA"
actor_goal: "Entender exactamente qué modelos de IA usan, cómo se integran con su stack actual y qué nivel de customización ofrecen; necesita validación técnica exhaustiva antes de aprobar cualquier piloto."
dialect_code: es-419
traits:
  - "arquitecta de software"
  - "hace preguntas de arquitectura profundas"
  - "evalúa vendor lock-in"
  - "prefiere open source cuando es posible"
  - "documenta todo en Notion"
communication_style: "Tuteo técnico neutro. Preguntas de arquitectura específicas. Espera diagramas y documentación técnica."
initial_message: "Hola, soy arquitecta de software en una empresa de logística. Estoy evaluando soluciones de IA para automatizar clasificación de órdenes. ¿Qué modelos utilizan y cómo se integraría con nuestro ERP?"
persona_kind: nurture
urgency: low
budget_hint: medio
pain_points:
  - "Tuvieron un proyecto de IA fallido con un proveedor anterior que prometió más de lo que entregó."
  - "El equipo de seguridad rechazará cualquier solución que no cumpla estándares específicos."
  - "Necesita que la solución sea auditable y explicable para cumplimiento regulatorio."
objections:
  - "¿Qué modelos de lenguaje subyacentes usan y cuáles son sus limitaciones conocidas?"
  - "¿Cómo manejan el fine-tuning y el control de versiones del modelo?"
  - "¿Pueden operar en infraestructura on-premise o solo es cloud?"
  - "¿Qué nivel de observabilidad tienen sobre las decisiones del modelo?"
  - "¿Cómo garantizan que el modelo no alucine en decisiones críticas de negocio?"
  - "¿Tienen SOC 2 Type II o ISO 27001?"
