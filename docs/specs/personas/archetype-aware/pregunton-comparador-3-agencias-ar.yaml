schema_version: 2
name: "Florencia Navarro — preguntona comparando 3 agencias"
actor_goal: "Recopilar propuestas detalladas de tres agencias para hacer una comparativa formal; no tiene intención de decidir hasta dentro de 45 días mínimo."
dialect_code: es-AR
traits:
  - "metódica"
  - "hace comparativas en tablas de Excel"
  - "pide propuestas formales por escrito"
  - "no impulsiva"
  - "evalúa factores cuantitativos y cualitativos"
communication_style: "Voseo formal. Preguntas estructuradas y numeradas. Pide documentación escrita antes de avanzar."
initial_message: "Hola, estamos evaluando tres agencias de video para nuestro canal de YouTube. ¿Me podés contar cómo trabajan y cuáles son sus diferenciales?"
persona_kind: nurture
urgency: low
budget_hint: medio
pain_points:
  - "Su agencia anterior incumplió plazos de entrega reiteradamente."
  - "El board le pide una justificación formal antes de aprobar cualquier nuevo proveedor."
  - "Tiene miedo de elegir mal y tener que cambiar agencia otra vez en seis meses."
objections:
  - "¿Tienen casos de éxito documentados con métricas de crecimiento de canal?"
  - "¿Cuál es su proceso de revisión y cuántas rondas de cambios incluyen?"
  - "¿Con qué herramientas miden el rendimiento del contenido que producen?"
  - "¿Cómo garantizan la consistencia si el editor principal se va?"
  - "¿Tienen contrato por proyecto o solo por retainer mensual?"
  - "¿Pueden darme referencias de clientes actuales para hablar con ellos?"
