# 04-tickets.yaml — Template (pila tickets ordenada del story)
# Vive en: docs/projects/active/PI-N/sprints/SN/stories/{story-id}/04-tickets.yaml
# Owner: /architect
#
# ── Convenciones (origen R6+R8 process-improvement 2026-05-05) ──
#
# 1. decisions_applicable: list of decision IDs (D1, D2, A5, X2, etc.)
#    ratificadas en 01-spec.md "Decisions" block o 03-arch-*.md
#    "Architectural decisions" block. Cada ticket DEBE listar las
#    decisions que le aplican. Builder commit body MUST include sección
#    "Decisions honored" que cite cómo cada una fue respetada.
#
#    Ejemplo:
#      decisions_applicable: [D1, D3, X2]
#      # Donde D1 = "use SQLA 2.0 async" (de 03-arch-be.md)
#      #       D3 = "tenant_id en cada query" (de 01-spec.md)
#      #       X2 = "schema-mirror exception copilot" (de 03-arch-be.md)
#
#    Auditor verifica commit body cita cada D# del decisions_applicable
#    list. Sin cita = REVIEW.md WARN Cat 11 (Cross-cutting).
#
# 2. Sub-ticket numbering convention strict (R8):
#    - Use T-{N}.a, T-{N}.b, T-{N}.c — NEVER T-Na, T-Nb (sin punto)
#    - Renumeración prohibida post-architect: una vez asignado T-6.a,
#      no se renombra a T-7 aunque T-6 base sea cancelado
#    - Sub-tickets only when architect detects internal sequencing
#      (e.g., T-6.a = NULL columns, T-6.b = verify gate, T-6.c = DROP).
#      Independent work = new top-level T-N.
#    - Origen: PI-12 S1 Story A T-1..T-9 nominal pero arch produjo 11
#      con T-6a/b/c sin punto → confusión planeación.
#
# 3. Single git mv commit BEFORE scope expansion (R9):
#    - Cuando ticket implica rename file/folder + scope expansion
#      (e.g., add fields), architect/dev MUST split en 2 commits:
#        commit 1: `git mv` puro (rename only, zero diff content)
#        commit 2: scope expansion (modify content)
#    - Cleaner history. Bisect-friendly. Rename detección git automática.
#
# 4. repro_verified field for hot-fix tickets (R26 2026-05-05):
#    SSoT: .claude/rules/hotfix-repro-mandatory.md
#
#    Hot-fix tickets (origin: handoff doc, incident, auditor escalation,
#    bis sub-numbering) MUST include `repro_verified: bool` + `repro_evidence`:
#
#      repro_verified: true
#      repro_evidence:
#        command: "cd backend && .venv/bin/pytest tests/X/test_y.py -v"
#        output: |
#          AssertionError: '>' not supported between NoneType and int
#          at line 153 of test_y.py
#        diagnosis_validates_handoff: false                # if mismatch
#        diagnosis_correction: "Real cause is X not Y as handoff suggested"
#
#    /dev-team Step 0.5 refuses spawn builder if hot-fix ticket missing
#    `repro_verified: true`. /po Step 2.5 refuses redactar spec without
#    running repro first. Auditor REVIEW Cat 11 verifies cite presence.
#
#    Origen: T-1.bis 2026-05-05. Handoff doc misdiagnosed root cause; sin
#    repro local, builder Opus habría implementado wrong scope (~$8 waste).
#
# 5. production_code flag + dynamic owner_eligibility (R23, 2026-05-05):
#    Cada ticket declara `production_code: bool` (default: derivado de surface).
#    - true  = touches src/ (production runtime code, migrations, schema)
#    - false = touches tests/, docs/, scripts/ tooling, configs no-runtime
#
#    /dev-team Step 1 owner-decision logic:
#    - production_code: true  + surface AGENTIC → claude_opus_required: true HARD
#    - production_code: true  + BE/FE non-agentic → owner pool [qwen, sonnet, opus]
#    - production_code: false + ANY surface → owner pool [qwen, sonnet] (Opus
#      override-able pero NO required, even si surface AGENTIC)
#
#    Origen: T-1.bis 2026-05-05 forzó Opus 4.7 para test-only fix porque ticket
#    heredó `claude_opus_required: true` de Story A surface=AGENTIC. Token waste
#    ~$8 USD para test bridge migration que sonnet/qwen capable.
#
#    Default mapping:
#    - type: backend|agentic|frontend → production_code: true
#    - type: tests|docs|tooling|migration-only-no-data → production_code: false
#    Architect MAY override default explicitly cuando ticket es híbrido.

