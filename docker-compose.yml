services:
  # --- Application Service (API - Development) ---
  api_dev:
    build:
      context: ./backend
      target: dev
    container_name: visionarias_brain_dev
    restart: unless-stopped
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      - SHOPIFY_API_KEY=${SHOPIFY_API_KEY}
      - SHOPIFY_API_SECRET=${SHOPIFY_API_SECRET}
      - SHOPIFY_APP_URL=${SHOPIFY_APP_URL}
    volumes:
      - ./backend:/app
      - ./data/model_cache:/app/model_cache
    depends_on:
      - redis
      - qdrant
      - postgres
    networks:
      - internal_net
      - gateway
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      # Router for HTTP (Dev)
      - "traefik.http.routers.visionarias_http.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.visionarias_http.entrypoints=web"
      - "traefik.http.routers.visionarias_http.service=visionarias_api_dev"
      # Router for HTTP (Local Dev)
      - "traefik.http.routers.visionarias_api_local.rule=Host(`api.salesagent.local`)"
      - "traefik.http.routers.visionarias_api_local.entrypoints=web"
      - "traefik.http.routers.visionarias_api_local.service=visionarias_api_dev"
      # Service definition
      - "traefik.http.services.visionarias_api_dev.loadbalancer.server.port=8000"
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
        reservations:
          memory: 256M

  # --- Admin Interface (Streamlit - Development) ---
  admin_dashboard_dev:
    build: ./backend
    container_name: visionarias_admin_dev
    restart: unless-stopped
    command: streamlit run src/admin/app.py --server.port 8501 --server.address 0.0.0.0 --browser.gatherUsageStats false --server.enableCORS false --server.enableXsrfProtection false --server.maxUploadSize 500
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - API_URL=http://api_dev:8000
    depends_on:
      - api_dev
      - qdrant
      - postgres
    networks:
      - internal_net
      - gateway
    ports:
      - "127.0.0.1:8502:8501"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      # Router for HTTP (Dev)
      - "traefik.http.routers.admin_http.rule=Host(`${DASHBOARD_DOMAIN}`)"
      - "traefik.http.routers.admin_http.entrypoints=web"
      - "traefik.http.routers.admin_http.service=admin_dev"
      - "traefik.http.services.admin_dev.loadbalancer.server.port=8501"
    profiles:
      - extended
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          memory: 128M

  # --- Client Dashboard (Next.js - Development) ---
  client_dashboard_dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    container_name: visionarias_client_dev
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - frontend_next:/app/.next
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
      - "6006:6006"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}
      - NEXT_PUBLIC_ENVIRONMENT=${ENVIRONMENT:-dev}
      - INTERNAL_API_URL=${INTERNAL_API_URL}
      - SHOPIFY_API_KEY=${SHOPIFY_API_KEY}
      - CHOKIDAR_USEPOLLING=true # Essential for Windows/WSL hot reload
      - WATCHPACK_POLLING=true
    extra_hosts:
      - "api.salesagent.local:host-gateway"
      - "salesagent.local:host-gateway"
      - "admin.salesagent.local:host-gateway"
    depends_on:
      - api_dev
    networks:
      - internal_net
      - gateway
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.client_dev.rule=Host(`salesagent.local`)"
      - "traefik.http.routers.client_dev.entrypoints=web"
      - "traefik.http.services.client_dev.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 2048M
        reservations:
          memory: 512M

  frontend_tooling:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: test
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    command: sh -c "sleep infinity"
    profiles:
      - tooling
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - INTERNAL_API_URL=${INTERNAL_API_URL}
      - SHOPIFY_API_KEY=${SHOPIFY_API_KEY}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 256M

  backend_tooling:
    build:
      context: ./backend
      target: test
    command: sh -c "sleep infinity"
    profiles:
      - tooling
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./data/model_cache:/app/model_cache
    depends_on:
      - redis
      - qdrant
      - postgres
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 256M

  init_cache:
    image: alpine:latest
    command: sh -c "mkdir -p /app/model_cache && chmod 777 /app/model_cache"
    volumes:
      - ./data/model_cache:/app/model_cache
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 64M

  # --- WhatsApp Engine (Evolution API - Development v1.8.2) ---
  # whatsapp_engine:
  #   image: atendai/evolution-api:v1.8.2
  #   container_name: visionarias_whatsapp
  #   restart: unless-stopped
  #   shm_size: '2gb' # Critical for Chrome stability in Docker
  #   volumes:
  #     - ./data/whatsapp_data:/evolution/store
  #   environment:
  #     - SERVER_URL=http://visionarias_whatsapp:8080
  #     - AUTHENTICATION_API_KEY=${WHATSAPP_API_KEY:-evolution-api-secret-key}
  #     - DEL_INSTANCE=false
  #     # Database Config (Disabled for v1 stability test in WSL2 - Uses File Store)
  #     - "DATABASE_ENABLED=false"
  #     - "DATABASE_PROVIDER=postgresql"
  #     - "DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=evolution"
  #     - "DATABASE_CONNECTION_CLIENT_NAME=evolution_exchange"
  #     # Cache Config
  #     - "CACHE_REDIS_ENABLED=true"
  #     - "CACHE_REDIS_URI=redis://redis:6379/1"
  #     - "CACHE_REDIS_PREFIX=evolution:"
  #   networks:
  #     - internal_net
  #   ports:
  #     - "127.0.0.1:8080:8080" # Secure binding for debugging
  #   profiles:
  #     - extended
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '0.50'
  #         memory: 1024M
  #       reservations:
  #         memory: 512M

  # --- Infrastructure Services ---
  redis:
    image: redis:7-alpine
    container_name: visionarias_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis_data:/data
    networks:
      - internal_net
    ports:
      - "127.0.0.1:6379:6379" # Secure binding
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          memory: 128M

  qdrant:
    image: qdrant/qdrant:v1.7.3
    container_name: visionarias_qdrant
    restart: always
    volumes:
      - ./data/qdrant_data:/qdrant/storage
    networks:
      - internal_net
    ports:
      - "127.0.0.1:6333:6333" # Secure binding
      - "127.0.0.1:6334:6334"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 256M

  postgres:
    image: postgres:15-alpine
    container_name: visionarias_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net
    ports:
      - "127.0.0.1:5432:5432" # Secure binding
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 256M

  # --- ETL Scheduler ---
  scheduler:
    build: ./backend
    container_name: visionarias_scheduler
    restart: unless-stopped
    command: arq src.modules.analytics.workers.settings.SchedulerSettings
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import redis; r=redis.from_url(\"redis://redis:6379/0\"); r.ping()' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    profiles:
      - extended
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 256M

  # --- ETL Worker ---
  worker:
    build: ./backend
    container_name: visionarias_worker
    restart: unless-stopped
    command: arq src.modules.analytics.workers.settings.WorkerSettings
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import redis; r=redis.from_url(\"redis://redis:6379/0\"); r.ping()' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    profiles:
      - extended
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 256M

  # --- Cloudflare Tunnel ---
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - internal_net
      - gateway
    profiles:
      - extended
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          memory: 64M

volumes:
  frontend_next:
  frontend_node_modules:

networks:
  internal_net:
    driver: bridge
  gateway:
    name: ${TRAEFIK_NETWORK}
    external: true
