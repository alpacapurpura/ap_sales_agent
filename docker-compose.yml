services:
  # --- Application Service (API - Development) ---
  api_dev:
    build:
      context: ./backend
      target: dev
    container_name: visionarias_brain_dev
    restart: unless-stopped
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir src
    env_file:
      - .env
    environment:
      - SHOPIFY_API_KEY=${SHOPIFY_API_KEY}
      - SHOPIFY_API_SECRET=${SHOPIFY_API_SECRET}
      - SHOPIFY_APP_URL=${SHOPIFY_APP_URL}
    volumes:
      - ./backend:/app
      - ./data/model_cache:/app/model_cache
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      postgres:
        condition: service_started
      litellm:
        condition: service_healthy
    networks:
      - internal_net
      - gateway
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      # Router for HTTP (Dev)
      - "traefik.http.routers.visionarias_http.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.visionarias_http.entrypoints=web"
      - "traefik.http.routers.visionarias_http.service=visionarias_api_dev"
      # Router for HTTP (Local Dev)
      - "traefik.http.routers.visionarias_api_local.rule=Host(`api.salesagent.local`)"
      - "traefik.http.routers.visionarias_api_local.entrypoints=web"
      - "traefik.http.routers.visionarias_api_local.service=visionarias_api_dev"
      # Service definition
      - "traefik.http.services.visionarias_api_dev.loadbalancer.server.port=8000"
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1536M
        reservations:
          memory: 512M

  # --- Admin Interface (Streamlit - Development) ---
  admin_dashboard_dev:
    build: ./backend
    container_name: visionarias_admin_dev
    restart: unless-stopped
    command: streamlit run src/admin/app.py --server.port 8501 --server.address 0.0.0.0 --browser.gatherUsageStats false --server.enableCORS false --server.enableXsrfProtection false --server.maxUploadSize 500
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - API_URL=http://api_dev:8000
    depends_on:
      - api_dev
      - qdrant
      - postgres
    networks:
      - internal_net
      - gateway
    ports:
      - "127.0.0.1:8502:8501"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      # Router for HTTP (Dev)
      - "traefik.http.routers.admin_http.rule=Host(`${DASHBOARD_DOMAIN}`)"
      - "traefik.http.routers.admin_http.entrypoints=web"
      - "traefik.http.routers.admin_http.service=admin_dev"
      - "traefik.http.services.admin_dev.loadbalancer.server.port=8501"
    profiles:
      - admin
      - extended
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 256M

  # --- Client Dashboard (Next.js - Development) ---
  client_dashboard_dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    container_name: visionarias_client_dev
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - frontend_next:/app/.next
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
      - "6006:6006"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}
      - NEXT_PUBLIC_ENVIRONMENT=${ENVIRONMENT:-dev}
      - NEXT_PUBLIC_SENTRY_RELEASE=${SENTRY_RELEASE:-dev}
      - SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN:-}
      - SENTRY_ORG=alpaca-purpura-to
      - SENTRY_PROJECT=nicolify-frontend
      - INTERNAL_API_URL=${INTERNAL_API_URL}
      - SHOPIFY_API_KEY=${SHOPIFY_API_KEY}
      - NODE_OPTIONS=--max-old-space-size=5120
      - CHOKIDAR_USEPOLLING=true # Essential for Windows/WSL hot reload
      - WATCHPACK_POLLING=true
    extra_hosts:
      - "api.salesagent.local:host-gateway"
      - "salesagent.local:host-gateway"
      - "admin.salesagent.local:host-gateway"
    depends_on:
      - api_dev
    networks:
      - internal_net
      - gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.client_dev.rule=Host(`salesagent.local`)"
      - "traefik.http.routers.client_dev.entrypoints=web"
      - "traefik.http.services.client_dev.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 7168M
        reservations:
          memory: 1024M

  frontend_tooling:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: test
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    command: sh -c "sleep infinity"
    profiles:
      - tooling
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - INTERNAL_API_URL=${INTERNAL_API_URL}
      - SHOPIFY_API_KEY=${SHOPIFY_API_KEY}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 256M

  backend_tooling:
    build:
      context: ./backend
      target: test
    command: sh -c "sleep infinity"
    profiles:
      - tooling
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./data/model_cache:/app/model_cache
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      postgres:
        condition: service_started
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 256M

  e2e_runner:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: e2e
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    container_name: visionarias_e2e_runner
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - E2E_BASE_URL=http://host.docker.internal:3000
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_TESTING_TOKEN=${CLERK_TESTING_TOKEN:-}
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - E2E_CLERK_USER_EMAIL=${E2E_CLERK_USER_EMAIL}
      - E2E_CLERK_USER_USERNAME=${E2E_CLERK_USER_USERNAME}
      - E2E_CLERK_USER_PASSWORD=${E2E_CLERK_USER_PASSWORD}
      - E2E_TENANT_ID=${E2E_TENANT_ID}
    shm_size: '2gb'
    volumes:
      - ./frontend/e2e:/app/e2e
      - ./frontend/playwright.config.ts:/app/playwright.config.ts
      - ./frontend/test-results:/app/test-results
      - ./frontend/playwright-report:/app/playwright-report
    depends_on:
      client_dashboard_dev:
        condition: service_healthy
      api_dev:
        condition: service_started
    networks:
      - internal_net
    profiles:
      - e2e
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2048M
        reservations:
          memory: 512M

  init_cache:
    image: alpine:latest
    command: sh -c "mkdir -p /app/model_cache && chmod 777 /app/model_cache"
    volumes:
      - ./data/model_cache:/app/model_cache
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 64M

  # --- WhatsApp Engine (Evolution API - Development v1.8.2) ---
  # whatsapp_engine:
  #   image: atendai/evolution-api:v1.8.2
  #   container_name: visionarias_whatsapp
  #   restart: unless-stopped
  #   shm_size: '2gb' # Critical for Chrome stability in Docker
  #   volumes:
  #     - ./data/whatsapp_data:/evolution/store
  #   environment:
  #     - SERVER_URL=http://visionarias_whatsapp:8080
  #     - AUTHENTICATION_API_KEY=${WHATSAPP_API_KEY:-evolution-api-secret-key}
  #     - DEL_INSTANCE=false
  #     # Database Config (Disabled for v1 stability test in WSL2 - Uses File Store)
  #     - "DATABASE_ENABLED=false"
  #     - "DATABASE_PROVIDER=postgresql"
  #     - "DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=evolution"
  #     - "DATABASE_CONNECTION_CLIENT_NAME=evolution_exchange"
  #     # Cache Config
  #     - "CACHE_REDIS_ENABLED=true"
  #     - "CACHE_REDIS_URI=redis://redis:6379/1"
  #     - "CACHE_REDIS_PREFIX=evolution:"
  #   networks:
  #     - internal_net
  #   ports:
  #     - "127.0.0.1:8080:8080" # Secure binding for debugging
  #   profiles:
  #     - extended
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '0.50'
  #         memory: 1024M
  #       reservations:
  #         memory: 512M

  # --- Infrastructure Services ---
  redis:
    image: redis:7-alpine
    container_name: visionarias_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis_data:/data
    networks:
      - internal_net
    ports:
      - "127.0.0.1:6379:6379" # Secure binding
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 64M

  qdrant:
    image: qdrant/qdrant:v1.7.3
    container_name: visionarias_qdrant
    restart: always
    volumes:
      - ./data/qdrant_data:/qdrant/storage
    networks:
      - internal_net
    ports:
      - "127.0.0.1:6333:6333" # Secure binding
      - "127.0.0.1:6334:6334"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 192M
        reservations:
          memory: 64M

  postgres:
    image: postgres:15-alpine
    container_name: visionarias_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net
    ports:
      - "127.0.0.1:5432:5432" # Secure binding
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 192M
        reservations:
          memory: 64M

  # --- ETL Scheduler ---
  scheduler:
    build: ./backend
    container_name: visionarias_scheduler
    restart: unless-stopped
    command: arq src.workers.settings.SchedulerSettings
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import redis; r=redis.from_url(\"redis://redis:6379/0\"); r.ping()' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    profiles:
      - etl
      - extended
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 192M
        reservations:
          memory: 96M

  # --- ETL Worker ---
  worker:
    build: ./backend
    container_name: visionarias_worker
    restart: unless-stopped
    command: arq src.workers.settings.WorkerSettings
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
      - litellm
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import redis; r=redis.from_url(\"redis://redis:6379/0\"); r.ping()' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    profiles:
      - etl
      - extended
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          memory: 128M

  # --- Cloudflare Tunnel ---
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - internal_net
      - gateway
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 64M

  # --- LiteLLM Proxy (PI-2 S3 PR-2) ---
  litellm:
    image: ghcr.io/berriai/litellm-database:v1.83.10-stable
    container_name: visionarias_litellm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/visionarias_litellm_db"
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY}"
      LITELLM_SALT_KEY: "${LITELLM_SALT_KEY}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
      KIMI_API_KEY: "${KIMI_API_KEY}"
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      DISABLE_SPEND_LOGS: "true"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
      - "--num_workers"
      - "2"
    expose:
      - "4000"
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 768M
        reservations:
          memory: 256M

  # --- GrowthBook (per-tenant LLM override + A/B + kill-switch) (PI-2 S4 PR-2) ---
  # Self-hosted feature flag service. SDK Python en LLMConfigService consulta
  # flags `llm_model_override_<role>` con bucketing por tenant_id.
  # Por defecto NO se levanta (use `docker compose --profile growthbook up`)
  # — solo necesario cuando hay un caso real per-tenant override.
  growthbook:
    image: growthbook/growthbook:latest
    container_name: visionarias_growthbook
    restart: unless-stopped
    profiles: ["growthbook"]
    depends_on:
      postgres:
        condition: service_started
    environment:
      MONGODB_URI: ""  # GrowthBook OSS soporta Postgres alternative; configurable
      JWT_SECRET: "${GROWTHBOOK_JWT_SECRET:-dev-jwt-secret-change-in-prod}"
      ENCRYPTION_KEY: "${GROWTHBOOK_ENCRYPTION_KEY:-dev-encryption-key-change-in-prod}"
      APP_ORIGIN: "http://localhost:3001"
      API_HOST: "http://localhost:3100"
    expose:
      - "3000"  # Admin UI
      - "3100"  # API (SDK consume here)
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3100/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 256M

volumes:
  frontend_next:
  frontend_node_modules:

networks:
  internal_net:
    driver: bridge
  gateway:
    name: ${TRAEFIK_NETWORK}
    external: true
