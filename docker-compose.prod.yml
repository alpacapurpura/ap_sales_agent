services:
  backend:
    image: ghcr.io/alpacapurpura/visionarias-backend:latest
    container_name: visionarias_brain
    restart: always
    command: gunicorn -k uvicorn.workers.UvicornWorker src.main:app --bind 0.0.0.0:8000 --workers 4 --timeout 600
    env_file:
      - .env.prod
    volumes:
      - ./data/model_cache:/app/model_cache
      - ./data/static:/app/static
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - internal_net
      - gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1536M
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.visionarias.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.visionarias.entrypoints=websecure"
      - "traefik.http.routers.visionarias.tls.certresolver=letsencrypt"
      - "traefik.http.routers.visionarias.service=visionarias_api"
      - "traefik.http.services.visionarias_api.loadbalancer.server.port=8000"

  frontend:
    image: ghcr.io/alpacapurpura/visionarias-frontend:latest
    container_name: visionarias_client
    restart: always
    env_file:
      - .env.prod
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal_net
      - gateway
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/sign-in').then(r => {if(!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.client.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.client.entrypoints=websecure"
      - "traefik.http.routers.client.tls.certresolver=letsencrypt"
      - "traefik.http.services.client.loadbalancer.server.port=3000"

  # --- Admin Interface (Streamlit - On-demand via SSH Tunnel) ---
  admin:
    image: ghcr.io/alpacapurpura/visionarias-backend:latest
    container_name: visionarias_admin
    restart: "no"
    command: streamlit run src/admin/app.py --server.port 8501 --server.address 0.0.0.0 --browser.gatherUsageStats false --server.enableCORS false --server.enableXsrfProtection false --server.maxUploadSize 500
    env_file:
      - .env.prod
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
      - postgres
    networks:
      - internal_net
    ports:
      - "127.0.0.1:8501:8501"
    profiles:
      - admin
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M

  # --- ETL Worker ---
  worker:
    image: ghcr.io/alpacapurpura/visionarias-backend:latest
    container_name: visionarias_worker
    restart: always
    command: arq src.workers.settings.WorkerSettings
    env_file:
      - .env.prod
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import redis; r=redis.from_url(\"redis://redis:6379/0\"); r.ping()' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1024M

  # --- ETL Scheduler ---
  scheduler:
    image: ghcr.io/alpacapurpura/visionarias-backend:latest
    container_name: visionarias_scheduler
    restart: always
    command: arq src.workers.settings.SchedulerSettings
    env_file:
      - .env.prod
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import redis; r=redis.from_url(\"redis://redis:6379/0\"); r.ping()' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: visionarias_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis_data:/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  qdrant:
    image: qdrant/qdrant:v1.7.3
    container_name: visionarias_qdrant
    restart: always
    volumes:
      - ./data/qdrant_data:/qdrant/storage
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  postgres:
    image: postgres:15-alpine
    container_name: visionarias_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

networks:
  internal_net:
    driver: bridge
  gateway:
    name: ${TRAEFIK_NETWORK}
    external: true
