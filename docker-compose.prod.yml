services:
  backend:
    image: ghcr.io/alpacapurpura/visionarias-backend:latest
    container_name: visionarias_brain
    restart: always
    command: gunicorn -k uvicorn.workers.UvicornWorker src.main:app --bind 0.0.0.0:8000 --workers 4 --timeout 600
    env_file:
      - .env.prod
    volumes:
      - ./data/model_cache:/app/model_cache
      - ./data/static:/app/static
    depends_on:
      - redis
      - qdrant
      - postgres
    networks:
      - internal_net
      - gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.visionarias.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.visionarias.entrypoints=websecure"
      - "traefik.http.routers.visionarias.tls.certresolver=letsencrypt"
      - "traefik.http.routers.visionarias.service=visionarias_api"
      - "traefik.http.services.visionarias_api.loadbalancer.server.port=8000"

  frontend:
    image: ghcr.io/alpacapurpura/visionarias-frontend:latest
    container_name: visionarias_client
    restart: always
    env_file:
      - .env.prod
    depends_on:
      - backend
    networks:
      - internal_net
      - gateway
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/sign-in').then(r => {if(!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.client.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.client.entrypoints=websecure"
      - "traefik.http.routers.client.tls.certresolver=letsencrypt"
      - "traefik.http.services.client.loadbalancer.server.port=3000"

  # --- Admin Interface (Streamlit - On-demand via SSH Tunnel) ---
  admin:
    image: ghcr.io/alpacapurpura/visionarias-backend:latest
    container_name: visionarias_admin
    restart: "no"
    command: streamlit run src/admin/app.py --server.port 8501 --server.address 0.0.0.0 --browser.gatherUsageStats false --server.enableCORS false --server.enableXsrfProtection false --server.maxUploadSize 500
    env_file:
      - .env.prod
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
      - postgres
    networks:
      - internal_net
    ports:
      - "127.0.0.1:8501:8501"
    profiles:
      - admin
    deploy:
      resources:
        limits:
          memory: 512M

  # --- ETL Worker ---
  worker:
    image: ghcr.io/alpacapurpura/visionarias-backend:latest
    container_name: visionarias_worker
    restart: always
    command: arq src.modules.analytics.workers.settings.WorkerSettings
    env_file:
      - .env.prod
    depends_on:
      - redis
      - postgres
    networks:
      - internal_net

  # --- ETL Scheduler ---
  scheduler:
    image: ghcr.io/alpacapurpura/visionarias-backend:latest
    container_name: visionarias_scheduler
    restart: always
    command: arq src.modules.analytics.workers.settings.SchedulerSettings
    env_file:
      - .env.prod
    depends_on:
      - redis
      - postgres
    networks:
      - internal_net

  redis:
    image: redis:7-alpine
    container_name: visionarias_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis_data:/data
    networks:
      - internal_net

  qdrant:
    image: qdrant/qdrant:v1.7.3
    container_name: visionarias_qdrant
    restart: always
    volumes:
      - ./data/qdrant_data:/qdrant/storage
    networks:
      - internal_net

  postgres:
    image: postgres:15-alpine
    container_name: visionarias_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge
  gateway:
    name: ${TRAEFIK_NETWORK}
    external: true
