key_messages:
  - "Orgánico antes que paid"
  - "Data sobre engagement vanidoso"
  - "Cohort limitada (max 15 clientes activos)"
  - "Producción in-house"
  - "Reportamos CAC/LTV/ROAS, no likes"
  - "Decimos que no a clientes que no son fit"

tone_of_voice:
  description: "Directo + casual con voseo argentino legítimo (Flor) + español neutro Lima del resto del equipo. Anti-bullshit. Humor seco."
  do:
    - "Voseo legítimo cuando habla Flor"
    - "Tuteo neutral cuando habla Lucía/Mateo (peruanos)"
    - "Real numbers en testimonios"
    - "Decline cuando no aplica"
    - "Decir 'no sé' cuando no sabe"
  dont:
    - "Lenguaje motivacional Tony Robbins"
    - "Promesas de 'cambiar tu vida'"
    - "Engagement vanidoso ('miles de likes')"
    - "Voseo paisa o regionalismos extremos"

