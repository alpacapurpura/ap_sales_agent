# ─────────────────────────────────────────────────────────────
# Nicolify scheduling integration
# ─────────────────────────────────────────────────────────────
scheduling:
  provider: "Nicolify scheduling (clon-Calendly built-in)"
  event_types:
    - id: "scheduling_evt_a4_l1_audit_growth"
      name: "Audit growth — reunión inicial 30 min (gratis para confirmar fit)"
      duration_minutes: 30
      offer_level: "L1"
      facilitator: "Florencia Aramburu"
      booking_url: "https://app.nicolify.com/schedule/pulso-studio/audit-growth"
      pre_booking_questions:
        - "¿Cuál es tu negocio? (sector + tamaño)"
        - "¿Cuánto facturás aproximadamente al mes?"
        - "¿Qué probaste antes en marketing?"
        - "¿Cuál es tu inversión actual mensual en marketing?"
      capacity_per_week: 8
      timezone_default: "America/Lima"

    - id: "scheduling_evt_a4_l3_retainer_discovery"
      name: "Discovery call retainer mensual"
      duration_minutes: 45
      offer_level: "L3"
      facilitator: "Florencia Aramburu"
      booking_url: "https://app.nicolify.com/schedule/pulso-studio/retainer-discovery"
      pre_booking_questions:
        - "¿Facturación mensual actual?"
        - "¿Inversión actual marketing? (paid + agencias previas)"
        - "¿Tenés equipo de marketing in-house?"
        - "¿Qué objetivos de growth a 6 meses?"
      capacity_per_week: 6

    - id: "scheduling_evt_a4_l4_consultoria"
      name: "Discovery call consultoría estratégica"
      duration_minutes: 45
      offer_level: "L4"
      facilitator: "Florencia Aramburu + Camila Rojas"
      booking_url: "https://app.nicolify.com/schedule/pulso-studio/consultoria-estrategica"
      pre_booking_questions:
        - "¿Por qué consultoría custom vs retainer?"
        - "¿Tenés equipo in-house ejecutor?"
        - "¿Scope esperado (semanas, profundidad)?"
      capacity_per_week: 4

# ─────────────────────────────────────────────────────────────
# Channel-specific messaging
# ─────────────────────────────────────────────────────────────
channel_specific_messaging:
  linkedin_dm:
    avg_response_time_hours: 8
    avg_message_length: "long-form OK (B2B audience)"
    common_inbound_intents:
      - "Solicitud audit growth"
      - "Pregunta retainer + caso similar"
      - "Pregunta consultoría puntual"
      - "Pregunta colaboración / sponsor"
    initial_response_template: "Saludo + qualifying tamaño negocio + bridge audit L1"
  whatsapp:
    avg_response_time_hours: 4
    avg_message_length: "1-3 frases multi-msg"
    common_inbound_intents:
      - "Cotización rápida"
      - "Pregunta producción video puntual"
      - "Operativo (cliente activo)"
    initial_response_template: "Saludo + qualifying + recomendación servicio"
  instagram_dm:
    avg_response_time_hours: 6
    common_inbound_intents:
      - "Pregunta sobre 'cómo crecer en Instagram'"
      - "Pedido de colaboración"
      - "Wantrepreneurs sin negocio validado (decline esperado)"
    initial_response_template: "Saludo + qualifying ('¿negocio activo?') + bridge a audit L1 si fit, recomendar otra cosa si no"
  email:
    avg_response_time_hours: 24
    long_form_ok: true
    common_inbound_intents:
      - "Aplicación a beca / sponsorship (no aplica — Pulso no da becas)"
      - "Solicitud de propuesta corporativa B2B"
      - "Solicitud de prensa/medios"
      - "Aplicación a equipo (carrera)"

# ─────────────────────────────────────────────────────────────
# Política decline (anti-mal-fit)
# ─────────────────────────────────────────────────────────────
decline_policy: |
  Pulso DECLINA a clientes que:
  - No tienen ventas validadas (mínimo 5-10 ventas con mensaje claro)
  - Facturan <USD 30k/mes (no escalable retainer)
  - Esperan "viral en TikTok" como objetivo
  - Quieren agencia "para sentirse emprendedor"
  - Esperan promesa de resultado <90 días en orgánico

  Recomendaciones honest:
  - Validar primero (cursos validación negocio, mentoría 1:1)
  - Audit L1 PEN 500 si quieren diagnóstico igual
  - Otra agencia barata si ROI agencia premium no aplica
  - In-house si volumen + presupuesto >USD 100k/mes
