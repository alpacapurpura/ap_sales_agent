strategy:
  methodology_name: "Pulso Method"
  methodology_description: >
    Marco de 4 fases que toma marca early-stage o estancada y la lleva
    a sistema de adquisición predecible. Diferencial: cada decisión
    sustentada en data (no instinto creativo solo).
  methodology_pillars:
    - title: "Diagnóstico data-driven"
      description: "Audit con métricas reales actuales (CAC, LTV, conversion rate, CPM) — antes de proponer cualquier creativo"
    - title: "Concepto + plan editorial"
      description: "Concept boards basados en performance data + plan editorial 90 días con KPIs por pieza"
    - title: "Producción + iteración"
      description: "Producción de video/RRSS + iteración semanal basada en performance"
    - title: "Escalamiento paid + orgánico"
      description: "Cuando orgánico funciona, paid lo amplifica. NO al revés."

story:
  origin: >
    Florencia "Flor" Aramburu (32 años) trabajó 6 años como CMO en una
    fintech argentina (B2B SaaS) que escaló de USD 1M a USD 12M ARR
    bajo su lead. Se mudó a Lima en 2021 por su pareja peruano y abrió
    Pulso Studio en 2022 cuando vio que las marcas LatAm tenían
    presupuesto pero les faltaba estructura de data + creativo unido.
  mission: >
    Demostrar que crecimiento orgánico + paid bien orquestado es más
    rentable que gastar en ads sin estrategia — con data real que el
    cliente ve cada semana.
  vision: >
    Ser la agencia de referencia para marcas LatAm B2B y D2C que
    quieren escalar con disciplina creativa y rigor de data.
  founder_journey: >
    Flor vio en su rol corporativo demasiados ejemplos de marcas
    quemando presupuesto en ads sin orgánico de soporte. Su tesis: el
    contenido orgánico construye la marca; el paid lo amplifica. Pulso
    Studio aplica esa secuencia cliente por cliente.
  brand_evolution:
    - year: 2022
      milestone: "Fundación. Flor + 1 editor video. 4 clientes iniciales (referidos red AR)."
    - year: 2023
      milestone: "Equipo crece a 4 personas. Cliente fintech peruano clase con caso de éxito (NPS 72)."
    - year: 2024
      milestone: "Equipo 7 personas. 18 clientes activos. Lanzamiento Pulso Method documentado."
    - year: 2025
      milestone: "30 marcas atendidas acumuladas. Caso retail premium (cliente con campaña ROI 4.2x)."
    - year: 2026
      milestone: "Q2 2026: foco en escalar con menos clientes (max 15 simultáneos) + retainer premium."

positioning:
  unique_value_proposition: >
    La única agencia growth en Lima que combina producción de video
    in-house + estrategia data-driven + reporting semanal con números
    reales (CAC, LTV, CPM, conversion rate) — no solo "engagement"
    vanidoso.
  brand_essence: "Movimiento con disciplina"
  discriminator: "Producción in-house de video + reporting semanal con números reales (no vanity metrics) + capacidad de cerrar el loop ads → orgánico → ventas"
  competitor_landscape:
    direct_competitors:
      - "Artivy Studio Lima (especialistas video)"
      - "LimaRank (marketing digital integral)"
      - "VPI-media (producción audiovisual + agencia)"
      - "Onfleek Media (RRSS gestión)"
      - "Webtilia (marketing digital)"
    differentiation: "Único equipo con CMO ex-corporate como founder + data semanal real + cohorte limitada (max 15 clientes activos)"
  ideal_customer_summary: "Marca peruana o LatAm 5-50 personas, facturando USD 30k-2M/mes, con presupuesto marketing PEN 8k-25k/mes, busca escalar via contenido + paid orquestado. Founders/CEOs que valoran data sobre 'engagement vanidoso'."

