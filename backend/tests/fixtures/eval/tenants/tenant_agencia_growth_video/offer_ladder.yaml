# Variants:
#   PACK  — Producción video L2 (4 / 8 / 12 reels)
#   TIER  — Retainer mensual L3 (Starter / Growth / Premium)
#
# Discovery / cierre:
#   L1 audit = entry point pago, requiere reunión 30 min. NO es lead magnet (no es gratis).
#   L3 retainer → discovery call obligatoria 45 min
#   L4 consultoría → discovery call obligatoria 45 min
#
# has_lead_magnet: false → trigger structlog warning per AD6.

