    - "Cumplimiento Ley 29733 Protección de Datos Personales (Perú)"
    - "Cumplimiento INDECOPI lineamientos IA"
    - "Anthropic Solution Partner certified"
    - "OpenAI API Solution Provider"
    - "AWS Partner Network — Select Tier"

strategy:
  methodology_name: "Núcleo Method"
  methodology_description: >
    Marco de 4 fases que toma proceso operacional con cuello de botella
    y lo automatiza con IA productiva (no demo). Diferencial: medimos ROI
    en horas-persona ahorradas + costo operacional reducido, no en
    'wow factor' del demo.
  methodology_pillars:
    - title: "Discovery profundo"
      description: "Workshop 4 horas con stakeholders + observación operación 1 semana antes de proponer cualquier solución"
    - title: "Diseño con guardrails"
      description: "Cada agente IA tiene fallbacks documentados + monitoring + límites operacionales claros"
    - title: "Implementación medible"
      description: "Cada feature con métrica de éxito predefinida (tickets resueltos sin escalación, horas ahorradas, etc.)"
    - title: "Mantenimiento productivo"
      description: "Modelos no se 'instalan y olvidan' — requieren tuning continuo. Retainer mensual cubre ese mantenimiento."

story:
  origin: >
    Iván Castro estudió Ingeniería de Software en la PUCP (2014-2018).
    Fellowship investigación NLP con MIT Media Lab (2018-2019). Trabajó
    como AI Engineer en startup B2B SaaS (Y Combinator W19, 80 empleados
    al salir) entre 2019-2024 en NY. Volvió a Lima en 2024 con la idea
    de aplicar lo que vio funcionar a empresas medianas LatAm. Núcleo
    Lab abrió en julio 2024 con 3 personas (Iván + 2 ex-colegas).
  mission: >
    Hacer accesible automatización con IA a empresas medianas LatAm
    (50-500 empleados) con sistemas productivos, no demos.
  vision: >
    Que el 80% de empresas medianas LatAm tengan al menos 1 proceso
    crítico automatizado con IA hacia 2030 — y que ese proceso funcione
    en producción real (no en piloto eterno).
  founder_journey: >
    Iván vio en SF demasiados ejemplos de "agentes IA" que funcionaban
    en demo pero se rompían en producción al ver edge cases reales.
    Decidió armar agencia con foco en sistemas productivos: monitoring,
    fallbacks, guardrails, métricas de éxito predefinidas. NO 'wow demo'
    sin sustancia operacional.
  brand_evolution:
    - year: 2024
      milestone: "Apertura jul 2024. Iván + 2 ingenieros. Primer cliente: empresa logística Lima (caso automatización tracking). NPS interno cliente 9/10."
    - year: 2024
      milestone: "Q4 2024 — segundo cliente fintech peruano (caso atención cliente WhatsApp con agente). 4 personas equipo."
    - year: 2025
      milestone: "Equipo crece a 7 personas. 6 clientes activos. Caso retail con automatización inventario que ahorra 200h/mes."
    - year: 2025
      milestone: "Q4 — primer cliente Series B fintech con sistema atención cliente IA en producción 24/7. NPS cliente 8.5."
    - year: 2026
      milestone: "Equipo 9 personas (4 AI + 3 product + 2 customer success). 9 clientes activos retainer + 4 implementaciones one-shot."

positioning:
  unique_value_proposition: >
    La única agencia LatAm con foco en sistemas IA productivos para
    empresas medianas — discovery profundo + diseño con guardrails +
    métricas de éxito predefinidas + mantenimiento ongoing. NO vibe-code
    demos. NO consultoría sin código entregado.
  brand_essence: "Sistemas IA que funcionan en producción"
  discriminator: "Foco productivo (no demos) + métricas de éxito predefinidas + cumplimiento normativo Ley 29733 PE + Anthropic/OpenAI certified team + entregables incluyen documentación + monitoring + handover técnico"
  competitor_landscape:
    direct_competitors:
      - "Agencia IA (agenciaia.com.pe)"
      - "Tooldata (Lima/Arequipa/Cusco)"
      - "ToGrow Agencia"
      - "Miss Yera consultoría"
      - "Vexsoluciones"
      - "AuroraInbox"
    differentiation: "Único equipo con AI engineers ex-YC + foco productivo > demos + cumplimiento normativo PE explícito + retainer mensual de mantenimiento (otros venden one-shot y desaparecen)"
  ideal_customer_summary: "Empresa LatAm 50-500 empleados, facturando USD 500k-15M/mes, con cuello de botella operacional concreto que se podría automatizar (atención cliente, procesamiento documentos, generación contenido, análisis datos). NO startups validando idea. NO empresas que buscan 'IA por estar a la moda'."

