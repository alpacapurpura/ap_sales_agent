  tagline: "Automatización IA seria para empresas que ya facturan — sin demos vibe-code"
  description: >
    Núcleo Lab es agencia de automatización con IA + desarrollo de software
    asistido por IA enfocada en empresas LatAm con operaciones reales (50+
    empleados, USD 500k+/mes facturación). Liderada por Iván Castro
    (ingeniero de software peruano, ex-AI Engineer en Y Combinator startup
    NY 2019-2024). Equipo de 9 personas: 4 AI engineers + 3 product
    engineers + 2 customer success. Diferencial: agentes IA productivos
    en producción, no demos vibe-code que se rompen al primer edge case.
  industry: "automatización con IA + desarrollo de software con IA para empresas medianas LatAm"
  website: "https://nucleo-lab.pe"
  founding_year: "2024"
  language: "es"
  timezone: "America/Lima"
