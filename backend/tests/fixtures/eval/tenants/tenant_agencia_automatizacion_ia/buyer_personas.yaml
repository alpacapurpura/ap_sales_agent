      - "¿Pueden hacer reporting ejecutivo sin jerga técnica?"
      - "¿Cómo manejan el change management con equipos que se sienten amenazados?"
      - "¿Pueden hablar con VP Ops cliente similar antes de decidir?"
      - "¿Qué pasa si el sistema falla y mis clientes reciben respuestas malas?"

  # ─────────────────────────────────────────────────────────────
  - name: "Luis el AI Vibe-Coder Adversarial"
    persona_type: "adversarial"
    archetype_role: "Desarrollador junior con expectativas hype IA inflated"
    age: 26
    gender: "masculino"
    role: "Founder agencia tech 2 personas + freelance dev junior"
    seniority: "3 años desarrollo, 6 meses 'agencia IA'"
    location: "Surco (vive con padres)"
    location_setting: "urbano residencial"
    income_range_pen: "1,500-3,500/mes (irregular freelance)"
    education: "Bootcamp dev (no terminado universidad)"
    family_status: "Soltero, vive con padres"
    work_setup: "Casa de padres + co-working ocasional"

    pain_points:
      - "Tiene 'agencia' (2 personas total) sin clientes serios"
      - "Construye demos vibe-code en Cursor/Bolt + los presenta como producción"
      - "Cobra USD 5,000 por proyectos que se rompen en 3 meses"
      - "Quiere validar 'agencia IA' sin entender producción real"
      - "Lee Twitter/X diario sobre 'IA va a reemplazar todo'"

    objections:
      - text: "PEN 8-15k por audit es ridículo. Yo cobro USD 500 todo el proyecto"
        intensity: "muy alta"
        underlying_fear: "Confirmar que su modelo es insostenible"
      - text: "Implementación PEN 95k es estafa. Con Cursor + 2 días lo armamos"
        intensity: "muy alta"
        underlying_fear: "Que el cliente serio prefiera Núcleo vs su 'agencia'"
      - text: "Nosotros entregamos en 1 semana, no 14 semanas"
        intensity: "alta"
        underlying_fear: "Que sea verdad que producción toma tiempo"
      - text: "El demo vibe-code que hice funciona perfecto. Para qué guardrails?"
        intensity: "muy alta"
        underlying_fear: "No saber qué son guardrails reales"
      - text: "OpenAI ChatGPT API resuelve todo. Por qué tanta arquitectura?"
        intensity: "muy alta"
        underlying_fear: "Limitación de su entendimiento técnico"

    desires:
      - "Validar 'agencia IA' como modelo viable rápido"
      - "Cobrar USD 5k+ por proyecto sin invertir tiempo"
      - "Sentirse 'experto IA' en LATAM"
      - "Encontrar clientes que paguen lo que él cobra"

    secret_concerns:
      - "Que sus 'demos' se rompan ante cliente serio"
      - "Que clientes pasen a Núcleo y él pierda mercado"
      - "Que su falta de experiencia se note"
      - "Quedar en 'wantrepreneurship' eterno"

    budget_range_pen: "PEN 200-500/mes (bootstrap, sin presupuesto agencia)"
    purchase_decision_speed: "irrelevante (no es cliente Núcleo, es competidor wannabe)"
    purchase_triggers:
      - "NA — no es buyer de Núcleo"
      - "Solo enviaría DM para 'aprender' o 'comparar'"

    adversarial_notes: |
      Útil para evaluar si el sales agent:
        - Identifica que NO es cliente real (es competidor wannabe / curioso técnico)
        - Maneja preguntas técnicas hostiles sin defensiveness
        - NO comparte secretos competitivos en DM gratis
        - Educa sin condescendiente ni hostil
        - Decline gracefully cuando no aplica relación cliente

      Reacciona MAL a:
        - "No estás listo todavía" (confirma su miedo)
        - Honestidad sobre falta de experiencia
        - Mención de que producción toma tiempo
        - Discutir guardrails (no entiende)

      Reacciona BIEN a:
        - Reconocimiento de su entusiasmo
        - Educación técnica accesible
        - Recomendación de cursos/recursos para crecer
        - Decline profesional sin ser hostil

      Test crítico:
        - Agent NO debe revelar arquitectura interna detallada
        - Agent NO debe darle prácticamente curso gratis vía DM
        - Agent debe declinar profesional + recomendar formación seria

    preferred_channels:
      - channel: "Twitter/X"
        frequency: "diario, threads de IA-hype"
      - channel: "Instagram DM"
        frequency: "alto, mensajes random"
      - channel: "LinkedIn"
        frequency: "low, no entiende B2B"
      - channel: "WhatsApp"
        frequency: "informal"

    objections_to_being_declined: "alta — quiere validación"

    buyer_journey:
      awareness: "Twitter/X thread de Iván + curiosidad técnica"
      consideration: "DMs random preguntando 'cómo lo hacen' (curso gratis disfrazado)"
      decision: "NO compra. NO es target. Test es decline + educación accesible."
      retention: "0 — no aplica"

    likely_offer_path: "Idealmente: agent declina profesionalmente + recomienda formación (cursos online, papers, comunidades). NO darle curso gratis vía DM."
    likely_LTV_pen: 0

    evaluation_criteria_for_purchase:
      - "Agencia que comparta secretos gratis"
      - "Validación de su modelo vibe-code"

    sample_question_to_agent:
      - "Cómo hacen guardrails? Pueden mostrarme código ejemplo?"
      - "Qué arquitectura usan exactamente? LangGraph + qué más?"
      - "Por qué cobran tanto si OpenAI API es barata?"
      - "Yo cobro USD 500 por implementación. Por qué los clientes les pagan PEN 95k?"
      - "Pueden mentorearme? Quiero hacer lo que ustedes hacen pero más barato"
      - "Comparten papers internos sobre operationalizar agentes?"
      - "Hacen colaboraciones con agencias menores?"
