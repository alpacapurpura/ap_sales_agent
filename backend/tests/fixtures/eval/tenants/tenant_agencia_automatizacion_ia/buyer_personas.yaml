      - text: "PEN 80,000 implementación parece mucho ROI no claro"
        intensity: "alta"
        underlying_fear: "Justificar ante board sin métricas claras"
      - text: "Mi equipo va a sentir que IA reemplaza a personas"
        intensity: "muy alta"
        underlying_fear: "Conflicto interno + rotación equipo"
      - text: "Otra agencia me ofreció USD 5,000 por agente similar"
        intensity: "alta"
        underlying_fear: "Pagar de más cuando hay opciones más baratas"

    desires:
      - "ROI medible en horas-persona ahorradas + CSAT mejorado"
      - "Sistema que no la avergüence ante board"
      - "Reasignar equipo a tareas más estratégicas (no eliminar)"
      - "Que agencia maneje complejidad técnica que ella no tiene"
