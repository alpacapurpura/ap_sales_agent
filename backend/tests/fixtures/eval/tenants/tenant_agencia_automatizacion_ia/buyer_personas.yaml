    archetype_role: "CTO empresa mediana evaluando agencia IA con criterio técnico"
    age: 41
    gender: "masculino"
    role: "CTO fintech B2B peruana 80 personas"
    seniority: "18 años en software, 6 años CTO 2 startups"
    location: "San Isidro, Lima"
    location_setting: "urbano profesional tech"
    income_range_pen: "USD 8k-12k personal + equipo eng 25 personas"
    education: "Ingeniero Sistemas PUCP + maestría University of Texas Austin"
    family_status: "Casado, dos hijos adolescentes"
    work_setup: "Híbrido — 3 días oficina San Isidro"
    company_stage: "Series A, USD 800k MRR, 28% MoM"

    pain_points:
