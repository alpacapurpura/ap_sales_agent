      - "Probaron 2 agencias IA antes que solo entregaron demos"
      - "Quiere sistema productivo, no piloto eterno"
      - "Necesita compliance Ley 29733 + visa fintech estricto"
      - "Decisión bajo escrutinio CFO + comité tecnología"

    objections:
      - text: "Probamos 2 agencias antes que no entregaron a producción"
