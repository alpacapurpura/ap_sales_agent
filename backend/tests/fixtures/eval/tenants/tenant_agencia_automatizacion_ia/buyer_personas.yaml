        underlying_fear: "Compromiso ongoing + cargo permanente"
      - text: "Cómo aseguran que el agente no genera respuestas problemáticas?"
        intensity: "muy alta"
        underlying_fear: "Riesgo regulatorio fintech (SBS + INDECOPI)"

    desires:
      - "Sistema productivo en 8-14 semanas (no pilot eterno)"
      - "Métricas claras de ROI (% tickets resueltos sin escalar)"
      - "Cumplimiento Ley 29733 documentado"
      - "Equipo cliente capacitado para mantener (no dependencia agencia)"
      - "Que CFO + comité aprueben con datos sólidos"

    secret_concerns:
      - "Quedar mal ante board si proyecto falla"
      - "Que su equipo se sienta amenazado por IA"
      - "Atrasarse con regulador SBS por respuesta automatizada incorrecta"
      - "Que sistema esté en producción 6 meses y degrade silenciosamente"

    budget_range_pen: "PEN 60-95k implementación + PEN 7,500/mes retainer Growth"
    purchase_decision_speed: "lenta (8-12 semanas) — múltiples evaluaciones técnicas + stakeholders"
    purchase_triggers:
      - "Caso B2B SaaS fintech con sistema en producción >12 meses"
      - "Demo arquitectura completa (no solo agente respondiendo)"
      - "Garantías escritas SLA + bug fixes"
      - "Capacidad de hablar con cliente similar previo"
      - "Documentación compliance Ley 29733 explícita"

    preferred_channels:
      - channel: "LinkedIn"
        frequency: "diario"
        tone_preferred: "técnico profundo, casos reales"
      - channel: "Email"
        frequency: "alta"
        tone_preferred: "long-form, datos, propuestas formales"
      - channel: "Videoconferencia"
        frequency: "agenda directo"
      - channel: "Github"
        frequency: "verifica equipo técnico via repos públicos"

    aspirations:
      - "Sistema referente en fintech LatAm (case study public)"
      - "Reducir CAC + tickets resueltos sin escalar 60%+"
      - "Capacitar equipo interno para extensión propia post-handover"

    objections_to_demos_only: "muy alta — exige producción demostrable"

    buyer_journey:
      awareness: "LinkedIn post Iván + recomendación CTO otra fintech"
      consideration: "8-12 semanas evaluación. Investiga github Núcleo, papers. Discovery + audit + 2-3 reuniones técnicas."
      decision: "Decide tras: (a) caso producción demostrable, (b) equipo técnico verificable, (c) compliance documentado, (d) board approval"
      retention: "Alta — retainer Premium 12+ meses si sistema funciona"

    likely_offer_path: "L1 → L2 audit → L3 implementación medio (PEN 55k) → L4 Premium retainer"
    likely_LTV_pen: 220000

    evaluation_criteria_for_purchase:
      - "Equipo técnico verificable (LinkedIn, GitHub, papers)"
      - "Caso producción >12 meses con cliente similar"
      - "Documentación compliance Ley 29733"
      - "Garantías SLA + bug-fix escritas"
      - "Stack técnico moderno (no legacy)"
      - "Capacidad handover técnico equipo cliente"

    sample_question_to_agent:
      - "¿Tienen casos B2B SaaS fintech con sistema en producción >12 meses?"
      - "¿Qué arquitectura usan? (LangGraph, Anthropic SDK, vector DB, etc.)"
      - "¿Cómo aseguran cumplimiento Ley 29733 con datos sensibles?"
      - "¿Pueden firmar NDA antes de discovery profundo?"
      - "¿Qué SLA garantizan en retainer Premium?"
      - "¿Pueden ofrecer deployment on-premise?"
      - "¿Su CTO viene de cuál stack? Verificable LinkedIn?"

  # ─────────────────────────────────────────────────────────────
  - name: "Carolina la VP Operaciones"
