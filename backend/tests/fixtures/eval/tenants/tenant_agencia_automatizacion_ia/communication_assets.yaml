# ─────────────────────────────────────────────────────────────
# Channel-specific messaging
# ─────────────────────────────────────────────────────────────
channel_specific_messaging:
  linkedin_dm:
    avg_response_time_hours: 6
    avg_message_length: "long-form OK (B2B audience técnica)"
    common_inbound_intents:
      - "Discovery call request"
      - "Pregunta técnica caso de uso específico"
      - "Solicitud de propuesta corporativa"
      - "Pregunta empleo (no aplica — Núcleo no contrata frecuente)"
    initial_response_template: "Saludo + qualifying empresa/caso + bridge discovery L1 si fit"
  email:
    avg_response_time_hours: 24
    long_form_ok: true
    common_inbound_intents:
      - "Solicitud propuesta formal corporate"
      - "Solicitud NDA"
      - "Pregunta compliance (Ley 29733, GDPR)"
      - "Solicitudes prensa/medios"
      - "Aplicaciones a research / papers"
  whatsapp:
    avg_response_time_hours: 4
    avg_message_length: "1-3 frases"
    common_inbound_intents:
      - "Operativo cliente activo"
      - "Cotización rápida si ya hubo discovery"
      - "Wantrepreneurs / vibe-coders (decline esperado)"
    initial_response_template: "Saludo + qualifying tamaño empresa + bridge a discovery si fit"
  twitter_dm:
    avg_response_time_hours: 12
    common_inbound_intents:
      - "Preguntas técnicas (responder accesible sin revelar IP)"
      - "AI engineers preguntando carrera (decline graceful)"
      - "Vibe-coders pidiendo arquitectura gratis (decline + educación)"
    initial_response_template: "Acknowledge + decline si no es buyer + recomendar recursos públicos"

# ─────────────────────────────────────────────────────────────
# Política decline anti-mal-fit
# ─────────────────────────────────────────────────────────────
decline_policy: |
  Núcleo DECLINA a:
  - Empresas <50 empleados o facturando <USD 500k/mes
  - Casos de uso con expectativas no realistas (reemplazar todo el equipo)
  - Wantrepreneurs / startups validando idea
  - Vibe-coders pidiendo arquitectura gratis vía DM
  - Proyectos con presupuesto <PEN 28,000

  Recomendaciones honest según caso:
  - Empresas chicas: herramientas no-code (Make + Zapier + ChatGPT API)
  - Startups validando: validar primero (no agencia)
  - Vibe-coders: cursos serios online + papers públicos + comunidades técnicas
  - Proyectos baratos: agencias más económicas (Agencia IA, Tooldata) o freelancers verificados

# ─────────────────────────────────────────────────────────────
# Compliance + security
# ─────────────────────────────────────────────────────────────
compliance:
  ley_29733_peru: true
  ley_29733_documentation: "Disponible bajo NDA. Diagrama data flow + DPA firmado por proyecto."
  indecopi_lineamientos_ia: true
  gdpr: "Disponible como add-on (15-25% extra al proyecto)"
  eu_ai_act: "En roadmap Q3 2026"
  hipaa: "No aplicable (no tenemos clientes salud regulada actualmente)"
  iso_27001: "En proceso de certificación 2026"
  nda_default: "Sí, firmamos NDA antes de discovery profundo"
  dpa_disponible: true

corporate_partnerships:
  empresas_clientes_actuales: 9
  partner_types: ["fintech", "logística", "retail premium", "software B2B", "salud privada"]
  notable_clients: "Disponibles bajo NDA (algunos clientes públicos otros sanitizados en case studies)"
  msa_template_disponible: true
