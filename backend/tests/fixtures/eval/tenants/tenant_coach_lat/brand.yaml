# brand.yaml — tenant_coach_lat
# Tenant: Visionarias Coach — coaching de negocios y marketing para emprendedoras LatAm
# Inspiración: visionarias.lat (sitio público de Chris Tapia). Datos sintéticos plausibles.
# Dialect: es-PE | Currency: PEN

identity:
  brand_name: "Visionarias Coach"
  tagline: "Transforma tu expertise en un negocio que funciona sin ti"
  description: >
    Visionarias Coach acompaña a emprendedoras latinoamericanas a construir
    negocios rentables y sostenibles usando estrategias de marketing y ventas
    que respetan su estilo de vida. Más de 300 clientas en 12 países han
    transformado su expertise en ingresos predecibles desde 2019.
  industry: "coaching de negocios y marketing digital para mujeres emprendedoras"
  website: "https://visionarias.lat"
  founding_year: "2019"
  language: "es"
  timezone: "America/Lima"
  country_of_registration: "PE"
  legal_entity_type: "persona_natural"
  tax_regime: "RER"

strategy:
  methodology_name: "Sistema VISIONARIA"
  methodology_description: >
    Marco de 4 fases que lleva a la emprendedora desde claridad de oferta
    hasta ventas automatizadas con autenticidad. Integrado con el programa
    flagship "De Propósito a Prosperidad" (que añade 3 pilares de
    Liberar para Liderar: estrategia + neurociencia + propósito).
  methodology_pillars:
    - title: "Claridad"
      description: "Define tu nicho, cliente ideal y propuesta de valor única"
    - title: "Oferta"
      description: "Estructura una oferta irresistible con precios que reflejan tu valor"
    - title: "Atracción"
      description: "Crea contenido y comunidad que atrae clientas de forma orgánica"
    - title: "Conversión"
      description: "Sistemas de venta que convierten sin perseguir ni presionar"

story:
  origin: >
    Fundada en 2019 por una coach que después de 10 años en marketing
    corporativo (Backus, Alicorp) decidió llevar su conocimiento a las
    emprendedoras que más lo necesitaban: mujeres con gran expertise pero
    sin sistema para monetizarlo. La primera cohort fue de 8 alumnas en
    el sótano de una cafetería de Miraflores. Hoy son 300+ alumnas en 12
    países LatAm.
  mission: >
    Democratizar el acceso a estrategias de marketing y ventas de alto
    nivel para emprendedoras latinoamericanas — sin manipulación, sin
    presión, sin sacrificar bienestar.
  vision: >
    Un ecosistema donde cada mujer experta en LatAm pueda vivir de su
    conocimiento con dignidad, libertad financiera y alineación interna.
  founder_journey: >
    Ileana Tapia salió del corporativo el día que su jefe le dijo
    'no podés liderar marketing siendo madre'. Ese día decidió construir
    el espacio que ella habría querido tener. 7 años después, Visionarias
    Coach es referencia en coaching de negocios LatAm para mujeres.
  brand_evolution:
    - year: 2019
      milestone: "Lanzamiento — primera cohort 8 alumnas presencial Miraflores"
    - year: 2020
      milestone: "Pivot a 100% virtual durante pandemia, escala 3× audiencia"
    - year: 2022
      milestone: "Lanzamiento programa Sistema VISIONARIA (deprecated 2026 → reemplazado por De Propósito a Prosperidad)"
    - year: 2024
      milestone: "Co-facilitación con Camila Clausen integra neurociencia"
    - year: 2026
      milestone: "Lanzamiento De Propósito a Prosperidad (programa flagship refinado)"

positioning:
  unique_value_proposition: >
    La única metodología en LatAm diseñada específicamente para mujeres
    expertas que quieren vender sin perseguir clientes ni sacrificar su
    vida personal. Combina estrategia de marketing + neurociencia
    aplicada + liderazgo con propósito.
  brand_essence: "Libertad a través del expertise"
  discriminator: "Coaching de negocios con enfoque en bienestar somático y autenticidad — no hustle, no manipulación"
  competitor_landscape:
    direct_competitors: ["Marie Forleo (US)", "Amy Porterfield (US)", "Vilma Núñez (LatAm)"]
    differentiation: "Único programa LatAm que integra neurociencia clínica (Polyvagal Theory) con estrategia de marketing"
  ideal_customer_summary: "Emprendedora LatAm 28-45 años con expertise (consultora/coach/terapeuta/profesional autónoma) facturando 3-15k PEN/mes, estancada por falta de sistema o por bloqueos somáticos."

