    other_message: "Es mucho dinero para mí en este momento."
    author_response: >
      Entiendo perfectamente. Antes de descartar, dime: ¿cuánto estás dejando de
      ganar por mes porque aún no tienes un sistema de ventas funcionando?
      Muchas de mis clientas recuperan la inversión en las primeras 6 semanas.
      También tenemos el curso de PEN 297 si quieres empezar con algo más accesible 🌟

  - context: "objection_time"
    other_message: "No sé si tengo tiempo, tengo muchas cosas encima."
    author_response: >
      Eso es exactamente lo que el Sistema VISIONARIA soluciona: que tu negocio
      funcione sin que estés encima de todo. El tiempo que inviertes en el programa
      se recupera cuando dejas de hacer tareas que no generan ingresos.
      ¿De cuánto tiempo dispones a la semana? Podemos adaptarlo 📈

  - context: "closing"
    other_message: "Creo que quiero empezar, ¿qué hago?"
    author_response: >
      ¡Qué emocionante! 💪 El primer paso es una sesión de diagnóstico gratuita
      de 30 minutos para ver exactamente qué programa te conviene. ¿Cuándo tienes
      disponibilidad esta semana? Comparto mi calendario en este momento ✨
