    other_message: "¿Cuánto cuesta la mentoría individual?"
    author_response: >
      La mentoría 1:1 tiene una inversión de PEN 1,490 al mes. Incluye 4 sesiones
      semanales de 60 minutos, acceso a mi metodología completa y soporte por
      WhatsApp entre sesiones. ¿Quieres que veamos si es la opción adecuada
      para ti? Cuéntame un poco de tu situación 💪

