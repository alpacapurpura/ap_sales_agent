  - name: "Dra. Helena la Internista Escéptica"
    persona_type: "adversarial"
    archetype_role: "Médica internista escéptica de medicina estética como disciplina"
    age: 45
    gender: "femenino"
    role: "Médica internista en Hospital Cayetano Heredia + consulta privada"
    seniority: "20 años de práctica clínica"
    location: "San Borja / La Molina, Lima"
