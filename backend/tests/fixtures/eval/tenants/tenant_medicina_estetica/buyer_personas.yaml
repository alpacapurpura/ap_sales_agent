      - "Plan escrito post-consulta"
      - "Sin presión a cerrar venta el día de consulta"
      - "Reviews Google/IG verificables de pacientes similares"
      - "Cuotas tarjeta sin intereses"
      - "Política refund clara"

    sample_question_to_agent:
      - "¿La consulta L0 es realmente con médica titulada y no con cosmetóloga?"
      - "¿Tienen pacientes ejecutivas 35-40 años con tratamientos preventivos?"
      - "¿Puedo pagar el pack en cuotas con tarjeta sin intereses?"
      - "¿Cuál es la diferencia entre Pack Completo y Pack Premium en resultados reales?"
      - "¿Qué opinan de Cuponidad como alternativa para empezar barato?"

  # ─────────────────────────────────────────────────────────────
  - name: "Andrea Post-Parto"
    persona_type: "base"
    archetype_role: "Madre joven post-cesárea buscando recuperación corporal"
    age: 32
    gender: "femenino"
    role: "Diseñadora UX freelance (medio tiempo desde casa)"
    seniority: "8 años freelance, ahora reduce horas por hijo recién nacido"
    location: "Surco / Chacarilla, Lima"
    location_setting: "urbano residencial"
    income_range_pen: "4,500 - 7,000/mes (irregular freelance + apoyo esposo)"
    education: "Licenciada en Diseño Gráfico Toulouse Lautrec + cursos UX ENGIE"
    family_status: "Casada, hijo de 4 meses (segundo embarazo, primer post-parto fue normal el 2do cesárea)"
    work_setup: "Home office mientras lacta. Maneja proyectos en bloques de 2-3h"
    daily_schedule: "6am-22h con bebé. Trabajo 2-3h por día en bloques. Cero gym todavía."
    physical_state_post_partum: "4 meses post-cesárea. Lactando exclusiva. Cicatriz cerrada bien. Diástasis abdominal moderada. Flacidez gravitacional notoria."

    pain_points:
      - "Flacidez abdominal post-cesárea no recuperada"
      - "Diástasis abdominal le incomoda con ropa"
      - "Estrías púrpuras (recientes) que quiere atenuar"
      - "Sin tiempo para gym o nutricionista todavía"
      - "Presupuesto justo — esposo apoya pero no es ilimitado"
      - "Lactando — limita opciones (no botox, no algunos peelings)"

    objections:
      - text: "Estoy lactando, ¿puedo hacerme algo?"
        intensity: "muy alta"
        underlying_fear: "Hacer algo que afecte al bebé"
      - text: "PEN 2,500 es mucho cuando estoy con gastos de bebé"
        intensity: "alta"
        underlying_fear: "Sentirse egoísta por gastar en sí misma"
      - text: "¿Necesito esperar más tiempo post-parto?"
        intensity: "alta"
        underlying_fear: "Ir tarde si espera, ir temprano si no espera"
      - text: "¿Habrá resultados o estoy gastando en nada?"
        intensity: "media"
        underlying_fear: "Que la cirugía fuera realmente necesaria"

    desires:
      - "Recuperar tono abdominal sin pasar por cirugía"
      - "Sentirse cómoda con su cuerpo de nuevo"
      - "Plan de pago accesible (cuotas)"
      - "Saber qué es seguro durante lactancia"

    secret_concerns:
      - "Que la juzguen por priorizar 'estética' con bebé recién nacido"
      - "Que su pareja piense que 'no era tan importante'"
      - "Que el cuerpo no vuelva al 100% nunca"
      - "No tener tiempo de comprometerse a 10-16 sesiones con bebé"

    budget_range_pen: "PEN 2,000-4,500 con cuotas; cero pago único upfront grande"
    purchase_decision_speed: "lenta (4-8 semanas) — investiga seguridad lactancia + busca otras post-parto que pasaron"
    purchase_triggers:
      - "Diagnóstico corporal gratis con bioimpedancia"
      - "Confirmación clara de qué es seguro durante lactancia"
      - "Testimonio de otra mujer post-parto que recuperó tono sin cirugía"
      - "Plan en cuotas 6-12 meses sin intereses"
      - "Flexibilidad para reagendar si bebé enferma"

    preferred_channels:
      - channel: "Instagram"
        frequency: "diario corto (mientras lacta)"
        tone_preferred: "cálido + práctico + sin filtros excesivos"
      - channel: "WhatsApp"
        frequency: "respuesta intermitente entre lactancias"
        tone_preferred: "comprensivo de horarios irregulares"
      - channel: "TikTok"
        frequency: "consume contenido corto, no posta"

    aspirations:
      - "Volver a verse en el espejo y sentirse cómoda"
      - "Tener cuerpo funcional + estético sin pasar por bisturí"
      - "Eventualmente integrar gym + alimentación cuando bebé crezca"

    objections_to_aggressive_treatments: "alta por estado lactancia"

    buyer_journey:
      awareness: "Busca grupos Facebook 'Mamis post-parto Lima' + IG hashtags #postpartoperu"
      consideration: "Compara opciones — gym + nutricionista vs aparatología + nutricionista. Pregunta a 5-6 amigas. Visita 2 clínicas."
      decision: "Decide por Lumina si: (a) Doctora confirma seguridad lactancia, (b) plan en cuotas accesible, (c) reagendamiento flexible"
      retention: "Si Pack L3 funciona, prob upgrade a Plan Premium L4 cuando deje de lactar"

    likely_offer_path: "L0 → L3 Pack Zona Simple (abdomen, 6 sesiones) en 12 cuotas → L4 Premium en 8 meses"
    likely_LTV_pen: 5500

    evaluation_criteria_for_purchase:
      - "Confirmación seguridad lactancia documentada"
      - "Cuotas 12 meses sin intereses"
      - "Política reagendamiento flexible (bebé enferma, etc.)"
      - "Bioimpedancia + foto-control objetivos"
      - "Testimonios de post-parto verificables"

    sample_question_to_agent:
      - "Estoy lactando, ¿qué tratamientos son seguros?"
      - "¿Tienen pacientes post-cesárea? ¿Cuánto demoraron en recuperar tono?"
      - "¿Puedo pagar en 12 cuotas con tarjeta del BCP?"
      - "Si mi bebé enferma y no puedo ir, ¿pierdo la sesión?"
      - "¿HIFU vs radiofrecuencia para post-parto?"

