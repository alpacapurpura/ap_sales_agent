    family_status: "Casada con cardiólogo, tres hijos adolescentes"
    work_setup: "Hospital 3 días + consulta privada 2 días"
    daily_schedule: "6am-19h. Cero tiempo redes sociales. Lee literatura médica en commute."

    pain_points:
      - "Notó signos de envejecimiento facial significativos a los 45 (se 'vio' de repente en fotos)"
      - "Como médica, le incomoda admitir que le importa el aspecto"
      - "Desconfía profundamente del 'mundo medicina estética' como pseudociencia"
      - "Sus colegas hospitalarios verían mal que fuera a una clínica estética"
      - "Tiene presupuesto pero solo invertirá en cosa con base científica documentada"

    objections:
      - text: "La medicina estética no tiene rigor de medicina interna real"
        intensity: "muy alta"
        underlying_fear: "Validar profesión 'menor' que la suya"
      - text: "El botox es una neurotoxina aplicada cosméticamente — riesgo/beneficio cuestionable"
        intensity: "muy alta"
        underlying_fear: "Reputación profesional si tiene complicación"
      - text: "Las pacientes 'compran' resultados sin entender los mecanismos"
        intensity: "alta"
        underlying_fear: "Que la consideren 'crédula'"
      - text: "Los 'doctores' de medicina estética no tienen rigor formativo"
        intensity: "muy alta"
        underlying_fear: "Inferiorización de su criterio clínico"
      - text: "Una internista no debería 'caer' en estética"
        intensity: "muy alta"
        underlying_fear: "Pérdida de autoridad profesional"
      - text: "El HIFU/radiofrecuencia tiene poca evidencia clínica robusta"
        intensity: "alta"
        underlying_fear: "Pagar por placebo tecnológico"

    desires:
      - "Verse acorde a su edad sin verse 'trabajada'"
      - "Acceder a opciones validadas científicamente"
      - "Mantener anonimato profesional (no posteo IG, no testimonios)"
      - "Ser tratada como par profesional, no como paciente común"

    secret_concerns:
      - "Que sus pacientes la vean cambiada y dejen de respetarla"
      - "Que sus residentes médicas la juzguen"
      - "Verse 'falsa' como criterio de descarte"
      - "Empezar y necesitar mantenimiento de por vida"
      - "Pagar caro por algo que ella misma podría haber hecho con conocimiento"

    budget_range_pen: "Tiene presupuesto (PEN 5,000+ tranquila) pero exige justificación clínica robusta"
    purchase_decision_speed: "muy lenta + adversarial (3-6 meses con varias visitas)"
    purchase_triggers:
      - "Médica titular con credenciales formales (residencia + fellowship)"
      - "Discusión técnica entre pares (peer-to-peer, no paciente-doctora)"
      - "Citas literatura indexada (PubMed) para evidencia tratamientos"
      - "Política anti-sobreventa documentada (no le venden lo que no necesita)"
      - "Confidencialidad — sin fotos en redes ni en pared del consultorio"

    adversarial_notes: |
      Esta persona es altamente desafiante. Útil para evaluar:
        - Manejo de escepticismo profesional sin defensiveness
        - Capacidad de hablar peer-to-peer médico-médico (no paciente-doctora)
        - Conocimiento real de literatura clínica vs marketing
        - Honestidad sobre limitaciones de tratamientos
        - Capacidad de NO vender cuando no es ético
        - Confidencialidad y anonimato

      Reacciona MAL a:
        - Lenguaje motivacional/marketing
        - Promesas dramáticas
        - Falta de credenciales formales en facilitadores
        - Ausencia de citas a literatura clínica
        - Testimonios con números no contextualizados
        - Pasiveness ante objeciones (espera debate técnico real)

      Reacciona BIEN a:
        - Honestidad sobre límites (HIFU NO reemplaza cirugía severa)
        - Citas literatura indexada (Polyvagal Theory papers, FDA approvals)
        - Discusión técnica de mecanismos (apoptosis adipocitos, contracción colágeno)
        - Anti-sobreventa explícito
        - Reconocimiento de diferentes estándares medicina interna vs estética

    preferred_channels:
      - channel: "Email"
        frequency: "lee selectivamente"
        tone_preferred: "técnico, long-form, basado en evidencia"
      - channel: "WhatsApp"
        frequency: "evita — prefiere email"
        tone_preferred: "rara vez"
      - channel: "Instagram"
        frequency: "no usa profesionalmente"

    objections_to_aesthetic_medicine_field: "muy alta — escepticismo activo del field"

    buyer_journey:
      awareness: "Recomendación de colega cardióloga que se hizo HIFU + Sandwich generation pressure"
      consideration: "Investiga Sociedad Mexicana Medicina Estética + lee papers en JAMA Dermatology + visita Lumina + 1-2 alternativas premium"
      decision: "Agenda L0 con Sofía con 6 preguntas técnicas pre-formuladas. Si Sofía maneja peer-to-peer, considera. Si no, descarta."
      retention: "Si convence, prob L4 VIP por discreción + acceso directo + único punto de contacto"

    likely_offer_path: "L0 (técnica) → posiblemente L4 VIP directo si convence (saltea L1/L2/L3 packs)"
    likely_LTV_pen: 22000

    evaluation_criteria_for_purchase:
      - "Credenciales formales facilitadora (residencia + fellowship, no diploma fin-de-semana)"
      - "Manejo de discusión técnica peer-to-peer"
      - "Citas literatura indexada en respuestas"
      - "Política anti-sobreventa real demostrable"
      - "Confidencialidad absoluta"
      - "Tecnología FDA/INVIMA aprobada"
      - "Médica titulada en aplicaciones (no técnica)"

    sample_question_to_agent:
      - "¿Qué evidencia clínica indexada hay para HIFU corporal en flacidez moderada?"
      - "¿Sofía Mendoza tiene fellowship formal o es diplomado fin-de-semana?"
      - "¿Cuál es la incidencia real de complicaciones con botox de Allergan?"
      - "¿Por qué su clínica se llama 'estética' y no 'dermatología cosmética' (más serio)?"
      - "¿Aceptan pacientes que NO quieren ser tratadas como paciente común sino como pares profesionales?"
      - "¿Tienen política de confidencialidad (sin fotos en redes) para profesionales públicos?"
      - "¿Qué opinan del enfoque de medicina interna que prioriza intervenciones con NNT bajo?"
