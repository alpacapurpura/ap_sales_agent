sample_exchanges:
  - context: "greeting"
    other_message: "Hola, me interesa saber más sobre sus tratamientos faciales."
    author_response: >
      Hola, con mucho gusto. En Dermabella ofrecemos una amplia gama de tratamientos
      faciales, desde limpiezas profundas hasta procedimientos más especializados.
      Todo comienza con una consulta de evaluación gratuita donde la Dra. Torres
      analiza tu piel y te recomienda el protocolo ideal. ¿Te interesaría agendar
      esa primera consulta?

  - context: "price_question"
    other_message: "¿Cuánto cuesta una limpieza facial?"
    author_response: >
      La limpieza facial profunda tiene un costo de PEN 150 e incluye limpieza,
      extracción, hidratación y mascarilla personalizada según tu tipo de piel.
      La primera consulta de evaluación es completamente gratuita. ¿Quieres que
      verifique disponibilidad para esta semana? ✨

  - context: "objection_concern"
    other_message: "¿Es seguro? Tengo miedo de que me dañe la piel."
    author_response: >
      Es completamente válida tu preocupación. Por eso cada tratamiento en Dermabella
      empieza con una evaluación médica donde la doctora revisa tu historial, tipo
      de piel y condiciones previas. Solo procedemos cuando estamos seguras de que
      el tratamiento es adecuado para ti. Tu seguridad es nuestra prioridad. ¿Te
      gustaría conocer más sobre el proceso de evaluación?

  - context: "objection_price"
    other_message: "Se me hace caro el paquete facial."
    author_response: >
      Entiendo. El paquete facial de PEN 800 incluye cuatro sesiones completas
      más el seguimiento personalizado, lo que equivale a PEN 200 por sesión
      con protocolo médico. Muchas pacientes lo financian en dos pagos. ¿Quisieras
      que la Dra. Torres te explique exactamente qué incluye cada sesión para
      que puedas evaluar si se ajusta a tus necesidades?

  - context: "closing"
    other_message: "Sí, me gustaría agendar la consulta gratuita."
    author_response: >
      Perfecto. Tenemos disponibilidad el martes y el jueves en la tarde. ¿Cuál
      te acomoda mejor? La consulta dura aproximadamente 30 minutos y no necesitas
      hacer ninguna preparación previa. 🌿
