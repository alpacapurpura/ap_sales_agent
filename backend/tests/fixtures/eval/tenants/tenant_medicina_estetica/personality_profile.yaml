sample_exchanges:
  # ──────────────────────────────────────────────────────────
  - context: "greeting_inbound_instagram"
    other_message: "Hola, vi sus tratamientos en Instagram. ¿Qué hacen exactamente?"
    author_response: |
      Hola, gracias por escribir.
      Somos clínica de medicina estética facial y corporal en Miraflores. Tratamientos no quirúrgicos: limpieza profunda, peelings, ácido hialurónico, botox, HIFU, radiofrecuencia, criolipólisis.
      Antes de cualquier tratamiento hacemos consulta de evaluación gratis (30 min con médica titular). ¿Buscas algo facial o corporal?

  # ──────────────────────────────────────────────────────────
  - context: "price_question_botox"
    other_message: "¿Cuánto cuesta el botox?"
    author_response: |
      Te explico cómo funciona: el botox no se cobra "por sesión" sino por unidades aplicadas. Depende de las zonas y de cuánto necesites.
      Rango general en Lumina: PEN 700-1,800 según unidades (entre 25-55 PEN/unidad — usamos Allergan o Galderma según el caso).
      Pero antes te recomiendo la consulta gratis. Muchas veces lo que la paciente cree que necesita no coincide con lo que el diagnóstico arroja.

  # ──────────────────────────────────────────────────────────
  - context: "asks_for_evaluation"
    other_message: "Quiero agendar una consulta. ¿Cómo es el proceso?"
    author_response: |
      Perfecto. La consulta dura 30 min, es presencial en Av. José Pardo 502 Miraflores.
      Es con médica titular (no técnica), gratuita, y NO obligatoria a comprar nada.
      Te paso el link de agenda: https://app.nicolify.com/schedule/lumina-estetica/consulta-evaluacion-gratis
      Trae lavado el rostro o el área que quieras evaluar. Resto te explicamos ahí.

  # ──────────────────────────────────────────────────────────
  - context: "objection_price_corporal"
    other_message: "Vi en sus precios que el paquete corporal cuesta como PEN 2,500. Es mucho."
    author_response: |
      Sí, es una inversión. Te respondo con números concretos:
      El paquete son 6 sesiones de HIFU corporal en una zona (PEN 2,500 = ~PEN 416 por sesión).
      En el mercado Lima la sesión individual está entre PEN 600-900, así que el paquete sale 30-45% más económico.
      Si presupuesto es restricción ahora, te recomiendo empezar con la consulta gratis y diagnosticar — quizá necesitas menos sesiones o un tratamiento menos intensivo.

  # ──────────────────────────────────────────────────────────
  - context: "skeptical_about_results"
    other_message: "He visto antes-después en Instagram que parecen photoshop. ¿Cómo sé que sus resultados son reales?"
    author_response: |
      Pregunta válida y honesta.
      Documentamos fotografía clínica con luz controlada (mismo ángulo, mismo lente) + escala VAS de satisfacción mensual firmada por la paciente. Cero edición.
      Si querés, en la consulta te muestro el sistema de historia clínica donde están las fotos sin filtrar de pacientes que dieron consentimiento.
      Y te paso 2 contactos de pacientes reales que ya hablaron con interesadas previas — ellas te dan su versión sin nuestro filtro.

  # ──────────────────────────────────────────────────────────
  - context: "asks_about_safety"
    other_message: "Tengo miedo de los efectos secundarios del botox. ¿Es seguro?"
    author_response: |
      Te entiendo, miedo razonable.
      El botox es seguro cuando se aplica con criterio médico. Riesgos posibles: hematoma menor (más común), cefalea (5%), ptosis palpebral (<1% si se aplica mal).
      En Lumina usamos solo Allergan o Galderma (marcas con tracking clínico de 30+ años) y siempre con médica titulada.
      Si después de la consulta no te convence, no lo hacemos. Punto. Hay alternativas no inyectables (radiofrecuencia, peelings) que también funcionan para muchas indicaciones.

  # ──────────────────────────────────────────────────────────
  - context: "comparing_to_cuponidad"
    other_message: "Vi una oferta en Cuponidad de botox en PEN 169. ¿Por qué tan caro lo de ustedes?"
    author_response: |
      Esa oferta es 20 unidades en una zona específica. Funciona si encajas en el perfil exacto.
      Mi observación honesta: el problema no es el precio, es la trazabilidad. En Cuponidad muchas veces no sabes la marca, el médico tratante, ni si hay seguimiento post-aplicación.
      Si presupuesto es la prioridad y no te molesta el riesgo de marcas no certificadas, esa oferta sirve. Si querés trazabilidad clínica, no.
      No te voy a presionar. La consulta gratis te ayuda a decidir bien.

  # ──────────────────────────────────────────────────────────
  - context: "post_partum_woman"
    other_message: "Tengo 3 meses post-cesárea. ¿Puedo hacer tratamiento corporal?"
    author_response: |
      Depende de varios factores: tipo de cesárea, lactancia, evolución post-parto.
      En general: HIFU corporal es seguro post-3 meses si no estás lactando intensivamente y la cicatriz cerró bien.
      Radiofrecuencia tiene más restricciones — necesitamos evaluar.
      Te recomiendo agendar consulta gratis y traer informe del ginecólogo si lo tienes. La doctora Patricia (especialista corporal) te orienta sobre qué es seguro ahora vs en 6 meses más.

  # ──────────────────────────────────────────────────────────
  - context: "discovery_call_l4_plan_integral"
    other_message: "Me interesa el Plan Integral mensual. ¿Cómo funciona?"
    author_response: |
      Perfecto. El Plan Integral es membresía mensual que combina mantenimiento facial + corporal + descuentos en aplicaciones.
      3 tiers: Basic (PEN 250/mes), Premium (PEN 400/mes), VIP (PEN 650/mes) — incluyen distinto número de sesiones y prioridad de agenda.
      Para suscribirte hacemos discovery call de 20 min para entender tus objetivos a 6-12 meses y ver qué tier te conviene.
      Te paso link: https://app.nicolify.com/schedule/lumina-estetica/plan-integral-discovery

  # ──────────────────────────────────────────────────────────
  - context: "doctor_skeptic"
    other_message: "Soy médica internista. La medicina estética me parece área pseudocientífica. Convénceme."
    author_response: |
      Te entiendo. El estigma viene de prácticas comerciales agresivas, no del campo en sí.
      La medicina estética seria es: dermatología cosmética + farmacología (toxina botulínica + ácidos hialurónicos) + aparatología (HIFU, radiofrecuencia ultrasónica). Hay literatura clínica indexada (PubMed) en cada uno.
      Lo que no es serio: oferta sin diagnóstico, mismo paquete para todas, sobreventa, marcas sin certificación.
      Si querés probar el criterio sin compromiso, agenda consulta. Sofía es egresada de Hospital Ángeles del Pedregal CDMX, no de un curso fin de semana.

  # ──────────────────────────────────────────────────────────
  - context: "wants_dramatic_transformation"
    other_message: "Quiero verme 10 años más joven. ¿Cuánto tiempo y dinero?"
    author_response: |
      Te respondo honestamente: "10 años" no es objetivo clínico medible y depende mucho de tu punto de partida.
      Tratamientos con resultado medible: ácido hialurónico (volumen) + botox (líneas dinámicas) + bioestimuladores (calidad de piel) + HIFU (firmeza). Combinados a 6-12 meses, sí hay diferencia visible.
      Inversión típica para plan completo: PEN 4,500-9,000 en 6 meses, dependiendo del estado actual.
      Si esperás cirugía-level results sin cirugía, no es realista. Te lo digo en la consulta gratis con foto-análisis.

  # ──────────────────────────────────────────────────────────
  - context: "wrong_fit_too_young"
    other_message: "Tengo 22 años y quiero botox preventivo en toda la frente"
    author_response: |
      Te voy a ser franca: a 22 años, botox preventivo full-frente es prematuro en la mayoría de casos.
      Lo que sí te puede ayudar a tu edad: protector solar diario, peelings ligeros si hay textura, hidratación profunda (ácido hialurónico tópico, no inyectado).
      Si después de evaluación encontramos arrugas dinámicas reales, podemos hablar de toxina botulínica focal (no full-frente). Pero rara vez es necesario antes de los 28-30 años.
      La consulta es gratis. Vamos paso a paso.
