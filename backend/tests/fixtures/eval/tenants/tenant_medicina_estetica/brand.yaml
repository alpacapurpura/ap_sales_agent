identity:
  brand_name: "Lumina Estética"
  tagline: "Medicina estética con criterio médico — resultados reales, sin promesas vacías"
  description: >
    Lumina Estética es una clínica de medicina estética facial y corporal
    ubicada en Miraflores, Lima. Liderada por la Dra. Sofía Mendoza
    (cirujana general con especialización en estética en México 2016-2020),
    el equipo de 4 médicas combina tecnología de última generación con
    enfoque ético. Sin sobreventa de tratamientos. Más de 1,200 pacientes
    atendidas desde 2021.
  industry: "medicina estética facial y corporal con criterio médico"
  website: "https://lumina-estetica.pe"
  founding_year: "2021"
  language: "es"
  timezone: "America/Lima"
  country_of_registration: "PE"
  legal_entity_type: "sociedad_comercial_responsabilidad_limitada"
  tax_regime: "RG"
  ruc_label: "20XXXXXXXXX (RUC SRL)"
  registered_address: "Av. José Pardo 502, Miraflores, Lima 18, Perú"
  certificaciones_sanitarias:
    - "Categorización DIRESA Lima — Centro Médico de Atención Ambulatoria nivel I-3"
    - "Registro Sanitario equipos médicos DIGEMID"
    - "Inscripción Colegio Médico del Perú (CMP) — todas las médicas"

strategy:
  methodology_name: "Protocolo Lumina"
  methodology_description: >
    Protocolo en 4 fases que garantiza tratamientos personalizados,
    progresivos y con seguimiento clínico. Diferencial: cero
    sobreventa — la consulta inicial NO empuja paquetes upfront.
  methodology_pillars:
    - title: "Diagnóstico clínico"
      description: "Evaluación dermatológica completa + análisis de fotografía digital + plan a 6-12 meses"
    - title: "Tratamiento progresivo"
      description: "Empezamos con lo más conservador. Si no funciona, escalamos. Nunca al revés."
    - title: "Seguimiento medible"
      description: "Cada paciente tiene foto-control mensual y escala VAS satisfacción documentada"
    - title: "Mantenimiento sostenible"
      description: "Plan integral mensual para sostener resultados sin sobre-tratamiento"

story:
  origin: >
    Dra. Sofía Mendoza estudió medicina en la UPCH de Lima, hizo
    residencia de cirugía general en el Hospital Cayetano Heredia
    (2014-2016) y posteriormente especialización de 4 años en medicina
    estética y dermatología cosmética en el Hospital Ángeles del Pedregal,
    Ciudad de México (2016-2020). Regresó a Lima en 2021 con la idea de
    abrir una clínica que combine criterio médico riguroso con tecnología
    moderna — sin las prácticas comerciales agresivas que vio en otras
    clínicas durante su formación.
  mission: >
    Hacer accesible la medicina estética con criterio clínico real para
    mujeres limeñas — sin sobreventa, sin promesas inflated, con
    seguimiento medible.
  vision: >
    Ser la referencia ética en medicina estética en Lima para mujeres
    profesionales que valoran transparencia y resultado clínico
    sobre marketing agresivo.
  founder_journey: >
    Sofía vio durante su residencia en Ciudad de México prácticas de
    sobreventa que la incomodaban. Decidió abrir una clínica donde la
    consulta inicial fuera gratuita y nunca obligatoria a comprar.
    En 2021 abrió Lumina con 1 box. Hoy son 4 boxes + equipo de 4 médicas
    + 2 técnicas en aparatología.
  brand_evolution:
    - year: 2021
      milestone: "Apertura — 1 box, solo Sofía + asistente. Tratamientos faciales únicamente."
    - year: 2022
      milestone: "Incorporación segunda médica + ampliación a tratamientos corporales (radiofrecuencia)"
    - year: 2023
      milestone: "Ampliación a 3 boxes + adquisición equipo HIFU + integración criolipólisis"
    - year: 2024
      milestone: "Integración módulo dermatología clínica (consultas oncológicas dermatológicas referidas)"
    - year: 2025
      milestone: "1,200 pacientes atendidas. Net Promoter Score 78."
    - year: 2026
      milestone: "Expansión a 4 boxes + lanzamiento Plan Integral mensual recurrente"

positioning:
  unique_value_proposition: >
    La única clínica de medicina estética en Lima con consulta inicial
    100% gratuita, sin obligación de compra, con criterio médico
    documentado en historia clínica electrónica y seguimiento foto-VAS
    mensual. Sin sobreventa.
  brand_essence: "Belleza con criterio médico"
  discriminator: "Consulta gratuita real (30 min con médica titular, no con técnica) + cero sobreventa documentada (ofrecemos siempre la opción más conservadora primero)"
  competitor_landscape:
    direct_competitors:
      - "Piel Bella (Lima — referente establecido)"
      - "Clínica Chávarri (líder en láser)"
      - "Elyzea Miraflores (rango premium)"
      - "Medi Esthetic"
    differentiation: "Único centro con política documentada anti-sobreventa + médica titular en consulta inicial gratuita"
  ideal_customer_summary: "Mujer limeña 32-50 años, profesional con ingresos PEN 4-15k/mes, busca tratamientos médicos estéticos preventivos o correctivos con criterio clínico real (no oferta de cuponidad)."

