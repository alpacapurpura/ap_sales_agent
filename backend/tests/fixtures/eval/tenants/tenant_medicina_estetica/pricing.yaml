# ─────────────────────────────────────────────────────────────
# Refund matrix
# ─────────────────────────────────────────────────────────────
refund_matrix:
  L0:
    has_guarantee: false
    notes: "Servicio gratuito"
  L1:
    has_guarantee: false
    period_days: 0
    notes: "Servicio único, sin reembolso post-procedimiento"
  L2:
    has_guarantee: "partial"
    period_days: 60
    refund_pct: 90
    conditions: "Reembolso de sesiones no consumidas (descuento 10% administrativo). Aplica todos los packs L2."
  L3:
    has_guarantee: "partial"
    period_days: 90
    refund_pct: 90
    conditions: "Idem L2. Si tras 60% del pack no hay cambio medible, sesiones extra incluidas sin costo (no reembolso adicional)."
  L4:
    has_guarantee: "trial_3_meses"
    period_days: 90
    refund_pct: 0
    conditions: "Compromiso 3 meses. Después cancela libre con 30d aviso. Sin reembolso de meses pagados."

# ─────────────────────────────────────────────────────────────
# Política anti-sobreventa pricing-related
# ─────────────────────────────────────────────────────────────
pricing_philosophy: |
  Precios alineados con benchmarks Lima 2026:
    - Botox: rango 25-55 PEN/unidad (consultable por zona)
    - Ácido hialurónico: PEN 720-950/jeringa (Restylane / Juvederm)
    - HIFU corporal: PEN 600-900/sesión individual o PEN 416-425 con paquete L3
    - Limpieza facial: PEN 150 (rango Lima 130-180)

  Filosofía:
  - NO hay "descuentos secretos" negociados 1:1 fuera de los descuentos publicados
  - Cuotas sin intereses con tarjeta peruana 3/6/12 según monto
  - Anti-sobreventa: paquetes solo si justificado por evidencia clínica, no como upsell genérico
  - Becas: NO ofrecemos becas por ser servicio médico (precio refleja costo + criterio)
  - Precios diferenciados nacionales: NO inflamos para extranjeras

# ─────────────────────────────────────────────────────────────
# Tax / facturación
# ─────────────────────────────────────────────────────────────
invoicing:
  emite_boleta: true
  emite_factura: true
  factura_requires_ruc: true
  empresa_legal: "Lumina Estética SRL (RUC 20XXXXXXXXX, Régimen General)"
  recibo_por_honorarios_disponible: false
  notes: "Procedimientos médicos están gravados. Solicitar comprobante en recepción al hacer pago."

corporate_options:
  empresas_convenio: true
  notes: "Tenemos convenio con 12 empresas Lima (BCP, Interbank, Coca-Cola Andina) — empleadas reciben 15% off. Consultar con tu RRHH."
