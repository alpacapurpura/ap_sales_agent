# pricing.yaml — tenant_medicina_estetica
# Currency: PEN. Q3 ratificado single-currency seed.
# Benchmarks reales Lima 2026 (botox 25-55 PEN/unidad, HIFU 600-900 sesión, etc.)
#
# Cobertura T-4: payment plans completos + refund matrix + facturación PE + cuotas tarjeta.

currency: PEN
country: PE
tax_regime: "RG"
tax_id_label: "RUC"
issues_invoice: true
invoice_types: ["boleta", "factura", "ticket_plus"]

payment_methods:
  - method: "yape"
    label: "Yape"
    fees: "0%"
    settlement_time: "instantáneo"
    notes: "Solo Perú. Disponible para pago único de servicios."
  - method: "plin"
    label: "Plin"
    fees: "0%"
    settlement_time: "instantáneo"
    notes: "Solo Perú."
  - method: "transferencia_bancaria"
    label: "Transferencia bancaria"
    accepted_banks: ["BCP", "Interbank", "BBVA", "Scotiabank"]
    fees: "0%"
    settlement_time: "1-2 días hábiles"
    notes: "Para paquetes (L2/L3) y mensualidades Plan Integral aceptamos transferencia."
  - method: "tarjeta_credito_debito"
    label: "Tarjeta crédito/débito (Visa, Mastercard, Amex)"
    processor: "Niubiz POS + Culqi online"
    fees: "incluidas en precio"
    settlement_time: "instantáneo"
    cuotas_sin_intereses: "Disponible 3, 6 y 12 cuotas en BCP, Interbank, BBVA, Scotiabank, Banbif para tarjetas peruanas"
    chargeback_policy: "Sin reembolso post-aplicación de tratamiento. Reembolso solo en sesiones no consumidas de paquete activo (descontando descuento de pack)."
  - method: "tarjeta_recurrente_membresia"
    label: "Tarjeta recurrente (Plan Integral mensual)"
    processor: "Culqi suscripciones"
    notes: "Cobro automático mensual el día 1 de cada mes. Email confirmación + pre-aviso 3 días antes."

