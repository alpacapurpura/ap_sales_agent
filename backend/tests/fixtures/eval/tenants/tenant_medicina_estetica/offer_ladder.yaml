# ─────────────────────────────────────────────────────────────
# Política anti-sobreventa documentada (diferencial competitivo)
# ─────────────────────────────────────────────────────────────
anti_sobreventa_policy: |
  En consulta inicial L0, el médico/médica:
  1. Presenta SIEMPRE la opción más conservadora primero
  2. Documenta en historia clínica el tratamiento ofrecido + el alternativo conservador
  3. Si paciente insiste en tratamiento más agresivo del recomendado, lo registra como "tratamiento solicitado por paciente fuera de recomendación clínica"
  4. NUNCA cierra venta en consulta L0 — siempre 24-48h de espera entre evaluación y compra
  5. Si recomienda paquete (L2/L3), justifica número de sesiones por evidencia clínica
