key_messages:
  - "Belleza con criterio médico"
  - "Consulta gratis sin gancho"
  - "Anti-sobreventa documentada"
  - "Empezamos con lo más conservador"
  - "Foto-control objetivo, no marketing"
  - "Médica titulada, no técnica"

tone_of_voice:
  description: "Profesional, clara, empática sin ser empalagosa. Anti-sobreventa explícito. Voz mexicana neutral."
  do:
    - "Acknowledge antes de bridge"
    - "Real numbers en pricing"
    - "Citar evidencia clínica cuando aplica"
    - "Recomendar opción más conservadora primero"
  dont:
    - "Promesas dramáticas '10 años menos'"
    - "Lenguaje motivacional vacío"
    - "Antes-después sin contexto"
    - "Presión de venta day-of consulta"

lead_magnet:
  title: "Consulta de evaluación gratuita"
  format: "30 min presencial con médica titulada"
  delivery_method: "Booking online via Nicolify scheduling"
  opt_in_page: "https://lumina-estetica.pe/consulta-gratis"

# ─────────────────────────────────────────────────────────────
# Nicolify scheduling integration (clon-Calendly)
# ─────────────────────────────────────────────────────────────
scheduling:
  provider: "Nicolify scheduling (clon-Calendly built-in)"
  event_types:
    - id: "scheduling_evt_a2_l0_consulta_gratis"
      name: "Consulta evaluación facial/corporal gratuita"
      duration_minutes: 30
      offer_level: "L0"
      facilitator: "Dra. Sofía / Dra. Patricia / Dra. Camila (rotación)"
      booking_url: "https://app.nicolify.com/schedule/lumina-estetica/consulta-evaluacion-gratis"
      pre_booking_questions:
        - "¿Buscas evaluación facial o corporal (o ambas)?"
        - "¿Tratamientos previos médicos estéticos? (Sí/No)"
        - "¿Estás embarazada o lactando?"
        - "¿Algún medicamento o alergia relevante?"
      capacity_per_week: 40
      timezone_default: "America/Lima"
      modality: "presencial"
      address: "Av. José Pardo 502, Miraflores"

    - id: "scheduling_evt_a2_l1_limpieza"
      name: "Limpieza facial profunda Lumina"
      duration_minutes: 75
      offer_level: "L1"
      facilitator: "Lic. Andrea Quispe (cosmetóloga)"
      booking_url: "https://app.nicolify.com/schedule/lumina-estetica/limpieza-facial"
      capacity_per_week: 25
      timezone_default: "America/Lima"

    - id: "scheduling_evt_a2_l2_pack_facial"
      name: "Pack facial intensivo (sesión inicial)"
      duration_minutes: 90
      offer_level: "L2"
      facilitator: "Cosmetóloga + médica si aplica"
      booking_url: "https://app.nicolify.com/schedule/lumina-estetica/pack-facial"
      requires_l0_first: true

    - id: "scheduling_evt_a2_l3_diagnostico_corporal"
      name: "Diagnóstico corporal HIFU/RF gratis"
      duration_minutes: 30
      offer_level: "L3"
      facilitator: "Dra. Patricia Rivas"
      booking_url: "https://app.nicolify.com/schedule/lumina-estetica/diagnostico-corporal"
      pre_booking_questions:
        - "¿Cuál es el área principal a evaluar?"
        - "¿Estás embarazada o lactando?"
        - "¿Cirugías recientes o cesárea? Cuándo."
        - "¿Marcapasos o implantes metálicos?"
      capacity_per_week: 15
      includes_bioimpedancia: true

    - id: "scheduling_evt_a2_l4_plan_integral"
      name: "Discovery call Plan Integral"
      duration_minutes: 20
      offer_level: "L4"
      facilitator: "Dra. Sofía Mendoza"
      booking_url: "https://app.nicolify.com/schedule/lumina-estetica/plan-integral-discovery"
      capacity_per_week: 10

# ─────────────────────────────────────────────────────────────
# Channel-specific messaging
# ─────────────────────────────────────────────────────────────
channel_specific_messaging:
  whatsapp:
    avg_response_time_hours: 2
    avg_message_length: "1-3 frases por mensaje, multi-msg si requiere"
    auto_reply_after_hours: "Hola, gracias por escribir. Respondemos lunes-viernes 9-19h, sábados 9-13h. Si urge, agenda consulta gratis: https://lumina-estetica.pe/consulta-gratis"
    business_hours: "Lunes-Viernes 9:00-19:00 / Sábados 9:00-13:00 hora Perú"
  instagram_dm:
    avg_response_time_hours: 4
    common_inbound_intents:
      - "Pregunta de precios botox/hialurónico"
      - "Pregunta sobre tratamiento corporal post-parto"
      - "Solicitud de testimonios"
      - "Comparación con Cuponidad/competencia"
      - "Pedido de consulta"
      - "Embarazo/lactancia — qué es seguro"
    initial_response_template: "Saludo + qualifying clínico ('facial o corporal? lactando?') + bridge a consulta L0 gratis"
  email:
    avg_response_time_hours: 24
    long_form_ok: true
    common_inbound_intents:
      - "Convenios corporativos B2B"
      - "Consulta técnica para profesionales (médicos, dermatólogos)"
      - "Solicitudes de prensa/medios"

