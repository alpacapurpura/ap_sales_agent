  - persona: "Verónica, 42 años, profesora (Plan Familiar 4 personas)"
    quote: "El plan familiar nos cubre a los 4 — yo, mi esposo, los dos hijos. Pago PEN 280/mes y todos vamos cada 6 meses sin sustos en la factura."
