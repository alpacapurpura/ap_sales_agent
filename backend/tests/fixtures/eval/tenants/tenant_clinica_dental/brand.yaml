  - persona: "Jorge, 28 años, abogado (implante unitario)"
    quote: "Me cotizaron implante en S/ 5,500 en otra clínica. Aquí me lo hicieron en S/ 4,200 con misma marca de implante (Straumann). 6 meses después está perfecto."
