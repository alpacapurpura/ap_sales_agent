strategy:
  methodology_name: "Plan Sonrisa Plena"
  methodology_description: >
    Metodología en 3 fases que prioriza prevención, claridad de costos y
    planes financieros realistas. Cero sorpresas en factura.
  methodology_pillars:
    - title: "Prevención primero"
      description: "Detectamos antes de tratar. Primera consulta gratis con radiografía panorámica + plan escrito."
    - title: "Transparencia total"
      description: "Cada tratamiento con costo desglosado upfront. Sin 'cargos adicionales' sorpresa al finalizar."
    - title: "Financiamiento realista"
      description: "Cuotas sin intereses con tarjeta peruana + plan de pago directo si no tienes tarjeta."

story:
  origin: >
    Dr. Andrés Restrepo estudió odontología en la Universidad Nacional de
    Colombia (Bogotá, 2010-2015). Trabajó 3 años en clínica privada en
    Bogotá especializándose en estética dental. En 2018 viajó a Lima para
    cursar maestría en Odontología Estética en la Universidad Peruana
    Cayetano Heredia (2018-2020). Se quedó en Lima por trabajo y por su
    pareja peruana. Abrió Sonrisa Plena en marzo 2020 — justo antes de
    pandemia, lo que retrasó arranque pero fortaleció protocolos
    bioseguridad.
  mission: >
    Hacer accesible la odontología de calidad en Lima — sin sobreventa,
    con financiamiento realista para profesionales y familias clase media.
  vision: >
    Ser referencia en odontología transparente en Lima Metropolitana,
    con expansión a 3 sedes (Miraflores + 2 más) hacia 2028.
  founder_journey: >
    Andrés vio durante su práctica en Bogotá clínicas con prácticas
    comerciales agresivas (sobreventa de carillas a pacientes que no las
    necesitaban, cobros adicionales no informados). Decidió abrir su propia
    clínica con política de transparencia documentada. La primera paciente
    de Sonrisa Plena fue una vecina de la cuadra que recibió plan de
    ortodoncia honesto que las otras 3 clínicas habían inflado.
  brand_evolution:
    - year: 2020
      milestone: "Apertura Av. Larco 1200, 1 sillón, solo Andrés. Pandemia retrasa volumen pero fortalece protocolos bioseguridad."
    - year: 2021
      milestone: "Incorporación de Dra. Sandra Pinto (ortodoncista certificada Invisalign). 2 sillones."
    - year: 2022
      milestone: "Equipo radiografía panorámica + tomografía cone-beam (CBCT)."
    - year: 2023
      milestone: "Apertura tercer sillón + Dra. Laura Vargas (endodoncia)."
    - year: 2024
      milestone: "1,800 pacientes acumulados. NPS 82."
    - year: 2025
      milestone: "Lanzamiento Plan Familiar Sonrisa Plena (membresía mensual recurrente)."
    - year: 2026
      milestone: "2,400 pacientes acumulados. Inicio expansión segunda sede en San Borja (Q3 2026)."

positioning:
  unique_value_proposition: >
    La única clínica dental en Miraflores con primera consulta gratuita
    incluyendo radiografía panorámica + plan escrito + cuotas tarjeta sin
    intereses + política documentada anti-cobros-adicionales-no-informados.
  brand_essence: "Odontología honesta para tu sonrisa de toda la vida"
  discriminator: "Plan escrito post-consulta con costos finales (sin 'depende del caso' vago) + cero sobreventa de tratamientos no necesarios"
  competitor_landscape:
    direct_competitors:
      - "Solución Dental Lince (referente Lima precios accesibles)"
      - "The Dental Clinic Miraflores+San Isidro (premium)"
      - "Dental Krebs San Isidro (boutique)"
      - "Smile Design Perú (especialistas estética)"
    differentiation: "Único centro Miraflores con primera consulta + radiografía panorámica gratis + transparencia precios documentada"
  ideal_customer_summary: "Profesional limeño 28-55 años con ingresos PEN 5-15k/mes, busca odontología sin sorpresas + planes realistas. También familias con hijos en edad pediátrica."

