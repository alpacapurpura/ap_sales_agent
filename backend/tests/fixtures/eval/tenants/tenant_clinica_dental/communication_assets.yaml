# ─────────────────────────────────────────────────────────────
# Nicolify scheduling integration
# ─────────────────────────────────────────────────────────────
scheduling:
  provider: "Nicolify scheduling (clon-Calendly built-in)"
  event_types:
    - id: "scheduling_evt_a3_l0_primera_consulta"
      name: "Primera consulta gratuita + radiografía panorámica"
      duration_minutes: 45
      offer_level: "L0"
      facilitator: "Dr. Andrés / Dra. Sandra / Dra. Laura (rotación según especialidad)"
      booking_url: "https://app.nicolify.com/schedule/sonrisa-plena/primera-consulta-gratis"
      pre_booking_questions:
        - "¿Cuál es tu motivo principal de consulta?"
        - "¿Hace cuánto tiempo no vas al dentista?"
        - "¿Tienes algún miedo o experiencia previa relevante?"
        - "¿Buscas para ti o para algún familiar?"
      capacity_per_week: 30
      timezone_default: "America/Lima"
      modality: "presencial"

    - id: "scheduling_evt_a3_l1_limpieza"
      name: "Limpieza dental"
      duration_minutes: 60
      offer_level: "L1"
      booking_url: "https://app.nicolify.com/schedule/sonrisa-plena/limpieza-dental"
      capacity_per_week: 40

    - id: "scheduling_evt_a3_l2_ortodoncia_diagnostico"
      name: "Diagnóstico ortodóntico (post-L0 si interés)"
      duration_minutes: 60
      offer_level: "L2"
      facilitator: "Dra. Sandra Pinto"
      booking_url: "https://app.nicolify.com/schedule/sonrisa-plena/diagnostico-ortodontico"
      includes_iTero_scan: true
      requires_l0_first: true

    - id: "scheduling_evt_a3_l3_diagnostico_estetico"
      name: "Diagnóstico estético + DSD digital"
      duration_minutes: 60
      offer_level: "L3"
      facilitator: "Dr. Andrés Restrepo"
      booking_url: "https://app.nicolify.com/schedule/sonrisa-plena/diagnostico-estetico"
      includes_dsd: true
      includes_mockup_directo_boca: true
      capacity_per_week: 8

    - id: "scheduling_evt_a3_l4_plan_familiar"
      name: "Evaluación Plan Familiar"
      duration_minutes: 45
      offer_level: "L4"
      booking_url: "https://app.nicolify.com/schedule/sonrisa-plena/plan-familiar-evaluacion"
      capacity_per_week: 10
      notes: "Duración varía según número de personas (30-45 min)"

# ─────────────────────────────────────────────────────────────
# Channel-specific messaging
# ─────────────────────────────────────────────────────────────
channel_specific_messaging:
  whatsapp:
    avg_response_time_hours: 2
    avg_message_length: "1-3 frases por mensaje"
    auto_reply_after_hours: "Hola, gracias por escribir. Respondemos lunes-viernes 9-20h, sábados 9-14h. Para emergencias dentales (paciente activo), línea 24/7. Si urge consulta: agenda primera consulta gratis https://sonrisa-plena.pe/consulta-gratis"
    business_hours: "Lunes-Viernes 9:00-20:00 / Sábados 9:00-14:00 hora Perú"
  instagram_dm:
    avg_response_time_hours: 4
    common_inbound_intents:
      - "Pregunta de precios ortodoncia/Invisalign"
      - "Pregunta de carillas estéticas"
      - "Comparación con otra clínica"
      - "Pedido de cotización"
      - "Miedo al dentista"
      - "Pediatría niños"
      - "Plan familiar"
    initial_response_template: "Saludo + qualifying clínico + bridge a primera consulta gratis"
  email:
    avg_response_time_hours: 24
    long_form_ok: true
    common_inbound_intents:
      - "Convenios corporativos"
      - "Solicitud presupuesto detallado pre-consulta"
      - "Reembolso seguros (Pacífico, Mapfre, Rímac)"

# ─────────────────────────────────────────────────────────────
# Convenios corporativos + seguros
# ─────────────────────────────────────────────────────────────
corporate_partnerships:
  active_count: 8
  partner_types: ["empresas medianas", "consultoras"]
  typical_discount: "10% off para empleados con carnet vigente + Plan Familiar 50% off primer mes"
  notable_partners: ["BCP", "Interbank", "Apurímac Software", "Belcorp", "Falabella"]
  partnership_inquiry_email: "alianzas@example.com"

insurance_acceptance:
  accepted: true
  insurers: ["Pacífico Seguros", "Mapfre", "Rímac Seguros", "Interseguro"]
  process: "Paciente paga upfront → emitimos factura → paciente solicita reembolso a su seguro"
  notes: "Algunos seguros cubren 60-80% de tratamientos restauradores. Estética NO cubierta típicamente."
