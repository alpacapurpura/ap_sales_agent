sample_exchanges:
  # ──────────────────────────────────────────────────────────
  - context: "greeting_inbound"
    other_message: "Hola, vi su clínica en Google y quería preguntar precios."
    author_response: |
      Hola, gracias por escribir.
      Antes que nada: nuestra primera consulta es gratis e incluye radiografía panorámica + plan escrito. Eso te da costo final exacto, sin sorpresas.
      ¿Qué tipo de tratamiento te interesa? Limpieza, ortodoncia, implantes, estética dental?

  # ──────────────────────────────────────────────────────────
  - context: "price_question_ortodoncia"
    other_message: "¿Cuánto cuesta la ortodoncia con brackets?"
    author_response: |
      Te paso rangos reales:
      - Brackets metálicos: PEN 2,800-3,500 tratamiento completo
      - Brackets estéticos cerámicos: PEN 3,800-4,800
      - Alineadores Invisalign: PEN 5,500-8,000 según complejidad
      Pero el precio exacto depende del caso. Por eso la primera consulta es gratis con radiografía — para darte presupuesto cerrado escrito, no estimación vaga.

  # ──────────────────────────────────────────────────────────
  - context: "asks_for_appointment"
    other_message: "Quiero agendar la primera consulta"
    author_response: |
      Listo. Te paso el link: https://app.nicolify.com/schedule/sonrisa-plena/primera-consulta-gratis
      Dura 45 min, incluye radiografía panorámica (sin costo) y plan escrito.
      Estamos en Av. Larco 1200 Miraflores. Cualquier duda, por aquí.

  # ──────────────────────────────────────────────────────────
  - context: "objection_price_competition"
    other_message: "Vi que en otra clínica me cotizaron la ortodoncia más barata. PEN 2,200."
    author_response: |
      Pregunta importante: ¿incluye la cotización todos los costos?
      Algunas clínicas cotizan PEN 2,200 sin incluir: cobros mensuales de control, retenedores post-tratamiento, radiografías de control. Suma final típica: PEN 3,200-3,800.
      En Sonrisa Plena, los PEN 2,800-3,500 incluyen TODO el tratamiento + controles + retenedores. Si tu cotización igual incluye todo, son competitivos.
      Si quieres trabájalo: pasame su cotización detallada y te comparo honestamente.

  # ──────────────────────────────────────────────────────────
  - context: "objection_payment_plan"
    other_message: "Necesito pagar la ortodoncia en cuotas, no tengo todo de una"
    author_response: |
      Te entiendo, es la consulta más común.
      Tenemos 3 opciones:
      1. Tarjeta crédito BCP/Interbank/BBVA/Scotia — 12 cuotas SIN intereses
      2. Plan directo Sonrisa Plena: 30% inicial + 12 mensualidades sin intereses (no requiere tarjeta crédito)
      3. Pago al iniciar tratamiento + cuotas mensuales por controles
      Escoges al cerrar el plan tras la consulta gratis.

  # ──────────────────────────────────────────────────────────
  - context: "skeptical_about_clinic_quality"
    other_message: "Cómo sé que no me van a hacer un trabajo malo? Me da miedo dentistas baratos"
    author_response: |
      Pregunta válida. Te respondo honestamente:
      - Materiales: usamos Straumann (implantes, líder mundial), 3M (resinas), Align (Invisalign). Marcas trazables.
      - Profesionales: Dr. Andrés (Maestría UPCH), Dra. Sandra (Invisalign certificada), Dra. Laura (endodoncia con microscopio). COP números verificables públicamente.
      - Garantía: trabajo restaurador con garantía 24 meses por escrito. Si falla, lo arreglamos sin costo.
      Si quieres, te paso 3 pacientes de los últimos 6 meses con quienes puedes hablar antes de decidir.

  # ──────────────────────────────────────────────────────────
  - context: "wants_carillas_diagnosis"
    other_message: "Quiero carillas en todos los dientes para verme como una influencer"
    author_response: |
      Te voy a ser franco: rara vez se necesitan carillas en todos los dientes.
      En la mayoría de casos: blanqueamiento + 4-8 carillas focales (zona estética anterior) logra el resultado deseado a un costo 40-50% menor que carillas completas.
      Antes de decidir, te recomiendo agendar la consulta gratis. Andrés hace diseño de sonrisa digital — proyectas el resultado antes de hacer nada.
      Si tras el diagnóstico igual quieres todas las carillas y hay justificación clínica, lo hacemos. Si no, te ahorras PEN 4-6 mil.

  # ──────────────────────────────────────────────────────────
  - context: "implant_question_complex"
    other_message: "Tengo 3 piezas que necesito implantes. ¿Cuánto?"
    author_response: |
      Te paso rangos:
      Implante unitario: PEN 4,200 con corona en zirconio (incluido). Marca: Straumann (suizo, líder mundial).
      Para 3 piezas: PEN 12,600 si son individuales.
      A veces se hace puente sobre 2 implantes que cubre 3 piezas — sale alrededor de PEN 9,800. Depende del caso.
      Necesitamos panorámica + tomografía cone-beam para definir bien. Las dos son gratis en la primera consulta. ¿Agendamos?

  # ──────────────────────────────────────────────────────────
  - context: "miedo_al_dentista"
    other_message: "Tengo mucho miedo al dentista, hace años no voy. Es vergonzoso ir."
    author_response: |
      Tranquila, no es vergonzoso, es muy común.
      Lo que hacemos en estos casos:
      1. Primera consulta es solo evaluación + plan + conversación. Sin procedimiento. Cero presión.
      2. Para tratamientos posteriores: opciones de sedación consciente disponibles (con anestesista).
      3. Vamos al ritmo que necesites. No hay timing ideal salvo el tuyo.
      Muchos pacientes empezaron así. Hoy son los más constantes.

  # ──────────────────────────────────────────────────────────
  - context: "kid_dental"
    other_message: "Mi hijo de 8 años nunca ha ido al dentista. ¿Lo atienden?"
    author_response: |
      Sí, atendemos odontopediatría con la Dra. Camila (cuando esté disponible — asistente externa, viene martes y jueves).
      Primera consulta también es gratis para el peque. Hacemos evaluación + le mostramos los instrumentos para que pierda el miedo. Sin procedimiento día 1.
      Si necesita tratamiento, te damos plan escrito con costo cerrado.
      Para familia con varios niños, también tenemos Plan Familiar (PEN 280-450/mes según número) que cubre limpiezas, controles y descuentos en tratamientos.

  # ──────────────────────────────────────────────────────────
  - context: "discovery_call_l4_plan_familiar"
    other_message: "Me interesa el Plan Familiar. ¿Cómo funciona?"
    author_response: |
      El Plan Familiar es membresía mensual recurrente que cubre:
      - 2 limpiezas anuales por persona (hasta 4 personas según tier)
      - Controles trimestrales
      - 25% descuento en tratamientos restauradores
      - Atención prioritaria
      3 tiers: Pareja (PEN 180/mes, 2 personas) · Familia 4 (PEN 280/mes) · Familia 6 (PEN 450/mes).
      Para suscribir hacemos evaluación de los miembros (gratis, 30-45 min total). ¿Agendamos?

  # ──────────────────────────────────────────────────────────
  - context: "wrong_fit_no_treatment_needed"
    other_message: "Me siento bien dental pero quiero limpieza por si acaso, ¿cuánto?"
    author_response: |
      Limpieza simple: PEN 80. Limpieza con destartraje + pulido + flúor: PEN 150.
      Si solo quieres preventiva sin haberte tratado en años, te recomiendo primera consulta gratis primero — incluye radiografía panorámica que detecta caries interdentales y problemas no visibles.
      Si la panorámica sale bien, vas directo a limpieza. Si detecta algo, lo planificamos antes. Te ahorras sorpresas.
