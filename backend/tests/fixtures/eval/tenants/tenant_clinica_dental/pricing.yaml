# pricing.yaml — tenant_clinica_dental
# Sonrisa Plena Clínica Dental — Miraflores Lima.
# Currency: PEN. Q3 ratificado single-currency seed.
# Benchmarks reales Lima 2026.

currency: PEN
country: PE
tax_regime: "RG"
tax_id_label: "RUC"
issues_invoice: true
invoice_types: ["boleta", "factura"]

payment_methods:
  - method: "yape"
    label: "Yape"
    fees: "0%"
    settlement_time: "instantáneo"
    notes: "Para pagos únicos servicios + mensualidades Plan Familiar."
  - method: "plin"
    label: "Plin"
    fees: "0%"
    settlement_time: "instantáneo"
  - method: "transferencia_bancaria"
    label: "Transferencia bancaria"
    accepted_banks: ["BCP", "Interbank", "BBVA", "Scotiabank", "Banbif"]
    fees: "0%"
    settlement_time: "1-2 días hábiles"
  - method: "tarjeta_credito_debito"
    label: "Tarjeta crédito/débito (Visa, Mastercard)"
    processor: "Niubiz POS + Culqi online"
    fees: "incluidas en precio"
    settlement_time: "instantáneo"
    cuotas_sin_intereses: "Disponible 3, 6, 12, 18 cuotas en BCP, Interbank, BBVA, Scotiabank, Banbif para tarjetas peruanas"
  - method: "plan_directo_clinica"
    label: "Plan de pago directo Sonrisa Plena (sin tarjeta)"
    notes: "30% inicial + 12 mensualidades sin intereses. Solo para tratamientos >PEN 2,500. Requiere DNI + comprobante ingresos."
  - method: "tarjeta_recurrente_membresia"
    label: "Tarjeta recurrente (Plan Familiar mensual)"
    processor: "Culqi suscripciones"
    notes: "Cobro automático mensual día 1 de cada mes. Email confirmación + pre-aviso 3 días antes."
  - method: "efectivo"
    label: "Efectivo"
    notes: "Aceptamos en clínica. Para cuotas >PEN 1,000 preferimos transferencia o tarjeta."

