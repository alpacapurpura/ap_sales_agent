# ─────────────────────────────────────────────────────────────
# Refund matrix
# ─────────────────────────────────────────────────────────────
refund_matrix:
  L0:
    has_guarantee: false
    notes: "Servicio gratuito"
  L1:
    has_guarantee: false
    notes: "Sin reembolso post-procedimiento (servicio único realizado)"
  L2:
    has_guarantee: "pre_inicio_only"
    period_days: 0
    refund_pct_pre_inicio: 80
    refund_pct_post_inicio: 0
    conditions: "Si cancelas antes de instalar brackets, 80% reembolso. Una vez instalados, no hay reembolso pero se puede pausar 1 mes por causa justificada (mudanza, enfermedad, etc.)."
    quality_guarantee: "Garantía 24 meses post-retiro: si recidiva ortodóntica, re-tratamiento sin costo."
  L3:
    has_guarantee: "quality_only"
    notes: "Sin reembolso pero garantía 24-36 meses por escrito en restauraciones (carillas, coronas). Si falla material o procedimiento dentro de garantía, lo arreglamos sin costo."
  L4:
    has_guarantee: false
    period_days: 0
    cancellation_pre_12_months: "Si cancelas antes de 12 meses: cobramos servicios ya consumidos a precio regular (sin descuento de plan). El monto pagado en mensualidades se descuenta."
    cancellation_post_12_months: "Cancela libre con 30 días de aviso."

# ─────────────────────────────────────────────────────────────
# Pricing philosophy
# ─────────────────────────────────────────────────────────────
pricing_philosophy: |
  Precios alineados con benchmarks Lima 2026 — competitivos sin ser
  los más bajos. Diferencial: cero cargos adicionales no informados.

  Política transparencia:
  - Plan escrito post-consulta = costo final exacto
  - Cero cargos sorpresa (controles, retenedores, materiales — todo incluido)
  - Cuotas sin intereses con tarjeta peruana 3-18 cuotas
  - Plan directo Sonrisa Plena para clientes sin tarjeta crédito
  - Garantía escrita 24-36 meses según tratamiento

  NO ofrecemos:
  - Promociones tipo Cuponidad (problema: trazabilidad de materiales)
  - Descuentos negociados 1:1 fuera de los descuentos publicados
  - Becas (somos servicio, no infoproducto)

# ─────────────────────────────────────────────────────────────
# Tax / facturación
# ─────────────────────────────────────────────────────────────
invoicing:
  emite_boleta: true
  emite_factura: true
  factura_requires_ruc: true
  empresa_legal: "Sonrisa Plena SRL (RUC 20XXXXXXXXX, Régimen General)"
  notes: "Servicios odontológicos exonerados de IGV en algunos casos (consulte con SUNAT). Procedimientos estéticos gravados."

corporate_options:
  empresas_convenio: true
  notes: "Convenio activo con 8 empresas Lima — empleadas reciben 10% off + Plan Familiar al 50% primer mes."
  partners: ["Pacífico Seguros", "Mapfre", "Rímac Seguros", "Interseguro"]
  insurance_acceptance: "Aceptamos reembolso con seguros (Pacífico, Mapfre, Rímac, Interseguro). El paciente paga upfront y nosotros emitimos factura para que solicite reembolso."
