[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "src/tests"]
asyncio_mode = "auto"
addopts = "-m 'not verify'"
markers = [
    "integration: live integration tests requiring external credentials",
    "verify: data reliability verification tests requiring real DB data",
]

[tool.coverage.run]
source = ["src/modules", "src/shared"]
omit = [
    "*/models/*",
    "*/migrations/*",
    "*/__init__.py",
    "*/workers/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 43
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@abstractmethod",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Industry standard for FastAPI projects (was 88, raised in Wave 5).
line-length = 120
indent-width = 4

# Assume Python 3.11
target-version = "py311"

[tool.ruff.lint]
select = [
    # --- Core ---
    "E4", "E7", "E9", "F",  # pycodestyle errors + pyflakes
    "W",                       # pycodestyle warnings (trailing whitespace, etc.)
    "I",                       # isort: orden de imports
    "UP",                      # pyupgrade: Python 3.11+ patterns
    # --- Bugs & Security ---
    "B",                       # flake8-bugbear: bugs comunes
    "S",                       # flake8-bandit: seguridad
    "C901",                    # Complejidad ciclomática
    "PERF",                    # perflint: anti-patrones de performance
    "DTZ",                     # flake8-datetimez: timezone awareness
    # --- Code Quality ---
    "SIM",                     # flake8-simplify
    "PIE",                     # flake8-pie: unnecessary code
    "RET",                     # flake8-return: simplificar returns
    "RSE",                     # flake8-raise: raise style
    "C4",                      # flake8-comprehensions
    "FURB",                    # refurb: modernizations
    "FLY",                     # flynt: f-string conversions
    # --- Style & Naming ---
    "N",                       # pep8-naming
    "A",                       # flake8-builtins: shadow builtins
    "ISC",                     # flake8-implicit-str-concat
    "T20",                     # flake8-print: detectar print()
    "LOG",                     # flake8-logging
    "ERA",                     # eradicate: commented-out code
    "PGH",                     # pygrep-hooks
    # --- Testing ---
    "PT",                      # flake8-pytest-style
    # --- Type Safety ---
    "TCH",                     # flake8-type-checking: imports behind TYPE_CHECKING
    # --- Pylint subset ---
    "PL",                      # pylint rules (PLC, PLE, PLR, PLW)
    # --- Ruff-specific ---
    "RUF",                     # ruff-specific rules
    # --- Arguments & Patterns ---
    "ARG",                     # flake8-unused-arguments
    "FBT",                     # flake8-boolean-trap
    "EM",                      # flake8-errmsg: exception messages
    # --- Structure ---
    "INP",                     # implicit namespace package: require __init__.py
    # --- Wave 4: zero-effort wins (0 violations) ---
    "YTT",                     # flake8-2020: sys.version checks
    "ASYNC",                   # flake8-async: async patterns
    "FA",                      # flake8-future-annotations
    "ICN",                     # flake8-import-conventions
    "Q",                       # flake8-quotes
    "SLOT",                    # flake8-slots
    "TID",                     # flake8-tidy-imports
    "INT",                     # flake8-gettext
    "T10",                     # flake8-debugger
    "EXE",                     # flake8-executable
    # --- Wave 5 ---
    "E501",                    # line-too-long (line-length=120)
    "FAST",                    # fastapi: Annotated dependencies
    "ANN",                     # type annotations (src/ only, tests exempt)
    "D",                       # pydocstyle: docstrings (src/ only, Google convention)
    # --- Wave 4: fix + activate ---
    "NPY",                     # numpy deprecated APIs
    "PYI",                     # stub file / typing best practices
    "PTH",                     # flake8-use-pathlib
    "TD",                      # flake8-todos: TODO format
    "FIX",                     # flake8-fixme: flag remaining TODOs
    "G",                       # flake8-logging-format
    "TRY",                     # tryceratops: exception patterns
    "BLE",                     # flake8-blind-except
]
ignore = [
    # === Permanent ignores — false positives for FastAPI/DDD/Spanish stack ===
    "B008",     # Function calls in defaults — FastAPI Depends/Header/Query. 652 usos.
    "RET504",   # Unnecessary var before return — readability preference
    "UP017",    # datetime.UTC alias — prefer explicit timezone.utc
    "PLR2004",  # Magic values in comparisons — too noisy, low value. 194 usos.
    "PLR0913",  # Too many function arguments — FastAPI/DDD constructors. 145 usos.
    "PLC0415",  # import not at top — conditional imports avoid circulars. 383 usos.
    "ARG001",   # Unused function argument — FastAPI deps, interface contracts. 45 usos.
    "ARG002",   # Unused method argument — interface implementations. 80 usos.
    "RUF001",   # Ambiguous unicode — Spanish text in prompts is intentional. 37 usos.
    "RUF012",   # Mutable ClassVar — Pydantic models handle this differently. 44 usos.
    "FBT001",   # Boolean positional arg — common in services. 61 usos.
    "FBT002",   # Boolean default value — common pattern. 33 usos.
    "PT028",    # Pytest fixture default — false positive on FastAPI test_* with Depends()
    # === Format conflicts ===
    "ISC001",   # Implicit string concat — conflicts with ruff format
    "COM812",   # Trailing comma — conflicts with ruff format
    # === Bandit security false positives (OAuth/connection/Docker config) ===
    "S105",     # Hardcoded password string — OAUTHLIB_RELAX_TOKEN_SCOPE, credential enums
    "S106",     # Hardcoded password func arg — OAuth/API credential fields
    "S107",     # Hardcoded password default — credential config patterns
    "S108",     # Hardcoded temp file — /tmp paths in Docker config
    "S104",     # Hardcoded bind-all-interfaces — Docker dev server uses 0.0.0.0
    "S110",     # try-except-pass — intentional resilience in orchestrators
    "S311",     # Non-cryptographic random — request IDs, not security
    "S324",     # Insecure hash — MD5 for cache keys, not security
    "S608",     # SQL injection — false positive on GAQL (Google Ads Query Language)
    "S701",     # Jinja2 autoescape — intentionally disabled for prompt templates
    # === SQLAlchemy patterns (== True/False/None required for SQL generation) ===
    "E712",     # True/False comparison — Model.col == True generates WHERE col = TRUE
    "E711",     # None comparison — Model.col == None generates WHERE col IS NULL
    # === Import order (sys.path manipulation, conditional loading) ===
    "E402",     # Module import not at top — sys.path + conditional imports
    # === Tryceratops — too opinionated for enforcement ===
    "TRY300",   # try-consider-else — reduces readability in our patterns
    # === Docstrings — Pydantic nested classes ===
    "D106",     # undocumented nested class — Pydantic Config, Meta classes
    # === Progressive adoption: fix gradually, remove from ignore ===
    # B904, SIM105, EM101, EM102, ERA001, PERF401, T201 — ENFORCED (2026-04-12)
    # DTZ003, DTZ006, DTZ007, PERF203, N818, N811, N814, N815, RUF002, PLW0603, PLW2901, PLC0206, UP042 — ENFORCED (2026-04-13)
    # FBT003, N806, A002, DTZ011 — ENFORCED (2026-04-13)
    # N801, N802, PLR0911, PLR0912, PLR0915 — ENFORCED (Wave 3, 2026-04-13)
    # RUF013, DTZ005 — ENFORCED (Wave 4, 2026-04-13): 42 + 7 fixes
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert in tests is standard
    "ARG",     # unused args common in fixtures/parametrize
    "PT",      # pytest style — legacy tests have mixed patterns
    "PLR2004", # magic values in test assertions are fine
    "T201",    # print() in tests is acceptable for debugging output
    "N806",    # MockClient = MagicMock(...) is standard test pattern
    "DTZ011",  # date.today() in test fixtures is acceptable
    "PLR0912", # complex test helper functions are acceptable
    "F401",    # side-effect imports for model registration in conftest
    "ANN",     # type annotations not required in tests
    "D",       # docstrings not required in tests
]
"src/tests/**/*.py" = [
    "S101", "ARG", "PT", "PLR2004", "T201", "N806", "DTZ011", "PLR0912",
    "INP001",  # src/tests/ is a testpath, not a package — __init__.py conflicts with tests/
    "ANN",     # type annotations not required in tests
    "D",       # docstrings not required in tests
]
"src/scripts/**/*.py" = [
    "T201",    # CLI scripts legitimately use print() for output
    "PLR0912", # one-shot migration scripts — not worth refactoring
    "PLR0915", # one-shot migration scripts — not worth refactoring
]
"src/modules/brand/tests/**/*.py" = [
    "S101", "ARG", "PT", "PLR2004", "T201", "ANN", "D",
]
"src/admin/**/*.py" = [
    "C901",     # too complex — Streamlit pages are monolithic by design
    "PLR0911",  # too many return statements — Streamlit pages
    "PLR0912",  # too many branches — Streamlit pages
    "PLR0915",  # too many statements — Streamlit pages
    "SIM102",   # collapsible if — Streamlit nested conditionals clearer separate
    "SIM117",   # multiple with — Streamlit col/container nesting is idiomatic
]
"alembic/versions/*.py" = [
    "INP001",  # alembic/versions/ is not a package — no __init__.py by convention
    "D103",    # upgrade()/downgrade() don't need docstrings in migrations
    "D415",    # migration file docstrings follow alembic template (no trailing punctuation)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 15  # Wave 4: lowered from 20 (industry standard: 10)

[tool.ruff.lint.flake8-type-checking]
# Classes whose annotations are evaluated at runtime (Pydantic, SA 2.0).
# Imports used by their fields MUST stay at module level, not in TYPE_CHECKING.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "src.shared.domain.base_entity.BaseEntity",
    "src.shared.domain.base_entity.Base",
    "sqlalchemy.orm.DeclarativeBase",
]
runtime-evaluated-decorators = [
    "pydantic.validate_call",
    "dataclasses.dataclass",
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
