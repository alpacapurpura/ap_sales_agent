name: 🚀 Deploy to Production

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/alpacapurpura/visionarias-backend
  FRONTEND_IMAGE: ghcr.io/alpacapurpura/visionarias-frontend

jobs:
  quality-gates:
    name: ✅ Docker Lint & Test Gates
    runs-on: ubuntu-latest
    environment: ap_sales_agent

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend lint image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: lint
          load: true
          tags: visionarias/backend-lint:ci

      - name: Run backend lint
        run: docker run --rm visionarias/backend-lint:ci

      - name: Check backend formatting
        run: docker run --rm visionarias/backend-lint:ci ruff format --check src

      - name: Build backend test image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: test
          load: true
          tags: visionarias/backend-test:ci

      - name: Backend tests with coverage
        run: |
          docker run --name backend-test-ci visionarias/backend-test:ci \
            pytest --cov=src/modules --cov=src/shared --cov-report=term --cov-report=xml:/app/coverage-backend.xml -q --ignore=tests/modules/analytics/test_meta_provider.py
          docker cp backend-test-ci:/app/coverage-backend.xml coverage-backend.xml
          docker rm backend-test-ci

      - name: Build frontend test image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: test
          load: true
          tags: visionarias/frontend-test:ci

      - name: Run frontend lint
        run: docker run --rm visionarias/frontend-test:ci npm run lint

      - name: Frontend type check (TypeScript)
        run: docker run --rm visionarias/frontend-test:ci npx tsc --noEmit

      - name: Frontend tests with coverage
        run: |
          docker run --name frontend-test-ci visionarias/frontend-test:ci \
            npx vitest run --coverage --reporter=json --outputFile=coverage-frontend.json
          docker cp frontend-test-ci:/app/coverage-frontend.json coverage-frontend.json
          docker rm frontend-test-ci

      - name: Python dependency audit
        run: docker run --rm visionarias/backend-test:ci pip-audit --strict --desc
        continue-on-error: true

      - name: Frontend dependency audit
        run: docker run --rm visionarias/frontend-test:ci npm audit --audit-level=high
        continue-on-error: true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            coverage-backend.xml
            coverage-frontend.json
          retention-days: 30

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: coverage-backend.xml,coverage-frontend.json
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: backend,frontend
          fail_ci_if_error: false

  e2e-smoke:
    name: 🎭 E2E Smoke Tests
    runs-on: ubuntu-latest
    environment: ap_sales_agent
    needs: quality-gates
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (~25 GB)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: docker/setup-buildx-action@v3

      - name: Create .env for docker compose
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: http://api_dev:8000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          INTERNAL_API_URL: http://api_dev:8000
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          E2E_CLERK_USER_USERNAME: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
          E2E_TENANT_ID: ${{ secrets.E2E_TENANT_ID }}
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visionarias_test
          TRAEFIK_NETWORK: gateway
        run: |
          env | grep -E '^(NEXT_PUBLIC_|CLERK_|INTERNAL_|E2E_|POSTGRES_|TRAEFIK_|SHOPIFY_)' > .env
          echo "API_DOMAIN=localhost" >> .env
          echo "DASHBOARD_DOMAIN=http://localhost:3000" >> .env
          echo "CLOUDFLARE_TUNNEL_TOKEN=disabled" >> .env
          echo "SHOPIFY_API_KEY=disabled" >> .env
          echo "SHOPIFY_API_SECRET=disabled" >> .env
          echo "SHOPIFY_APP_URL=http://localhost:8000" >> .env
          # Backend Settings required fields (dummy values for E2E)
          echo "LOG_LEVEL=WARNING" >> .env
          echo "DOMAIN_NAME=localhost" >> .env
          echo "API_SECRET_KEY=e2e-test-secret-key-not-real" >> .env
          echo "WHATSAPP_API_TOKEN=disabled" >> .env
          echo "WHATSAPP_PHONE_NUMBER_ID=disabled" >> .env
          echo "WHATSAPP_VERIFY_TOKEN=disabled" >> .env
          echo "OPENAI_API_KEY=sk-disabled-for-e2e" >> .env
          echo "REDIS_URL=redis://redis:6379/0" >> .env
          echo "QDRANT_URL=http://qdrant:6333" >> .env
          echo "POSTGRES_HOST=postgres" >> .env
          echo "POSTGRES_PORT=5432" >> .env
          echo "API_URL=http://api_dev:8000" >> .env

      - name: Generate Clerk testing token
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          TOKEN=$(curl -s -X POST "https://api.clerk.com/v1/testing_tokens" \
            -H "Authorization: Bearer $CLERK_SECRET_KEY" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('token',''))")
          echo "CLERK_TESTING_TOKEN=$TOKEN" >> .env

      - name: Start services
        run: |
          docker network create gateway || true
          docker compose up -d --build postgres redis qdrant api_dev client_dashboard_dev
          echo "--- Disk usage after build ---"
          df -h / | tail -1
          echo "Waiting for Next.js to be healthy..."
          for i in $(seq 1 30); do
            if docker exec visionarias_client_dev wget -q --spider http://localhost:3000 2>/dev/null; then
              echo "Next.js ready after $((i*10))s"
              break
            fi
            sleep 10
          done

      - name: Run migrations
        run: docker exec visionarias_brain_dev bash -c "cd /app && alembic upgrade head"

      - name: Run E2E smoke tests
        run: |
          docker compose --profile e2e run --rm e2e_runner \
            npx playwright test --grep @smoke

      - name: Cleanup
        if: always()
        run: docker compose --profile e2e down -v 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  security-scan:
    name: 🔐 Vulnerability Scan
    runs-on: ubuntu-latest
    environment: ap_sales_agent
    needs: [quality-gates]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image for scan
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: final
          load: true
          tags: visionarias/backend-scan:${{ github.sha }}

      - name: Build frontend image for scan
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: runner
          load: true
          tags: visionarias/frontend-scan:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=ci-placeholder-key
            NEXT_PUBLIC_API_URL=http://localhost:8000
            NEXT_PUBLIC_APP_URL=http://localhost:3000
            INTERNAL_API_URL=http://localhost:8000

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: visionarias/backend-scan:${{ github.sha }}
          format: table
          scanners: vuln
          pkg-types: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: visionarias/frontend-scan:${{ github.sha }}
          format: table
          scanners: vuln
          pkg-types: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  build:
    name: 🔨 Build & Push Images
    runs-on: ubuntu-latest
    environment: ap_sales_agent
    needs:
      - quality-gates
      - security-scan
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx (layer cache support)
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: final
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: runner
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            INTERNAL_API_URL=${{ secrets.INTERNAL_API_URL }}
          cache-from: type=gha,scope=frontend-v2
          cache-to: type=gha,scope=frontend-v2,mode=max

  deploy:
    name: 🚢 Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: ap_sales_agent

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: docker-compose.prod.yml
          target: ${{ secrets.VPS_APP_PATH }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ github.sha }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 30s
          command_timeout: 10m
          envs: DEPLOY_SHA,VPS_APP_PATH
          script: |
            set -e

            cd ${VPS_APP_PATH}

            echo "🔧 Patching .env.prod with any missing required variables..."
            grep -q "^API_URL=" .env.prod || echo "API_URL=http://backend:8000" >> .env.prod

            echo "🏷️ Setting SENTRY_RELEASE to current commit SHA..."
            sed -i "s/^SENTRY_RELEASE=.*/SENTRY_RELEASE=${DEPLOY_SHA}/" .env.prod
            sed -i "s/^NEXT_PUBLIC_SENTRY_RELEASE=.*/NEXT_PUBLIC_SENTRY_RELEASE=${DEPLOY_SHA}/" .env.prod

            echo "🔐 Logging into GHCR..."
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u alpacapurpura --password-stdin

            echo "📦 Pulling new images..."
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull backend frontend

            echo "♻️ Restarting services..."
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans

            echo "🗄️ Running database migrations..."
            docker exec visionarias_brain alembic upgrade head

            echo "Waiting 30s for services to stabilise..."
            sleep 30

            echo "Container status:"
            docker compose -f docker-compose.prod.yml --env-file .env.prod ps

            echo "Backend logs (last 50 lines):"
            docker logs visionarias_brain --tail 50 2>&1 || true

            echo "Cleaning up old images..."
            docker image prune -f

            echo "Deploy completed at $(date)"

  healthcheck:
    name: 🏥 Health Check
    runs-on: ubuntu-latest
    needs: deploy
    environment: ap_sales_agent

    steps:
      - name: Check API health
        env:
          API_DOMAIN: ${{ secrets.API_DOMAIN }}
        run: |
          echo "Waiting 30s for API to be ready (startup buffer)..."
          sleep 30
          echo "--- Verbose Traefik probe ---"
          curl -sv --max-time 10 "https://${API_DOMAIN}/health/ready" 2>&1 | head -60 || true
          echo "--- End probe ---"
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${API_DOMAIN}/health/ready")
            if [ "$STATUS" = "200" ]; then
              echo "API health check passed (HTTP $STATUS)"
              exit 0
            fi
            echo "  Attempt $i/12: HTTP $STATUS — retrying in 15s..."
            sleep 15
          done
          echo "API health check failed after 3 minutes: HTTP $STATUS"
          exit 1

      - name: Check Frontend health
        run: |
          echo "⏳ Waiting for Frontend to be ready..."
          for i in {1..8}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.APP_DOMAIN }}/sign-in)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Frontend health check passed (HTTP $STATUS)"
              exit 0
            fi
            echo "  Attempt $i/8: HTTP $STATUS — retrying in 15s..."
            sleep 15
          done
          echo "❌ Frontend health check failed after 2 minutes: HTTP $STATUS"
          exit 1

  deploy-worker:
    name: ☁️ Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    needs: quality-gates
    continue-on-error: true
    environment: ap_sales_agent

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy sentry-slack-alerts worker
        working-directory: workers/sentry-slack-alerts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

  notify-failure:
    name: 🚨 Notify Deploy Failure
    runs-on: ubuntu-latest
    needs: [deploy, healthcheck]
    if: failure()
    environment: ap_sales_agent
    steps:
      - name: Send Slack alert
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
        if: env.SLACK_WEBHOOK != ''
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🚨 *DEPLOY FAILED*: `nicolify@${{ github.sha }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
