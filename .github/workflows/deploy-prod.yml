name: 🚀 Deploy to Production

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/alpacapurpura/visionarias-backend
  FRONTEND_IMAGE: ghcr.io/alpacapurpura/visionarias-frontend

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Build Docker images and push to GHCR
  # Runs on GitHub's servers — zero load on your VPS
  # ─────────────────────────────────────────────────────────────
  build:
    name: 🔨 Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # required to push to GHCR

    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # automatic, no config needed

      - name: Set up Docker Buildx (layer cache support)
        uses: docker/setup-buildx-action@v3

      # --- Backend ---
      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: final
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # --- Frontend ---
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: runner
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Deploy to VPS via SSH
  # Only runs after build succeeds
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: 🚢 Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: ap_sales_agent

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: docker-compose.prod.yml
          target: ${{ secrets.VPS_APP_PATH }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 30s
          command_timeout: 10m
          script: |
            set -e  # exit on any error

            cd ${{ secrets.VPS_APP_PATH }}

            echo "🔐 Logging into GHCR..."
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u alpacapurpura --password-stdin

            echo "📦 Pulling new images..."
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull backend frontend

            echo "♻️ Restarting services..."
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans

            echo "🗄️ Running database migrations..."
            docker exec visionarias_brain alembic upgrade head

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "✅ Deploy completed at $(date)"

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Health check
  # Verifies the app is responding after deploy
  # ─────────────────────────────────────────────────────────────
  healthcheck:
    name: 🏥 Health Check
    runs-on: ubuntu-latest
    needs: deploy
    environment: ap_sales_agent

    steps:
      - name: Check API health
        run: |
          echo "⏳ Waiting for API to be ready..."
          for i in {1..8}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.API_DOMAIN }}/health)
            if [ "$STATUS" = "200" ]; then
              echo "✅ API health check passed (HTTP $STATUS)"
              exit 0
            fi
            echo "  Attempt $i/8: HTTP $STATUS — retrying in 15s..."
            sleep 15
          done
          echo "❌ API health check failed after 2 minutes: HTTP $STATUS"
          exit 1

      - name: Check Frontend health
        run: |
          echo "⏳ Waiting for Frontend to be ready..."
          for i in {1..8}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.APP_DOMAIN }}/sign-in)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Frontend health check passed (HTTP $STATUS)"
              exit 0
            fi
            echo "  Attempt $i/8: HTTP $STATUS — retrying in 15s..."
            sleep 15
          done
          echo "❌ Frontend health check failed after 2 minutes: HTTP $STATUS"
          exit 1
