name: 🔌 Test SSH Connection

on:
  workflow_dispatch:  # solo se dispara manualmente

jobs:
  test-ssh:
    name: Test VPS Connectivity
    runs-on: ubuntu-latest
    steps:
      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 15s
          command_timeout: 1m
          script: |
            echo "✅ SSH connection successful"
            echo "🖥️  Hostname: $(hostname)"
            echo "📁 App path exists: $(test -d ${{ secrets.VPS_APP_PATH }} && echo YES || echo NO)"
            echo "🐳 Docker version: $(docker --version)"
            echo "🔐 GHCR login test..."
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u alpacapurpura --password-stdin && echo "✅ GHCR login OK" || echo "❌ GHCR login FAILED"
