name: LLM Eval Gate

# Triggers on PRs that touch:
#   - .env / .env.example AI_MODEL_* values
#   - alembic migrations llm_role_binding seed
#   - litellm_config.yaml model declarations
# Blocks merge when score < per-role threshold.

on:
  pull_request:
    paths:
      - ".env.example"
      - "litellm_config.yaml"
      - "backend/alembic/versions/118_llm_role_binding_seed_from_env.py"
      - "backend/src/modules/copilot/evals/**"

jobs:
  eval-gate:
    name: Run LLM eval gate (score >= threshold)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -e ".[dev]"

      - name: Run classifier eval gate
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          python -m src.modules.copilot.evals.runner --use=classifier --threshold=0.95
        continue-on-error: false

      - name: Run summarizer eval gate
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          python -m src.modules.copilot.evals.runner --use=summarizer --threshold=0.95
        continue-on-error: false

      - name: Comment on PR with results
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ **LLM eval gate failed.** Score below threshold for at least one role. See workflow logs for details.'
            })
